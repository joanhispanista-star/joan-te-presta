<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Joan te presta · Mi cuenta de socio</title>
<meta name="theme-color" content="#0C0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi cuenta">
<link rel="manifest" href="socio.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<style>
/* ===========================================================================
   Una placa de laca negra con filete de oro, sobre papel blanco, y un solo
   golpe de rojo donde se actúa.
   · Lo que es del socio (cupo, garantía, lo construido) vive sobre la laca.
   · Lo demás vive sobre papel, en tinta y gris, sin color.
   · El rojo es SUSTANTIVO: la marca y el gesto de avanzar. Nunca un estado,
     nunca una cifra de plata. Todos los estados son ámbar.
   =========================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --tinta:#0C0A0B; --papel:#FFFFFF; --fondo:#F6F3F0;
  --rojo:#D81F26; --oro:#B98322; --ambar:#9A5B12;
  --gris:#6E6460; --linea:#E9E3DD;
  --oro-laca:#E9BE68;              /* el oro sobre la laca, siempre el claro */
  --blanco-laca:#FBF7F4;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--tinta:#EDE7E4; --papel:#151113; --fondo:#0B0A0A;
        --rojo:#FF4C41; --oro:#E9BE68; --ambar:#F2B85E;
        --gris:#9C918B; --linea:#262021;}
}
:root[data-theme="dark"]{
  --tinta:#EDE7E4; --papel:#151113; --fondo:#0B0A0A;
  --rojo:#FF4C41; --oro:#E9BE68; --ambar:#F2B85E;
  --gris:#9C918B; --linea:#262021;
}
:root[data-theme="light"]{
  --tinta:#0C0A0B; --papel:#FFFFFF; --fondo:#F6F3F0;
  --rojo:#D81F26; --oro:#B98322; --ambar:#9A5B12;
  --gris:#6E6460; --linea:#E9E3DD;
}

html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-family:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.muted{color:var(--gris)}
.oculto{display:none!important}

/* ---------------- la laca ---------------- */
.laca{
  position:relative; isolation:isolate; border-radius:var(--r);
  color:var(--blanco-laca); -webkit-font-smoothing:antialiased;
  background:
    linear-gradient(103deg, transparent 32%, rgba(255,255,255,.05) 45%, transparent 60%),
    radial-gradient(140% 110% at 16% -25%, #2A2224 0%, #14100F 45%, #0A0809 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.13),
    inset 0 -1px 0 rgba(0,0,0,.55),
    0 18px 38px -20px rgba(12,10,11,.45);
}
.laca::after{                       /* el filete de oro que se apaga en los extremos */
  content:''; position:absolute; left:20px; right:20px; bottom:0; height:1px;
  background:linear-gradient(90deg, transparent,
    rgba(233,190,104,.55) 20%, rgba(233,190,104,.95) 50%, rgba(233,190,104,.55) 80%, transparent);
}
.laca::before{                      /* grano, contra el banding del degradado */
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  opacity:.045; mix-blend-mode:overlay; background-size:140px 140px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
.laca .muted{color:rgba(251,247,244,.62)}
.laca .fila{border-color:rgba(255,255,255,.12)}
.laca .fila .k{color:rgba(251,247,244,.62)}
.lustre{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:2}
.lustre i{position:absolute;top:-30%;bottom:-30%;width:38%;transform:skewX(-14deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent);
  animation:lustre 1.1s cubic-bezier(.25,.8,.25,1) .2s both}
@keyframes lustre{from{transform:translateX(-40%) skewX(-14deg)}to{transform:translateX(140%) skewX(-14deg)}}
@media (prefers-reduced-motion:reduce){.lustre{display:none}}

/* ---------------- cabecera ---------------- */
.cab{padding:calc(env(safe-area-inset-top) + 18px) 0 20px; border-radius:0 0 var(--r) var(--r)}
.marca{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;color:rgba(251,247,244,.55)}
.pin{width:24px;height:24px;border-radius:7px;background:var(--rojo);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:0}
.cab h1{font-size:21px;margin-top:12px;color:var(--blanco-laca)}
.chip-nivel{display:inline-block;margin-top:9px;padding:4px 12px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--oro-laca);border:1px solid rgba(233,190,104,.45)}

/* ---------------- tarjetas ---------------- */
.card{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:20px;margin-top:12px}
.card.laca{border:0}
.etq{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--gris)}
.laca .etq{color:rgba(233,190,104,.85)}
.cifra{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.cifra.sm{font-size:24px;font-weight:700}
h3.tit{font-size:18px}
.sub{font-size:14px;color:var(--gris);margin:6px 0 0}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .k{color:var(--gris);font-size:14px}
.fila .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--linea);margin:16px 0}
.laca .sep{background:rgba(255,255,255,.12)}

/* ---------------- barra ---------------- */
.barra{height:6px;border-radius:99px;background:var(--linea);overflow:hidden;margin-top:14px}
.laca .barra{background:rgba(255,255,255,.16)}
.barra i{display:block;height:100%;border-radius:99px;background:var(--oro);
  transition:width .7s cubic-bezier(.2,.8,.2,1)}
.laca .barra i{background:var(--oro-laca)}

/* ---------------- botones y campos ---------------- */
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;
  font-weight:600;font-family:inherit;cursor:pointer;background:var(--rojo);color:#fff;
  text-align:center;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--linea)}
.laca .btn.sec{color:var(--blanco-laca);border-color:rgba(255,255,255,.25)}
.btn.sm{padding:11px;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=number],input[type=email],select,textarea{
  width:100%;padding:14px;border:1px solid var(--linea);border-radius:14px;font-size:16px;
  font-family:inherit;background:var(--papel);color:var(--tinta)}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--rojo);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--rojo);height:30px;padding:0;border:0;background:none}

/* ---------------- avisos: neutro y ámbar, nada más ---------------- */
.aviso{border-radius:14px;padding:14px;font-size:14px;margin-top:14px;line-height:1.5;
  border:1px solid var(--linea)}
.aviso.ambar{border-color:color-mix(in srgb, var(--ambar) 35%, transparent);
  background:color-mix(in srgb, var(--ambar) 10%, var(--papel)); color:var(--ambar)}
.aviso.ambar b{color:var(--ambar)}
.laca .aviso{border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--blanco-laca)}
.cinta{font-size:12px;color:var(--gris);text-align:center;padding:8px 16px 0}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--linea);color:var(--gris)}
.pill.ambar{border-color:color-mix(in srgb, var(--ambar) 40%, transparent);color:var(--ambar)}

/* ---------------- calculadora ---------------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--linea);background:transparent;
  color:var(--tinta);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;
  font-variant-numeric:tabular-nums}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
details{margin-top:12px;border-top:1px solid var(--linea);padding-top:12px}
summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--gris);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:' ↓';color:var(--gris)}
details[open] summary::after{content:' ↑'}

/* ---------------- escalera ---------------- */
.crece{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:20px}
.crece div{flex:1;background:var(--tinta);border-radius:4px 4px 2px 2px;min-height:4px;position:relative;
  transition:height .6s cubic-bezier(.2,.8,.2,1)}
.crece div:last-child{background:var(--rojo)}
.crece div span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9.5px;
  color:var(--gris);font-weight:600;font-variant-numeric:tabular-nums}
.crece-pie{display:flex;gap:6px;margin-top:6px}
.crece-pie span{flex:1;text-align:center;font-size:10px;color:var(--gris)}

/* ---------------- niveles y datos ---------------- */
.nivel,.dato{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.nivel:last-child,.dato:last-child{border-bottom:0}
.nivel .txt,.dato .txt{flex:1;min-width:0}
.nivel .nm{font-weight:600;font-size:14px}
.nivel .rq,.dato .ay{font-size:12px;color:var(--gris)}
.nivel .cp,.dato .vl{font-weight:600;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nivel.aqui{border-left:2px solid var(--oro);padding-left:12px;margin-left:-14px}
.dato .tick{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;border:1px solid var(--linea);color:var(--gris)}
.dato.ok .tick{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.dato.ok .vl{color:var(--gris)}

/* ---------------- historial ---------------- */
.credito{border:1px solid var(--linea);border-radius:14px;padding:14px;margin-top:10px}
.credito .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.credito .cod{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--gris)}
.credito .gan{margin-top:10px;padding-top:10px;border-top:1px solid var(--linea);font-size:13px;
  display:flex;justify-content:space-between}
.insignias{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ins{display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--linea);
  border-radius:999px;font-size:12.5px;font-weight:600}
.ins em{font-style:normal;font-size:15px}
.ins.proxima{border-style:dashed;color:var(--gris);font-weight:400}

/* ---------------- nav ---------------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--papel);border-top:1px solid var(--linea);
  padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:transparent;font-family:inherit;cursor:pointer;
  padding:14px 2px;color:var(--gris);font-size:12px;font-weight:600;position:relative}
.nav button.on{color:var(--tinta)}
.nav button.on::after{content:'';position:absolute;left:50%;transform:translateX(-50%);
  bottom:8px;width:18px;height:2px;border-radius:2px;background:var(--rojo)}

.panel{animation:sube .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sube{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.pie{text-align:center;font-size:12px;color:var(--gris);margin:22px 0 8px;line-height:1.6}
.cargando{text-align:center;padding:70px 0;color:var(--gris)}
</style>
</head>
<body>

    <div class="marca"><span class="pin">J</span> Joan te presta</div>

<script>
'use strict';

var CFG_POR_DEFECTO = { url: '', anon: '' };
var CFG = (function () {
  try { var g = JSON.parse(localStorage.getItem('socio_cfg') || 'null');
        if (g && g.url && g.anon) return g; } catch (e) {}
  return CFG_POR_DEFECTO;
})();

var M = window.MotorReglas;
var $ = function (id) { return document.getElementById(id); };
var COP = function (n) { return '$' + Math.round(n || 0).toLocaleString('es-CO'); };
var COPc = function (n) {
  n = Math.round(n || 0);
  if (n >= 1000000) return '$' + (n / 1000000).toFixed(n % 1000000 ? 1 : 0) + 'M';
  if (n >= 1000) return '$' + Math.round(n / 1000) + 'k';
  return '$' + n;
};
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });
};
var pct = function (t) { return Math.round(t * 100) + '%'; };

function hoyISO() { return fechaRel(0); }
function fechaRel(dias) {
  var x = new Date(); x.setDate(x.getDate() + dias);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function fmtFecha(iso) {
  if (!iso) return '—';
  var p = String(iso).slice(0, 10).split('-');
  var mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return Number(p[2]) + ' ' + mes[Number(p[1]) - 1] + ' ' + p[0];
}
function fila(k, v) { return '<div class="fila"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>'; }

function porWhatsApp(texto) {
  var n = ((S && S.negocio && S.negocio.whatsapp) || '').replace(/\D/g, '');
  var destino = n ? (n.length <= 10 ? '57' + n : n) : '';
  window.open('https://wa.me/' + destino + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');
}
function nombreJoan() { return (S && S.negocio && S.negocio.nombre) || 'Joan'; }

function buscarDemo(cedula, tel4) {

      return { nombre: DEMOS[i].nombre, datos: DEMOS[i].datos, actualizado_en: null };

  }

}

/* ============ HISTORIAL QUE VIENE DENTRO DEL ENLACE ============ */
function desdeEnlace() {
  var m = /[#&]d=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
  if (!m) return null;
  try {
    var s = m[1].replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(s), by = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i);
    var paq = JSON.parse(new TextDecoder().decode(by));
    if (!paq || !paq.d) return null;
    return { nombre: paq.n, datos: paq.d, actualizado_en: paq.f || null, deEnlace: true };
  } catch (e) { return null; }
}

/* ============================ ESTADO ============================ */
var S = null, TAB = 'inicio', MONTO = 300000, NUEVOS = {};

function mostrar(cual) {
  ['pEntrar', 'pCargando', 'pCuenta'].forEach(function (p) { $(p).classList.toggle('oculto', p !== cual); });
  window.scrollTo(0, 0);
}

/* ============================ ENTRAR ============================ */
function entrar() {
  var ced = ($('inCedula').value || '').replace(/\D/g, '');
  var tel = ($('inTel').value || '').replace(/\D/g, '').slice(-4);
  $('errEntrar').classList.add('oculto');
  if (ced.length < 5) return fallo('Escribí tu número de cédula completo.');
  if (tel.length < 4) return fallo('Necesito los últimos 4 números de tu celular.');
  mostrar('pCargando');

  if (!CFG.url || !CFG.anon) {
    return setTimeout(function () {
      var d = buscarDemo(ced, tel);
      if (d) { d.cedula = ced; d.tel4 = tel; return abrir(d, true); }
      fallo('En el modo de prueba solo hay dos socios de ejemplo. Probá con la cédula 52111222 y el celular 2233 (Ana Ruiz), o 79333444 y 5566 (Luis Gómez).');
    }, 400);
  }
  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/historial_socio', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_cedula: ced, p_tel4: tel })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) {
      if (!j) return fallo('No encontré esa cédula con ese celular. Revisá los números, y si siguen sin salir escribile a Joan.');
      j.cedula = ced; j.tel4 = tel;
      abrir(j, false);
    }).catch(function () { fallo('No pude conectarme. Revisá que tengas internet y volvé a intentar.'); });

  function fallo(msg) { $('errEntrar').textContent = msg; $('errEntrar').classList.remove('oculto'); mostrar('pEntrar'); }
}

/* ==================== PREPARAR AL SOCIO ==================== */
function abrir(resp, esDemo) {
  var d = resp.datos || {};
  var g = d.garantia || {};
  var creditos = (d.creditos || []).slice();

  var nivel = M.evaluarNivel(Number(g.pagados_a_tiempo || 0), Number(g.racha || 0),
                             Number(g.meses_sin_mora || 0), g.nivel || 'bronce');
  S = {
    nombre: resp.nombre || 'Socio',
    codigo: (d.socio && d.socio.codigo) || '',
    cedula: resp.cedula || '', tel4: resp.tel4 || '',
    esDemo: !!esDemo, deEnlace: !!resp.deEnlace, actualizado: resp.actualizado_en,
    g: g,
    garantia: Number(g.total || 0),
    nivel: nivel,
    cupo: M.calcularCupo(Number(g.total || 0), nivel),
    creditos: creditos,
    activo: creditos.filter(function (c) { return !c.pagado; })[0] || null,
    pagados: creditos.filter(function (c) { return c.pagado; }),
    perfil: (d.perfil && d.perfil.datos) || {},
    referidos: d.referidos || { total: 0, pagaron: 0, lista: [] },
    resumen: d.resumen || {},
    negocio: d.negocio || { nombre: 'Joan', whatsapp: '' },
    comunidad: d.comunidad || null
  };
  NUEVOS = {};
  MONTO = Math.max(100000, Math.min(S.cupo || 300000, 500000));

  $('uNombre').textContent = S.nombre.split(' ').slice(0, 2).join(' ');
  $('uNivel').textContent = 'Socio ' + nivel + ' · ' + COP(S.garantia);
  irA('inicio');
  mostrar('pCuenta');
}

function irA(tab) {
  TAB = tab;
  var b = $('nav').querySelectorAll('button');
  for (var i = 0; i < b.length; i++) b[i].classList.toggle('on', b[i].dataset.t === tab);
  $('cuerpo').innerHTML = '<div class="panel">' +
    (tab === 'inicio' ? vistaInicio() :
     tab === 'calc' ? vistaCalculadora() :
     tab === 'garantia' ? vistaGarantia() : vistaHistorial()) + '</div>';
  if (tab === 'calc') sincronizarCalc();
  window.scrollTo(0, 0);
}

/* Cuánto le falta para el siguiente nivel, en porcentaje y en palabras. */
function siguienteNivel() {
  var orden = M.NIVELES, i = orden.indexOf(S.nivel);
  if (i < 0 || i >= orden.length - 1) return null;
  var sig = orden[i + 1], r = M.REQUISITOS_NIVEL[sig];
  var faltanPagos = Math.max(0, r.pagos_a_tiempo - Number(S.g.pagados_a_tiempo || 0));
  var faltanRacha = Math.max(0, r.racha - Number(S.g.racha || 0));
  return { nivel: sig, pagos: faltanPagos, racha: faltanRacha,
           meses: Math.max(0, r.meses_sin_mora - Number(S.g.meses_sin_mora || 0)) };
}
function progresoNivel() {
  var s = siguienteNivel();
  if (!s) return 100;
  var r = M.REQUISITOS_NIVEL[s.nivel];
  var meta = Math.max(1, r.pagos_a_tiempo);
  return Math.max(6, Math.min(100, Number(S.g.pagados_a_tiempo || 0) / meta * 100));
}
function textoProximoNivel() {
  var s = siguienteNivel();
  if (!s) return 'Estás en el nivel más alto. Tu cupo es ' + COP(M.FACTOR_CUPO[S.nivel]) + ' veces tu garantía.';
  var partes = [];
  if (s.pagos) partes.push(s.pagos + ' pago' + (s.pagos !== 1 ? 's' : '') + ' más');
  if (s.racha) partes.push('racha de ' + M.REQUISITOS_NIVEL[s.nivel].racha);
  if (s.meses) partes.push(s.meses + ' mes' + (s.meses !== 1 ? 'es' : '') + ' sin atrasarte');
  if (!partes.length) partes.push('ya casi');
  return 'Con ' + partes.join(' y ') + ' pasás a <b>' + s.nivel + '</b>, y tu cupo sube a ' +
         COP(M.calcularCupo(S.garantia, s.nivel)) + '.';
}

function tarjetaActivo(c) {

  var total = Number(c.capital || 0) + Number(c.costo || 0);

    (enMora ? dias + ' día' + (dias !== 1 ? 's' : '') + ' de atraso' :
     (dias === 0 ? 'Vence hoy' : 'Faltan ' + Math.abs(dias) + ' días')) + '</span></div>';

  if (enMora) {
    var r = M.recargoPorMora(c.capital, dias);
    h += '<div class="cifra sm">' + COP(total + r) + '</div>' +
      '<div class="muted" style="font-size:13px">Total para saldar hoy</div>' +
      fila('Capital', COP(c.capital)) + fila('Costo (' + pct(M.TASA_CREDITO) + ')', COP(c.costo)) +
      fila('Recargo por los ' + dias + ' días', COP(r)) +
      '<div class="aviso ambar"><b>Aunque te atrases, seguís siendo socio.</b><br>' +
      'No bajás de nivel, no perdés garantía y podés volver a pedir. Pagá lo que puedas ' +
      'cuando puedas: todo lo que pagues sigue sumando a tu cupo.</div>';
  } else {
    h += '<div class="cifra sm">' + COP(total) + '</div>' +
      '<div class="muted" style="font-size:13px">Total para saldar</div>' +
      fila('Capital', COP(c.capital)) + fila('Costo (' + pct(M.TASA_CREDITO) + ')', COP(c.costo)) +
      fila('Fecha de pago', fmtFecha(c.corte)) +
      '<div class="aviso"><b>Si pagás en fecha, sumás el doble.</b><br>' +
      'Pagando el ' + fmtFecha(c.corte) + ' o antes, tu cupo sube ' + COP(M.acumularGarantia(c.costo, true)) +
      '. Si te atrasás igual suma, pero la mitad.</div>';
  }
  if (c.prorrogas) h += fila('Prórrogas usadas', String(c.prorrogas));
  h += '<button class="btn sec sm" style="margin-top:14px" onclick="recordarme()">Que mi celular me lo recuerde</button>' +
       '<div class="muted" id="recordarPie" style="font-size:12px;margin-top:8px;text-align:center">' +
       'Te avisa dos días antes y el mismo día, aunque no tengas la app abierta.</div>';

/* ========================= CALCULADORA ========================= */
function vistaCalculadora() {
  var tope = Math.max(S.cupo, 500000);
  var chips = [100000, 300000, 500000, 1000000].filter(function (v, i) { return i < 3 || v <= tope * 2; });
  return '<div class="card">' +
    '<h3 class="tit">¿Cuánto necesitás?</h3>' +
    '<p class="sub">El costo es siempre el ' + pct(M.TASA_CREDITO) + '. Lo que cambia con tu garantía es cuánto podés pedir.</p>' +
    '<div class="cifra" id="calcMonto">' + COP(MONTO) + '</div>' +
    '<div class="muted" id="calcAviso" style="font-size:13px;min-height:19px"></div>' +
    '<input type="range" id="calcRange" min="100000" max="' + tope + '" step="50000" value="' + MONTO + '" ' +
      'oninput="setMonto(this.value)" style="margin-top:8px">' +
    '<div class="chips">' + chips.map(function (v) {
      return '<button class="chip" onclick="setMonto(' + v + ',true)">' + COPc(v) + '</button>';
    }).join('') + '</div></div>' +
    '<div id="calcSalida"></div>';
}

function setMonto(v, saltar) {
  MONTO = Math.max(100000, Math.min(Number(v) || 0, M.CUPO_MAXIMO));
  var r = $('calcRange');
  if (r) {
    if (saltar && MONTO > Number(r.max)) r.max = MONTO;
    r.value = Math.min(MONTO, Number(r.max));
  }
  sincronizarCalc();
}

function sincronizarCalc() {
  var s = M.simularCredito(MONTO, S.garantia, { nivelSocio: S.nivel, fechaDesembolso: hoyISO() });
  $('calcMonto').textContent = COP(MONTO);
  $('calcAviso').innerHTML = s.dentro_del_cupo
    ? 'Dentro de tu cupo de ' + COP(s.cupo) + '.'
    : 'Es más que tu cupo de ' + COP(s.cupo) + '.';
  $('calcSalida').innerHTML = salidaCalc(s);
}

function salidaCalc(s) {
  /* 1 · Lo que pagarías */
  var h = '<div class="card">' +
    '<div class="etq">Lo que pagarías</div>' +
    '<div class="cifra sm">' + COP(s.total_a_pagar) + '</div>' +
    '<div class="muted" style="font-size:13px">el ' + fmtFecha(s.fecha_corte) + '</div>' +
    fila('Te llevás', COP(s.capital)) +
    fila('Costo (' + pct(s.tasa) + ')', COP(s.costo)) +
    fila('Total a devolver', COP(s.total_a_pagar)) + '</div>';

  /* 2 · Lo que te deja — el premio, ahora es cupo y no descuento */
  h += '<div class="card laca">' +
    '<div class="etq">Y al pagarlo, tu cupo sube</div>' +
    '<div class="cifra">' + COP(s.cupo_despues) + '</div>' +
    '<div class="muted" style="font-size:13.5px;margin-top:6px">' +
      'desde ' + COP(s.cupo) + ', porque los ' + COP(s.costo) + ' de costo se te vuelven garantía.</div>' +
    fila('Tu garantía hoy', COP(s.garantia_disponible)) +
    fila('Suma este crédito', '+' + COP(s.garantia_que_deja)) +
    fila('Quedarías con', COP(s.garantia_despues)) +
    '</div>';

  /* 3 · Si no le alcanza, cuánto le falta */
  if (!s.dentro_del_cupo) {
    h += '<div class="aviso ambar"><b>Te falta ' + COP(s.falta_garantia) + ' de garantía para pedir ' +
      COP(s.capital) + '.</b><br>Podés pedírselo igual a ' + esc(nombreJoan()) +
      ' y él decide, o pedir hasta ' + COP(s.cupo) + ' que ya tenés disponible.</div>';
  }

  /* 4 · Pedirlo */
  var puede = M.puedeSolicitar({ nivel_kyc: 1, estado: 'activo', garantia_total: S.garantia, nivel_socio: S.nivel });
  h += '<div class="card"><h3 class="tit">¿Te sirve así?</h3>' +
    '<p class="sub">Le llega a ' + esc(nombreJoan()) + ' por WhatsApp con estos mismos números. ' +
    'No es un compromiso: él te responde y ahí deciden.</p>' +
    (puede.ok
      ? '<button class="btn" style="margin-top:14px" onclick="pedirCredito()">Pedir ' + COP(s.capital) + '</button>'
      : '<div class="aviso ambar">Para pedir necesitás completar tus datos primero.</div>') +
    '</div>';

  /* 5 · La escalera, plegada: es pedagogía, no decisión */
  var pasos = M.proyectarCrecimiento(S.garantia, MONTO, 6, S.nivel, { pideElCupo: true });
  var minG = S.garantia, maxG = pasos[pasos.length - 1].garantia;
  var rango = Math.max(1, maxG - minG);
  h += '<div class="card"><details><summary>Ver cómo crece si lo repetís</summary>' +
    '<p class="sub">Pidiendo cada vez todo tu cupo y pagando en fecha.</p>' +
    '<div class="crece">' + pasos.map(function (p) {
      return '<div style="height:' + (18 + (p.garantia - minG) / rango * 82).toFixed(0) + '%">' +
             '<span>' + COPc(p.cupo) + '</span></div>';
    }).join('') + '</div>' +
    '<div class="crece-pie">' + pasos.map(function (p) { return '<span>' + p.credito + '°</span>'; }).join('') + '</div>' +
    '<div class="muted" style="font-size:13px;margin-top:14px">Al sexto crédito podrías pedir hasta <b>' +
      COP(pasos[pasos.length - 1].cupo) + '</b>.</div>' +
    '</details></div>';

  return h + pie();
}

/* ================= RECORDATORIO EN SU PROPIO CELULAR ================= */
function textoICS(s) { return String(s).replace(/[\\;,]/g, '\\$&').replace(/\n/g, '\\n'); }
function plegarICS(lineas) {
  var out = [];
  lineas.forEach(function (l) {
    while (l.length > 70) { out.push(l.slice(0, 70)); l = ' ' + l.slice(70); }
    out.push(l);
  });
  return out.join('\r\n');
}
function armarICS(c) {
  var total = Number(c.capital || 0) + Number(c.costo || 0);
  var f = String(c.corte).slice(0, 10).replace(/-/g, '');
  var sello = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  var quien = nombreJoan();
  var desc = 'Total a pagar: ' + COP(total) + ' (capital ' + COP(c.capital) + ' + costo ' + COP(c.costo) + '). ' +
    'Pagando en fecha tu cupo sube ' + COP(M.acumularGarantia(c.costo, true)) + '. ' +
    'Si ese día no podés pagar todo, se puede dejar una prórroga o un plan de pagos, ' +
    'y aunque te atrases seguís siendo socio.';
  return plegarICS([
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Joan te presta//Socios//ES',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    'UID:' + (c.codigo || 'credito') + '-' + f + '@joantepresta',

function codigoSolicitud(s, monto) {
  var paq = { n: S.nombre, c: S.codigo || '', d: S.cedula || '',
    k: s.capital, t: s.tasa, o: s.costo, p: s.total_a_pagar,
    f: s.fecha_corte, g: S.garantia, u: S.cupo, x: monto > S.cupo ? 1 : 0 };
  var bytes = new TextEncoder().encode(JSON.stringify(paq));
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function requisitoTexto(n) {
  if (n.nivel === 'bronce') return 'Desde que entrás · tu cupo es ' + n.factor + '× tu garantía';

  if (r.meses_sin_mora) p.push(r.meses_sin_mora + ' meses sin atrasarte');
  return p.join(' · ') + ' · ' + n.factor + '× tu garantía';
}

function insignias() {
  var puntuales = S.pagados.filter(function (c) { return c.fecha_pagado && c.corte && c.fecha_pagado <= c.corte; });
  var orden = M.NIVELES;
  var lista = [
    { em: '🌱', t: 'Primer crédito', ok: S.creditos.length >= 1 },
    { em: '✅', t: 'Primer pago en fecha', ok: puntuales.length >= 1 },
    { em: '🔥', t: 'Racha de 3', ok: Number(S.g.racha || 0) >= 3 },
    { em: '⚡', t: 'Racha de 10', ok: Number(S.g.racha || 0) >= 10 },
    { em: '🥇', t: 'Llegaste a Oro', ok: orden.indexOf(S.nivel) >= 2 },
    { em: '🤝', t: 'Trajiste a alguien', ok: (S.referidos.pagaron || 0) >= 1 },
    { em: '📋', t: 'Perfil completo', ok: M.garantiaPorDatos(S.perfil).total >= M.CUPON_KYC_MAXIMO },
    { em: '💪', t: '5 créditos pagados', ok: S.pagados.length >= 5 }
  ];
  var ganadas = lista.filter(function (i) { return i.ok; });
  var proxima = lista.filter(function (i) { return !i.ok; })[0];
  if (!ganadas.length) return '<p class="muted" style="margin-top:10px">Todavía ninguna. La primera llega con tu primer crédito.</p>';
  return '<div class="insignias">' +
    ganadas.map(function (i) { return '<span class="ins"><em>' + i.em + '</em>' + esc(i.t) + '</span>'; }).join('') +
    (proxima ? '<span class="ins proxima"><em>' + proxima.em + '</em>Sigue: ' + esc(proxima.t) + '</span>' : '') +
    '</div>';
}

function tocarDato(el) {
  var id = el.dataset.kyc, v = (el.value || '').trim();
  if (v) NUEVOS[id] = v; else delete NUEVOS[id];
  var suma = 0;
  M.DATOS_KYC.forEach(function (d) { if (NUEVOS[d.id]) suma += d.valor; });
  $('perfilSuma').innerHTML = suma
    ? 'Con lo que llevás escrito, tu garantía sube <b>' + COP(suma) + '</b> en cuanto Joan lo cargue.'
    : 'Todavía no has escrito nada.';
}

function mandarPerfil() {
  var ids = Object.keys(NUEVOS);
  if (!ids.length) return alert('Escribí al menos un dato para poder mandárselo.');
  var etq = {};
  M.DATOS_KYC.forEach(function (d) { etq[d.id] = d.etiqueta; });
  var suma = ids.reduce(function (t, id) {
    var d = M.DATOS_KYC.filter(function (x) { return x.id === id; })[0];
    return t + (d ? d.valor : 0);
  }, 0);
  porWhatsApp('Hola ' + nombreJoan() + ', soy ' + S.nombre + '. Te mando mis datos para completar mi perfil:\n\n' +
    ids.map(function (id) { return '• ' + (etq[id] || id) + ': ' + NUEVOS[id]; }).join('\n') +
    '\n\nCon esto mi garantía sube ' + COP(suma) + '.');
}
