<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joan te presta · Mi cuenta de socio</title>
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi cuenta">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f3d2e'/%3E%3Ctext x='90' y='122' font-size='96' text-anchor='middle' fill='%23f2c14e' font-family='system-ui'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3d2e'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='%23f2c14e' font-family='system-ui'%3EJ%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --verde:#0f3d2e; --verde2:#17604a; --oro:#f2c14e; --tinta:#12211c; --gris:#6b7c76;
  --linea:#e3ebe7; --fondo:#f6f8f7; --tarjeta:#fff; --alerta:#b4441f; --ok:#1d7a4f;
  --bronce:#b06f3a; --plata:#7f8c9b; --nivel-oro:#c99700; --platino:#5f74d1;
}
@media (prefers-color-scheme:dark){
  :root{--tinta:#eaf2ee;--gris:#93a7a0;--linea:#243630;--fondo:#0c1512;--tarjeta:#131f1b}
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:var(--fondo); color:var(--tinta); line-height:1.45;
  padding:0 0 env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
.muted{color:var(--gris)}
.oculto{display:none!important}

/* ---- cabecera ---- */
header{background:var(--verde);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 16px 22px}
header .wrap{padding:0}
.marca{display:flex;align-items:center;gap:10px;font-size:14px;opacity:.85}
.marca .pin{width:26px;height:26px;border-radius:8px;background:var(--oro);color:var(--verde);
  display:grid;place-items:center;font-weight:800;font-size:15px}
.saludo{margin-top:14px;font-size:22px;font-weight:700}
.nivel-chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 12px;
  border-radius:999px;font-size:13px;font-weight:700;background:rgba(255,255,255,.14)}

/* ---- tarjetas ---- */
.card{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;
  padding:18px;margin-top:14px}
.card.destacada{border-color:transparent;background:linear-gradient(160deg,var(--verde2),var(--verde));color:#fff}
.card.destacada .muted{color:rgba(255,255,255,.72)}
.etq{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--gris)}
.card.destacada .etq{color:rgba(255,255,255,.72)}
.cifra{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.cifra.sm{font-size:24px}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .k{color:var(--gris);font-size:14px}
.fila .v{font-weight:700;text-align:right}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---- barra de progreso ---- */
.barra{height:9px;border-radius:99px;background:var(--linea);overflow:hidden;margin-top:12px}
.card.destacada .barra{background:rgba(255,255,255,.2)}
.barra i{display:block;height:100%;border-radius:99px;background:var(--oro);transition:width .6s}

/* ---- botones / formulario ---- */
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;
  font-weight:700;font-family:inherit;cursor:pointer;background:var(--verde);color:#fff}
.btn:active{transform:scale(.99)}
.btn.sec{background:transparent;color:var(--verde);border:1.5px solid var(--linea)}
@media (prefers-color-scheme:dark){.btn.sec{color:var(--oro)}}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:14px;border:1.5px solid var(--linea);border-radius:13px;font-size:17px;
  font-family:inherit;background:var(--tarjeta);color:var(--tinta)}
input:focus{outline:0;border-color:var(--verde2)}

/* ---- estados ---- */
.aviso{border-radius:14px;padding:14px;font-size:14px;margin-top:14px}
.aviso.calmo{background:#e8f4ee;color:#14513a}
.aviso.ojo{background:#fdf0e6;color:#8a3a15}
.aviso.demo{background:#eef0fb;color:#31408a}
@media (prefers-color-scheme:dark){
  .aviso.calmo{background:#12332a;color:#8fe3bd}
  .aviso.ojo{background:#3a2213;color:#f0b58c}
  .aviso.demo{background:#1a2040;color:#aab6f0}
}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.aldia{background:#e8f4ee;color:#14513a}
.pill.mora{background:#fdf0e6;color:#8a3a15}
.pill.pagado{background:var(--linea);color:var(--gris)}

/* ---- historial ---- */
.credito{border:1px solid var(--linea);border-radius:14px;padding:14px;margin-top:10px}
.credito .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.credito .cod{font-size:12px;font-family:ui-monospace,monospace;color:var(--gris)}

/* ---- insignias ---- */
.insignias{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:12px}
.ins{text-align:center;padding:12px 6px;border:1px solid var(--linea);border-radius:14px;font-size:11px;
  line-height:1.3;color:var(--gris)}
.ins .em{font-size:26px;display:block;filter:grayscale(1);opacity:.35}
.ins.gana{border-color:var(--oro);color:var(--tinta);font-weight:600}
.ins.gana .em{filter:none;opacity:1}

.pie{text-align:center;font-size:12px;color:var(--gris);margin-top:26px;line-height:1.6}
.cargando{text-align:center;padding:60px 0;color:var(--gris)}
</style>
</head>
<body>

<!-- ================= ENTRAR ================= -->
<div id="pantallaEntrar">
  <header>
    <div class="wrap">
      <div class="marca"><span class="pin">J</span> Joan te presta</div>
      <div class="saludo">Mi cuenta de socio</div>
    </div>
  </header>
  <div class="wrap">
    <div class="card">
      <div class="etq">Entrá con tus datos</div>
      <p class="muted" style="font-size:14px;margin:8px 0 0">
        Los mismos que le diste a Joan cuando abriste tu crédito.
      </p>
      <label for="inCedula">Tu cédula</label>
      <input id="inCedula" type="text" inputmode="numeric" autocomplete="off"
             placeholder="Ej: 52111222" enterkeyhint="next">
      <label for="inTel">Últimos 4 números de tu celular</label>
      <input id="inTel" type="text" inputmode="numeric" autocomplete="off"
             maxlength="4" placeholder="Ej: 2233" enterkeyhint="go">
      <button class="btn" style="margin-top:20px" id="btnEntrar">Ver mi cuenta</button>
      <div id="errorEntrar" class="aviso ojo oculto"></div>
      <div id="avisoDemo" class="aviso demo oculto"></div>
    </div>
    <div class="pie">
      ¿No te reconoce? Escribile a Joan y lo revisa.<br>
      Tus datos solo los ves vos con tu cédula y tu celular.
    </div>
  </div>
</div>

<!-- ================= CARGANDO ================= -->
<div id="pantallaCargando" class="oculto">
  <div class="cargando">Buscando tu historial…</div>
</div>

<!-- ================= CUENTA ================= -->
<div id="pantallaCuenta" class="oculto">
  <header>
    <div class="wrap">
      <div class="marca"><span class="pin">J</span> Joan te presta</div>
      <div class="saludo" id="uNombre">—</div>
      <div class="nivel-chip" id="uNivel">—</div>
    </div>
  </header>
  <div class="wrap" id="cuerpo"></div>
</div>

<script src="motor.js"></script>
<script>
'use strict';

/* =========================================================================
   Configuración de la nube. Se puede dejar vacía: la app arranca en modo
   demostración. Para conectarla de verdad, abrí esta página con ?cfg y pegá
   la URL y la llave anon del proyecto de Supabase (ver supabase.sql).
   ========================================================================= */
var CFG_POR_DEFECTO = { url: '', anon: '' };

var CFG = (function () {
  try {
    var g = JSON.parse(localStorage.getItem('socio_cfg') || 'null');
    if (g && g.url && g.anon) return g;
  } catch (e) {}
  return CFG_POR_DEFECTO;
})();

var M = window.MotorReglas;
var COP = function (n) { return '$' + Math.round(n || 0).toLocaleString('es-CO'); };
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
  });
};
var NIVEL_COLOR = { bronce: 'var(--bronce)', plata: 'var(--plata)', oro: 'var(--nivel-oro)', platino: 'var(--platino)' };
var NIVEL_EMOJI = { bronce: '🥉', plata: '🥈', oro: '🥇', platino: '💎' };

function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function fmtFecha(iso) {
  if (!iso) return '—';
  var p = String(iso).slice(0, 10).split('-');
  var mes = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  return Number(p[2]) + ' ' + mes[Number(p[1]) - 1] + ' ' + p[0];
}

/* ============================ DATOS DE EJEMPLO ============================ */
var DEMO = {
  nombre: 'Ana Ruiz',
  datos: {
    socio: { codigo: 'CL-0007', nivel_kyc: 2 },
    garantia: { total: 340000, acumulada: 140000, cupon: 200000, nivel: 'plata',
                pagados_a_tiempo: 4, racha: 2, creditos_total: 4, meses_sin_mora: 3 },
    creditos: [
      { codigo: 'CR-0021', capital: 300000, costo: 36000, desembolso: '2026-07-02',
        corte: '2026-07-15', pagado: false, abonado: 0, prorrogas: 0 },
      { codigo: 'CR-0018', capital: 250000, costo: 50000, desembolso: '2026-06-05',
        corte: '2026-06-15', pagado: true, fecha_pagado: '2026-06-19', abonado: 300000, prorrogas: 1 },
      { codigo: 'CR-0014', capital: 200000, costo: 40000, desembolso: '2026-05-04',
        corte: '2026-05-15', pagado: true, fecha_pagado: '2026-05-15', abonado: 240000, prorrogas: 0 },
      { codigo: 'CR-0009', capital: 150000, costo: 30000, desembolso: '2026-04-03',
        corte: '2026-04-15', pagado: true, fecha_pagado: '2026-04-14', abonado: 180000, prorrogas: 0 }
    ],
    resumen: { total_prestado: 900000, primer_credito: '2026-04-03' }
  },
  actualizado_en: null
};

/* ============================== ENTRAR =================================== */
function mostrar(cual) {
  ['pantallaEntrar', 'pantallaCargando', 'pantallaCuenta'].forEach(function (p) {
    $(p).classList.toggle('oculto', p !== cual);
  });
  window.scrollTo(0, 0);
}

function entrar() {
  var ced = ($('inCedula').value || '').replace(/\D/g, '');
  var tel = ($('inTel').value || '').replace(/\D/g, '').slice(-4);
  var err = $('errorEntrar');
  err.classList.add('oculto');

  if (ced.length < 5) { return fallo('Escribí tu número de cédula completo.'); }
  if (tel.length < 4) { return fallo('Necesito los últimos 4 números de tu celular.'); }

  mostrar('pantallaCargando');

  if (!CFG.url || !CFG.anon) {           // modo demostración
    return setTimeout(function () { pintar(DEMO, true); }, 450);
  }

  fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/historial_socio', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_cedula: ced, p_tel4: tel })
  })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) {
      if (!j) { mostrar('pantallaEntrar'); return fallo('No encontré esa cédula con ese celular. Revisá los números, y si siguen sin salir escribile a Joan.'); }
      pintar(j, false);
    })
    .catch(function () {
      mostrar('pantallaEntrar');
      fallo('No pude conectarme. Revisá que tengas internet y volvé a intentar.');
    });

  function fallo(msg) { err.textContent = msg; err.classList.remove('oculto'); mostrar('pantallaEntrar'); }
}

/* ======================== ARMAR LA VISTA DEL SOCIO ======================= */
function pintar(resp, esDemo) {
  var d = resp.datos || {};
  var g = d.garantia || {};
  var creditos = (d.creditos || []).slice();

  var garantiaTotal = Number(g.total || 0);
  var nivel = M.evaluarNivel(
    Number(g.pagados_a_tiempo || 0), Number(g.racha || 0), Number(g.meses_sin_mora || 0),
    g.nivel || 'bronce'                       // el nivel ya alcanzado hace de piso
  );
  var cupo = M.calcularCupo(garantiaTotal, nivel);
  var activo = creditos.filter(function (c) { return !c.pagado; })[0] || null;

  $('uNombre').textContent = (resp.nombre || 'Socio').split(' ').slice(0, 2).join(' ');
  var chip = $('uNivel');
  chip.innerHTML = NIVEL_EMOJI[nivel] + ' Socio ' + nivel.charAt(0).toUpperCase() + nivel.slice(1);
  chip.style.background = NIVEL_COLOR[nivel];

  var h = '';

  if (esDemo) {
    h += '<div class="aviso demo"><b>Estás viendo un ejemplo.</b> Todavía no conecté la base de datos, ' +
         'así que estos números son inventados para mostrar cómo se va a ver.</div>';
  }

  /* ---- cupo disponible ---- */
  var tasaSiPide = garantiaTotal > 0 ? M.calcularTasa(garantiaTotal, Math.max(cupo, 1)) : 0.20;
  h += '<div class="card destacada">' +
       '<div class="etq">Podés pedir hasta</div>' +
       '<div class="cifra">' + COP(cupo) + '</div>' +
       '<div class="muted" style="font-size:14px;margin-top:6px">' +
         'Con una tasa del ' + Math.round(tasaSiPide * 100) + '% por quincena' +
       '</div>' + progresoTasa(garantiaTotal, cupo) + '</div>';

  /* ---- crédito activo ---- */
  if (activo) h += tarjetaCreditoActivo(activo);
  else h += '<div class="card"><div class="etq">Tu crédito</div>' +
            '<p style="margin:8px 0 0">No tenés ningún crédito abierto ahora mismo.</p>' +
            '<p class="muted" style="font-size:14px;margin:6px 0 0">Cuando quieras otro, escribile a Joan.</p></div>';

  /* ---- garantía ---- */
  h += '<div class="card">' +
       '<div class="etq">Tu garantía acumulada</div>' +
       '<div class="cifra sm">' + COP(garantiaTotal) + '</div>' +
       '<p class="muted" style="font-size:13px;margin:8px 0 14px">' +
         'Es lo que has construido pagando. No es plata que se retire: es tu historial, y es lo que ' +
         'te baja la tasa y te sube el cupo.</p>' +
       fila('Ganada con tus pagos', COP(g.acumulada || 0)) +
       fila('Que te puso Joan de arranque', COP(g.cupon || 0)) +
       fila('Créditos que has tomado', String(g.creditos_total || creditos.length)) +
       fila('Pagos puntuales seguidos', String(g.racha || 0)) +
       (d.resumen && d.resumen.primer_credito ? fila('Sos socio desde', fmtFecha(d.resumen.primer_credito)) : '') +
       '</div>';

  /* ---- el mensaje que importa ---- */
  h += '<div class="aviso calmo">' +
       '<b>Aunque te atrases, seguís siendo socio.</b><br>' +
       'Entrar en mora no te baja de nivel, no te borra la garantía y no te cierra la puerta. ' +
       'Lo que pagues, aunque sea tarde, sigue sumando. Joan te sigue prestando.' +
       '</div>';

  /* ---- insignias ---- */
  h += '<div class="card"><div class="etq">Lo que has logrado</div>' + insignias(g, creditos, nivel) + '</div>';

  /* ---- historial ---- */
  var pagados = creditos.filter(function (c) { return c.pagado; });
  h += '<div class="card"><div class="etq">Tu historial</div>';
  if (!pagados.length) h += '<p class="muted" style="margin:10px 0 0">Todavía no cerrás ningún crédito. El primero es el que arranca todo.</p>';
  else pagados.forEach(function (c) { h += lineaHistorial(c); });
  h += '</div>';

  if (resp.actualizado_en) {
    h += '<div class="pie">Datos al ' + fmtFecha(resp.actualizado_en) + '.<br>Si ves algo raro, escribile a Joan.</div>';
  } else {
    h += '<div class="pie">Si ves algo raro en tus números, escribile a Joan.</div>';
  }
  h += '<button class="btn sec" style="margin-top:18px" onclick="salir()">Salir</button>';

  $('cuerpo').innerHTML = h;
  mostrar('pantallaCuenta');
}

function fila(k, v) {
  return '<div class="fila"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + '</span></div>';
}

/* Barra "te faltan $X para bajar de tasa" (pantalla 2 del documento). */
function progresoTasa(garantia, cupo) {
  var base = Math.max(cupo, 1);
  var cobertura = garantia / base;
  var metas = [
    { cob: 0.5, tasa: 12 }, { cob: 1, tasa: 5 }, { cob: 2, tasa: 3 }
  ];
  var meta = null;
  for (var i = 0; i < metas.length; i++) if (cobertura < metas[i].cob) { meta = metas[i]; break; }
  if (!meta) {
    return '<div class="barra"><i style="width:100%"></i></div>' +
           '<div class="muted" style="font-size:13px;margin-top:8px">Estás en la mejor tasa que hay. 💎</div>';
  }
  var falta = Math.max(0, Math.ceil(meta.cob * base - garantia));
  var desde = meta.cob === 0.5 ? 0 : (meta.cob === 1 ? 0.5 : 1);
  var pct = Math.max(4, Math.min(100, ((cobertura - desde) / (meta.cob - desde)) * 100));
  return '<div class="barra"><i style="width:' + pct.toFixed(0) + '%"></i></div>' +
         '<div class="muted" style="font-size:13px;margin-top:8px">' +
         'Te faltan <b style="color:#fff">' + COP(falta) + '</b> de garantía para bajar al ' + meta.tasa + '%.</div>';
}

function tarjetaCreditoActivo(c) {
  var corte = c.corte;
  var dias = M.diasDeMora(corte, hoyISO());   // negativo = todavía falta
  var enMora = dias > 0;
  var total = Number(c.capital || 0) + Number(c.costo || 0);
  var h = '<div class="card"><div class="top" style="display:flex;justify-content:space-between;align-items:center">' +
          '<div class="etq">Tu crédito de ahora</div>' +
          '<span class="pill ' + (enMora ? 'mora' : 'aldia') + '">' +
          (enMora ? dias + ' día' + (dias !== 1 ? 's' : '') + ' de atraso' : (dias === 0 ? 'Vence hoy' : 'Al día')) +
          '</span></div>';

  if (enMora) {
    var recargo = M.recargoPorMora(c.capital, dias);
    h += '<div class="cifra sm" style="margin-top:10px">' + COP(total + recargo) + '</div>' +
         '<div class="muted" style="font-size:13px">Total para saldar hoy</div>' +
         fila('Capital', COP(c.capital)) +
         fila('Costo del crédito', COP(c.costo)) +
         fila('Recargo por los ' + dias + ' días', COP(recargo)) +
         '<div class="aviso calmo" style="font-size:13px">Este recargo también te suma garantía. ' +
         'Pagá lo que puedas cuando puedas: cada abono cuenta y no perdés tu nivel.</div>';
  } else {
    h += '<div class="cifra sm" style="margin-top:10px">' + COP(total) + '</div>' +
         '<div class="muted" style="font-size:13px">Total para saldar</div>' +
         fila('Capital', COP(c.capital)) +
         fila('Costo del crédito', COP(c.costo)) +
         fila('Fecha de pago', fmtFecha(corte)) +
         (dias < 0 ? fila('Te quedan', Math.abs(dias) + ' día' + (dias !== -1 ? 's' : '')) : '');
  }
  if (c.prorrogas) h += fila('Prórrogas usadas', String(c.prorrogas));
  return h + '</div>';
}

function lineaHistorial(c) {
  var puntual = c.fecha_pagado && c.corte && c.fecha_pagado <= c.corte;
  return '<div class="credito"><div class="top">' +
         '<div><b>' + COP(c.capital) + '</b><div class="cod">' + esc(c.codigo || '') + '</div></div>' +
         '<span class="pill pagado">' + (puntual ? 'Pagado a tiempo' : 'Pagado') + '</span></div>' +
         '<div class="muted" style="font-size:13px;margin-top:8px">' +
         fmtFecha(c.desembolso) + ' → ' + fmtFecha(c.fecha_pagado || c.corte) +
         (c.prorrogas ? ' · ' + c.prorrogas + ' prórroga' + (c.prorrogas !== 1 ? 's' : '') : '') +
         '</div></div>';
}

function insignias(g, creditos, nivel) {
  var pagados = creditos.filter(function (c) { return c.pagado; });
  var puntuales = pagados.filter(function (c) { return c.fecha_pagado && c.corte && c.fecha_pagado <= c.corte; });
  var orden = ['bronce', 'plata', 'oro', 'platino'];
  var lista = [
    { em: '🌱', t: 'Primer crédito', ok: creditos.length >= 1 },
    { em: '✅', t: 'Primer pago puntual', ok: puntuales.length >= 1 },
    { em: '🔥', t: 'Racha de 3', ok: Number(g.racha || 0) >= 3 },
    { em: '⚡', t: 'Racha de 10', ok: Number(g.racha || 0) >= 10 },
    { em: '🥇', t: 'Llegaste a Oro', ok: orden.indexOf(nivel) >= 2 },
    { em: '🤝', t: '5 créditos', ok: pagados.length >= 5 }
  ];
  return '<div class="insignias">' + lista.map(function (i) {
    return '<div class="ins ' + (i.ok ? 'gana' : '') + '"><span class="em">' + i.em + '</span>' + esc(i.t) + '</div>';
  }).join('') + '</div>';
}

function salir() {
  $('inCedula').value = ''; $('inTel').value = '';
  mostrar('pantallaEntrar');
}

/* ========================= CONFIGURACIÓN (?cfg) ========================== */
function pantallaConfig() {
  document.body.innerHTML =
    '<header><div class="wrap"><div class="marca"><span class="pin">J</span> Joan te presta</div>' +
    '<div class="saludo">Conectar la base</div></div></header>' +
    '<div class="wrap"><div class="card">' +
    '<p class="muted" style="font-size:14px;margin:0">Pegá los dos datos de Supabase ' +
    '(Settings → API). Quedan guardados solo en este teléfono.</p>' +
    '<label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co" value="' + esc(CFG.url) + '">' +
    '<label>Llave anon public</label><input id="cfgAnon" placeholder="eyJ..." value="' + esc(CFG.anon) + '">' +
    '<button class="btn" style="margin-top:20px" id="cfgGuardar">Guardar</button>' +
    '<button class="btn sec" style="margin-top:10px" id="cfgBorrar">Volver al modo ejemplo</button>' +
    '<div id="cfgMsg" class="aviso calmo oculto"></div>' +
    '</div></div>';
  $('cfgGuardar').onclick = function () {
    var u = $('cfgUrl').value.trim(), a = $('cfgAnon').value.trim();
    if (!u || !a) { return alert('Faltan datos.'); }
    localStorage.setItem('socio_cfg', JSON.stringify({ url: u, anon: a }));
    var m = $('cfgMsg'); m.textContent = 'Guardado. Abrí la página sin ?cfg para probarla.'; m.classList.remove('oculto');
  };
  $('cfgBorrar').onclick = function () {
    localStorage.removeItem('socio_cfg');
    var m = $('cfgMsg'); m.textContent = 'Listo, vuelve a mostrar el ejemplo.'; m.classList.remove('oculto');
  };
}

/* ================================ ARRANQUE ============================== */
(function () {
  if (location.search.indexOf('cfg') >= 0) { pantallaConfig(); return; }
  if (!M) {
    document.body.innerHTML = '<div class="wrap"><div class="aviso ojo" style="margin-top:40px">' +
      'No pude cargar el motor de reglas (motor.js). Tiene que estar en la misma carpeta que esta página.' +
      '</div></div>';
    return;
  }
  if (!CFG.url || !CFG.anon) {
    var a = $('avisoDemo');
    a.innerHTML = '<b>Modo ejemplo.</b> Todavía no está conectada la base de datos, ' +
                  'así que con cualquier cédula vas a ver un socio de muestra.';
    a.classList.remove('oculto');
  }
  $('btnEntrar').addEventListener('click', entrar);
  $('inTel').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
  $('inCedula').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('inTel').focus(); });
})();
</script>
