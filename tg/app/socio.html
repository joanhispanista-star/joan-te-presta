<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">

<meta name="theme-color" content="#0C0A0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="app.webmanifest">

<style>
/* ==========================================================================
 * LA LEY DE LA PALETA — 2 de agosto de 2026
 *
 * Dos materiales y tres colores. Los materiales no son color: son el soporte,
 * y son lo que le da a esta app el aire caro. Los colores se ganan el lugar
 * porque cada uno tiene UN solo trabajo.
 *
 * LOS MATERIALES
 *   --laca   la placa negra. Ahí vive lo que es DEL SOCIO: su garantía, su
 *            nivel, su cupo, lo que construyó.
 *   --papel  ahí vive todo lo demás.
 *   --fondo  hueso, el fondo de la página.
 *
 * AMARILLO — lo que el socio construyó
 *   Su garantía, su nivel, su cupo, lo que lleva ganado. Es el color del
 *   logro. --amarillo SOLO existe sobre la laca. Sobre papel solo puede
 *   pisar --amarillo-tinta, y solo como texto.
 *
 * AZUL — el préstamo con garantía, y lo que explica
 *   Lo calmado, lo largo, lo respaldado. El producto de 6 meses al 5% es azul
 *   de punta a punta: su botón, su tarjeta, sus cifras, su calendario. Y el
 *   azul es también el color de lo que informa y acompaña: avisos que no son
 *   alarma, explicaciones, ayudas.
 *
 * ROJO — la marca, el gesto de avanzar, y el crédito quincenal
 *   El rojo es SUSTANTIVO. Es la marca (el pin de la Q, la barrita de la
 *   pestaña activa) y es el botón que hace avanzar. Y ahora además es el
 *   color del crédito quincenal: lo rápido, lo de quince días, lo que cuesta
 *   20% y hace crecer. El rojo NUNCA es un estado y NUNCA es una cifra de
 *   plata.
 *
 * LOS ESTADOS SIGUEN EN ÁMBAR
 *   Mora, atraso, vencimiento, "no te alcanza": ámbar quemado, siempre. Lo
 *   que impide que el ámbar y el amarillo se confundan no es el tono, es el
 *   MATERIAL:
 *
 *       el amarillo SOLO existe sobre la laca negra;
 *       el ámbar SOLO existe sobre papel.
 *
 *   Nunca se ven en la misma superficie, así que nunca se confunden. Si
 *   alguna vez hace falta poner uno donde va el otro, está mal el layout, no
 *   el color.
 *
 * LOS DOS MODOS
 *   En oscuro cambia el PAPEL, nunca la marca. El rojo y el azul tienen dos
 *   trabajos y por eso dos variables:
 *
 *       --rojo / --azul        el RELLENO de marca: el botón, el sello, el
 *                              selector. Llevan letra blanca encima, así que
 *                              son el mismo hex en los dos modos.
 *       --rojo-texto / --azul-texto   el mismo color cuando es TEXTO o filete
 *                              sobre el papel. En claro es la marca; en oscuro
 *                              es la versión de laca, porque ahí el papel es
 *                              oscuro.
 *
 *   El ámbar no se aclara nunca: aclarado se vuelve el amarillo y pasa a pintar
 *   una deuda. Y como no se aclara, en oscuro no puede ser TEXTO: la cuenta no
 *   cierra. Un ámbar que conserve 3:1 contra el amarillo no pasa de L 0,166, y
 *   ese color, hasta sobre negro puro, llega a 4,32:1 — nunca a AA. Así que en
 *   oscuro el ámbar se corre al FILETE, que es donde 3:1 alcanza, y adentro
 *   escribe la tinta. Tres variables:
 *
 *       --ambar         el hex, intocable. Filete, regla, borde.
 *       --ambar-papel   la superficie del aviso. En claro es papel claro; en
 *                       oscuro se oscurece como --rojo-tinte y --azul-tinte,
 *                       porque un aviso no puede ser lo más brillante de una
 *                       pantalla negra: la mora acá no castiga, y el color
 *                       tiene que decir lo mismo que el texto.
 *       --ambar-tinta   lo que se escribe adentro. En claro, el ámbar; en
 *                       oscuro, la tinta común, que sí llega a AA.
 *
 * CÓMO SE USA
 *   Siempre por variable. Si aparece un hex suelto en el medio del archivo,
 *   está mal. El espaciado también sale de la escala (--e1 4 / --e2 8 /
 *   --e3 12 / --e4 20): no hay márgenes a ojo.
 *
 * ESTE COMENTARIO ES LA LEY. Si un día cambia el sistema, cambia acá primero.
 * ==========================================================================*/
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* materiales: no son color, son el soporte */
  --laca:#0C0A0B; --papel:#FFFFFF; --fondo:#F6F3F0; --tinta:#0C0A0B;
  --luz:#FFFFFF; --sombra:#000000;   /* para los brillos y las sombras de la laca */
  /* amarillo — lo que el socio construyó. SOLO sobre laca */
  --amarillo:#F5C542; --amarillo-tinta:#7A5A10;
  /* azul — el préstamo con garantía, y lo que explica */
  --azul:#1B4FD8; --azul-laca:#7FA8FF; --azul-tinte:#EDF2FE;
  --azul-texto:var(--azul);
  /* rojo — la marca, el gesto de avanzar, y el crédito quincenal */
  --rojo:#D81F26; --rojo-laca:#FF6B6F; --rojo-tinte:#FCF4F2;
  --rojo-texto:var(--rojo);
  /* estados: ámbar, y SOLO sobre papel — el suyo. En claro el papel es claro y
     el ámbar escribe encima; en oscuro el papel se oscurece y el ámbar se corre
     al filete (ver la ley de arriba). */
  --ambar:#9A5B12; --ambar-papel:color-mix(in srgb, var(--ambar) 10%, var(--luz));
  --ambar-filete:color-mix(in srgb, var(--ambar) 40%, transparent);
  --ambar-tinta:var(--ambar);
  --gris:#6E6460; --linea:#E9E3DD; --blanco-laca:#FBF7F4;
  --r:16px;
  /* espaciado por escala, nada a ojo */
  --e1:4px; --e2:8px; --e3:12px; --e4:20px;
  /* La placa, en una sola variable: la usan .laca y .card.laca. Antes vivía
     solo en .laca y el fondo de .card se la comía, así que las tarjetas del
     socio salían en papel blanco con las cifras en amarillo — ilegibles y
     contra la ley de arriba. */
  --placa:
    linear-gradient(103deg, transparent 32%, color-mix(in srgb, var(--luz) 5%, transparent) 45%, transparent 60%),
    radial-gradient(140% 110% at 16% -25%,
      color-mix(in srgb, var(--laca) 88%, var(--luz)) 0%,
      color-mix(in srgb, var(--laca) 97%, var(--luz)) 45%,
      var(--laca) 100%);
}
/* ---------------- el modo oscuro ----------------
   Lo que cambia en oscuro es el PAPEL, nunca la marca. El rojo del botón y del
   sello, y el azul de su botón, se quedan en el hex de la marca en los dos
   modos: encima llevan letra blanca, y aclararlos la dejaba en 2,8:1. Lo que sí
   necesita aclararse es el rojo y el azul cuando son TEXTO, porque en oscuro el
   papel es oscuro: para eso están --rojo-texto y --azul-texto, que en claro son
   la marca y en oscuro son la versión de laca. Y el ámbar tampoco se aclara: si
   se aclara choca con el amarillo (eran el mismo color, 1,10:1). Pero traerse su
   papel CLARO a la pantalla negra dejaba el aviso de mora como una plancha de
   286x135 sobre un fondo rgb(11,10,10): la única superficie clara de Inicio, un
   fogonazo de noche, y encima le daba al atraso un peso que el producto no le da
   —adentro dice "no bajas de nivel, no pierdes garantía"—. Así que el papel del
   ámbar se oscurece como --rojo-tinte y --azul-tinte, la tinta de adentro pasa a
   --tinta (14:1) y el ámbar se queda donde 3:1 le alcanza: el filete y la regla
   del borde. Sigue sin aclararse, sigue a 3,34:1 del amarillo. */
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --tinta:#EDE7E4; --papel:#151113; --fondo:#0B0A0A; --linea:#262021; --gris:#9C918B;
  --rojo-tinte:#241416; --rojo-texto:var(--rojo-laca);
  --azul-tinte:#101A2E; --azul-texto:var(--azul-laca);
  /* La tinta amarilla del modo oscuro es un aclarado de --amarillo (#F5C542),
     no el oro viejo: aquel #E9BE68 era del logo anterior y no pinta más acá. */
  --amarillo-tinta:#F8D471;
  --ambar-papel:color-mix(in srgb, var(--ambar) 10%, var(--papel));
  --ambar-filete:var(--ambar); --ambar-tinta:var(--tinta);
} }
:root[data-theme="dark"]{
  --tinta:#EDE7E4; --papel:#151113; --fondo:#0B0A0A; --linea:#262021; --gris:#9C918B;
  --rojo-tinte:#241416; --rojo-texto:var(--rojo-laca);
  --azul-tinte:#101A2E; --azul-texto:var(--azul-laca);
  --amarillo-tinta:#F8D471;
  --ambar-papel:color-mix(in srgb, var(--ambar) 10%, var(--papel));
  --ambar-filete:var(--ambar); --ambar-tinta:var(--tinta);
}
:root[data-theme="light"]{
  --laca:#0C0A0B; --papel:#FFFFFF; --fondo:#F6F3F0; --tinta:#0C0A0B;
  --luz:#FFFFFF; --sombra:#000000;
  --amarillo:#F5C542; --amarillo-tinta:#7A5A10;
  --azul:#1B4FD8; --azul-laca:#7FA8FF; --azul-tinte:#EDF2FE; --azul-texto:var(--azul);
  --rojo:#D81F26; --rojo-laca:#FF6B6F; --rojo-tinte:#FCF4F2; --rojo-texto:var(--rojo);
  --ambar:#9A5B12; --ambar-papel:color-mix(in srgb, var(--ambar) 10%, var(--luz));
  --ambar-filete:color-mix(in srgb, var(--ambar) 40%, transparent);
  --ambar-tinta:var(--ambar);
  --gris:#6E6460; --linea:#E9E3DD; --blanco-laca:#FBF7F4;
}

html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--fondo); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
h1,h2,h3{margin:0;font-family:ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
  font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.muted{color:var(--gris)}
.oculto{display:none!important}

/* ---------------- la laca ---------------- */
.laca{
  position:relative; isolation:isolate; border-radius:var(--r);
  color:var(--blanco-laca); -webkit-font-smoothing:antialiased;
  background:var(--placa);
  box-shadow:
    inset 0 1px 0 color-mix(in srgb, var(--luz) 13%, transparent),
    inset 0 -1px 0 color-mix(in srgb, var(--sombra) 55%, transparent),
    0 18px 38px -20px color-mix(in srgb, var(--laca) 45%, transparent);
}
.laca::after{                       /* el filete de amarillo que se apaga en los extremos */
  content:''; position:absolute; left:var(--e4); right:var(--e4); bottom:0; height:1px;
  background:linear-gradient(90deg, transparent,
    color-mix(in srgb, var(--amarillo) 55%, transparent) 20%,
    color-mix(in srgb, var(--amarillo) 95%, transparent) 50%,
    color-mix(in srgb, var(--amarillo) 55%, transparent) 80%, transparent);
}
.laca::before{                      /* grano, contra el banding del degradado */
  content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  opacity:.045; mix-blend-mode:overlay; background-size:140px 140px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
.laca .muted{color:color-mix(in srgb, var(--blanco-laca) 62%, transparent)}
.laca .fila{border-color:color-mix(in srgb, var(--luz) 12%, transparent)}
.laca .fila .k{color:color-mix(in srgb, var(--blanco-laca) 62%, transparent)}
.lustre{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:2}
.lustre i{position:absolute;top:-30%;bottom:-30%;width:38%;transform:skewX(-14deg);
  background:linear-gradient(90deg,transparent,color-mix(in srgb, var(--luz) 10%, transparent),transparent);
  animation:lustre 1.1s cubic-bezier(.25,.8,.25,1) .2s both}
@keyframes lustre{from{transform:translateX(-40%) skewX(-14deg)}to{transform:translateX(140%) skewX(-14deg)}}
@media (prefers-reduced-motion:reduce){.lustre{display:none}}

/* ---------------- cabecera ---------------- */
.cab{padding:calc(env(safe-area-inset-top) + 18px) 0 20px; border-radius:0 0 var(--r) var(--r)}
/* "Tu Garantía" va SIEMPRE con las dos palabras, también en caja alta. En Colombia
   "garantía" sola es lo que el prestamista EXIGE (fiador, prenda); el posesivo es lo
   que da vuelta el sentido: acá la garantía es del socio. Nunca partir la marca ni
   dejar el "Garantía" suelto. Con el tracking abierto el bloque respira y se lee como
   sello, no como texto. */
.marca{display:flex;align-items:center;gap:var(--e2);font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:700;color:color-mix(in srgb, var(--blanco-laca) 72%, transparent)}
.pin{width:24px;height:24px;border-radius:7px;background:var(--rojo);color:var(--luz);
  display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:0}
.cab h1{font-size:21px;margin-top:var(--e3);color:var(--blanco-laca)}
.chip-nivel{display:inline-flex;align-items:center;gap:var(--e2);margin-top:var(--e2);
  padding:var(--e1) var(--e3);border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--amarillo);border:1px solid color-mix(in srgb, var(--amarillo) 45%, transparent)}
/* la marca discreta de que estos datos salieron del Panel de este equipo */
.pto{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--azul-texto);flex:none}
.laca .pto,.pto.laca{background:var(--azul-laca)}

/* ---------------- tarjetas ---------------- */
.card{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);
  padding:var(--e4);margin-top:var(--e3)}
.card.laca{border:0;background:var(--placa);color:var(--blanco-laca)}
.card.pegado{padding-left:0;padding-right:0;overflow:hidden}
.card.quincenal{border-left:3px solid var(--rojo-texto)}
.card.respaldo{border-left:3px solid var(--azul-texto)}
.etq{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--gris)}
.etq.q{color:var(--rojo-texto)} .etq.r{color:var(--azul-texto)}
.laca .etq{color:color-mix(in srgb, var(--amarillo) 85%, transparent)}
.cifra{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.cifra.sm{font-size:24px;font-weight:700}
.cifra.oro{color:var(--amarillo)}
.cifra.azul{color:var(--azul-texto)}
/* Lo que el socio construyó cuando la fila cae SOBRE PAPEL. Es la misma cifra
   que sobre la laca va en .oro, pero ahí el amarillo no puede pisar: la ley
   solo le deja la tinta amarilla. El significado no cambia con la pantalla —
   si es lo construido, se ve construido en todas. */
.oro-tinta{color:var(--amarillo-tinta)}
h3.tit{font-size:18px}
.sub{font-size:14px;color:var(--gris);margin:var(--e2) 0 0}
.fila{display:flex;justify-content:space-between;align-items:baseline;gap:var(--e3);padding:var(--e3) 0;
  border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .k{color:var(--gris);font-size:14px}
.fila .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.fila .v.oro{color:var(--amarillo)}
.fila .v.azul,.fila .v.comprometida{color:var(--azul-laca)}
.fila .v.prestada{color:color-mix(in srgb, var(--amarillo) 62%, transparent)}
.sep{height:1px;background:var(--linea);margin:16px 0}
.laca .sep{background:color-mix(in srgb, var(--luz) 12%, transparent)}

/* ---------------- barra ---------------- */
.barra{height:var(--e2);border-radius:99px;background:var(--linea);overflow:hidden;margin-top:var(--e2)}
.laca .barra{background:color-mix(in srgb, var(--luz) 16%, transparent)}
.barra i{display:block;height:100%;border-radius:99px;background:var(--azul-texto);
  transition:width .7s cubic-bezier(.2,.8,.2,1)}
.laca .barra i{background:var(--amarillo)}
.laca .barra i.prestada{background:color-mix(in srgb, var(--amarillo) 62%, transparent)}
.laca .barra i.comprometida{background:var(--azul-laca)}
@media (prefers-reduced-motion:reduce){.barra i{transition:none}}

/* ---------------- botones y campos ---------------- */
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;font-size:16px;
  font-weight:600;font-family:inherit;cursor:pointer;background:var(--rojo);color:var(--luz);
  text-align:center;text-decoration:none;transition:transform .12s;min-height:44px}
.btn:active{transform:scale(.985)}
.btn.azul{background:var(--azul);color:var(--luz)}
.btn.sec{background:transparent;color:var(--tinta);border:1px solid var(--linea)}
.laca .btn.sec{color:var(--blanco-laca);border-color:color-mix(in srgb, var(--luz) 25%, transparent)}
.btn.sm{padding:var(--e3);font-size:14px;min-height:44px}
.btn.arriba{margin-top:var(--e4)}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=number],input[type=email],select,textarea{
  width:100%;padding:14px;border:1px solid var(--linea);border-radius:14px;font-size:16px;
  font-family:inherit;background:var(--papel);color:var(--tinta)}
input:focus,select:focus{outline:2px solid var(--rojo-texto);outline-offset:2px}
/* foco de teclado: lo tenían solo los campos; ahora lo tiene todo lo tocable */
:where(button,a,summary,[tabindex]):focus-visible{
  outline:2px solid var(--rojo-texto); outline-offset:2px; border-radius:8px}
.laca :where(button,a,summary):focus-visible{outline-color:var(--rojo-laca)}
input[type=range]{width:100%;accent-color:var(--rojo-texto);height:44px;padding:0;border:0;background:none}
input[type=range].azul{accent-color:var(--azul-texto)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:28px;height:28px;border-radius:50%;background:var(--rojo-texto);border:0}
input[type=range].azul::-webkit-slider-thumb{background:var(--azul-texto)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--linea)}

/* ---------------- casillas de autorización (habeas data) ------------------
   Toda la fila es tocable, no solo el cuadrito: un checkbox de 18px en un celular
   se falla, y este es el que decide si la persona puede abrir su cuenta. El
   cuadrito va a 22px y la fila entera pasa de 44 de alto. */
.permiso{display:flex;gap:12px;align-items:flex-start;margin:16px 0 0;padding:13px;
  border:1px solid var(--linea);border-radius:14px;cursor:pointer;
  font-size:14px;font-weight:400;line-height:1.5}
.permiso:has(input:checked){border-color:var(--azul-texto);background:var(--azul-tinte)}
.permiso input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--rojo);cursor:pointer}
.permiso:focus-within{outline:3px solid var(--amarillo);outline-offset:2px}
.permiso .muted{display:block;margin-top:4px}

/* ---------------- avisos: neutro, azul que explica, ámbar que avisa ------- */
.aviso{border-radius:14px;padding:14px;font-size:14px;margin-top:14px;line-height:1.5;
  border:1px solid var(--linea)}
.aviso.info{border-color:color-mix(in srgb, var(--azul-texto) 25%, transparent);
  background:var(--azul-tinte); color:var(--tinta)}
.aviso.info b{color:var(--azul-texto)}
/* El aviso de estado se trae su propio papel, y ese papel sigue al modo, igual
   que el del aviso azul de acá arriba: claro en claro, oscuro en oscuro. Lo que
   NO sigue al modo es el ámbar, que no se aclara nunca. Por eso en oscuro el
   ámbar deja de escribir y pasa a marcar: la regla de 3px del borde izquierdo,
   que a 3:1 contra su papel se ve de sobra, mientras adentro escribe --tinta.
   El aviso queda dicho igual —una superficie templada con el canto en ámbar—
   sin ser la cosa más brillante de una pantalla negra. */
.aviso.ambar{border-color:var(--ambar-filete);border-left:3px solid var(--ambar);
  background:var(--ambar-papel); color:var(--ambar-tinta)}
.aviso.ambar b{color:var(--ambar-tinta)}
.laca .aviso{border-color:color-mix(in srgb, var(--luz) 16%, transparent);
  background:color-mix(in srgb, var(--luz) 5%, transparent);color:var(--blanco-laca)}
.cinta{font-size:12px;color:var(--gris);text-align:center;padding:var(--e2) 16px 0}
.pill{display:inline-block;padding:var(--e1) 11px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--linea);color:var(--gris)}
/* La píldora sigue al aviso: mismo papel, mismo filete, misma tinta. Si no,
   en oscuro quedaba un confeti claro al lado de un aviso templado. */
.pill.ambar{border-color:var(--ambar-filete);
  background:var(--ambar-papel);color:var(--ambar-tinta)}

/* ---------------- calculadora ---------------- */

/* ---------------- la bienvenida ------------------------------------------
   Antes, al abrir la app instalada, se veía la pantalla negra del sistema y

   primer fotograma: si esperara al script, la pantalla negra volvería.

   Se va sola en cuanto la app está lista, y hay un plazo de seguridad por si
   el script no llega nunca — un splash que no se quita es una app que no abre.
   Se va con transición para que no dé el brinco de un corte seco.           */

  color:#fff;display:grid;place-items:center;

  line-height:1;box-shadow:0 18px 44px -18px var(--rojo);
  animation:sello-entra .62s cubic-bezier(.2,.9,.25,1) both}

  text-transform:uppercase;color:rgba(251,247,244,.5);
  animation:sube .5s ease .2s both}
/* El filete de oro que cruza por debajo: es el mismo del borde de la laca, y
   sirve de reloj — mientras se dibuja, la app está cargando. */
#hola .filete{width:132px;height:2px;border-radius:2px;overflow:hidden;

@keyframes sello-entra{

}

@keyframes filete{

}

<script>
'use strict';

var M = window.MotorReglas;

var COPc = function (n) {

  if (n >= 1000) return '$' + Math.round(n / 1000) + 'k';

};
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; });

/* 5-ago-2026 — UN PORCENTAJE QUE NO SE REDONDEA A SU FAVOR.
   Esto era `Math.round(t * 100) + '%'`, y con el reparto nuevo el factor del
   pago tarde pasó de 0,45 a 0,375: la pantalla imprimía "38%" donde la cuenta
   da 37,5%. Medio punto de más, y justo del lado que le conviene a la promesa,

   muestran los decimales que hagan falta (hasta dos), con coma como en el resto
   de la app, y sin ceros de relleno: el 20% sigue leyéndose "20%". */
var pct = function (t) {

};

function hoyISO() { return fechaRel(0); }

  var x = new Date(); x.setDate(x.getDate() + dias);

}

   ISO de verdad y lanza con null o con basura; en el historial hay créditos
   viejos sin corte, y una excepción acá dejaba la pestaña entera en blanco. */
function diasDeAtraso(corte) {
  if (!/^\d{4}-\d{2}-\d{2}/.test(String(corte || ''))) return 0;
  return Math.max(0, M.diasDeMora(String(corte).slice(0, 10), hoyISO()));
}

/* ============== A QUIÉN LE ESCRIBE EL SOCIO, Y DE PARTE DE QUIÉN ==============

   EL ATAQUE QUE ESTO EVITA
   El enlace de WhatsApp (#d=...) trae un paquete en base64 con el historial del
   socio. Ese paquete NO está firmado y no puede estarlo: firmar de verdad pide
   un secreto, y un secreto no puede vivir dentro de una página pública — quien
   abre la página se lo lleva. Cualquiera puede armar un paquete a mano.
   Si el número de WhatsApp y el nombre del negocio salieran de ahí, un estafador
   armaría un enlace a la página VERDADERA de Joan, con el nombre de Joan y SU

   El número y el nombre no salen del paquete: salen de acá, de la propia página.
   El atacante controla el hash de la URL; la página servida desde el sitio de
   Joan no la controla. Con eso el agujero queda cerrado sin ningún secreto.

   Si esa fuente no trae nada, o si el socio entró por un enlace, manda la
   página. Un enlace jamás puede aportar un destino. */
function contactoOficial() {
  var n = (S && !S.deEnlace && S.negocio) ? S.negocio : null;
  return {
    nombre: (n && n.nombre) || NEGOCIO_OFICIAL.nombre || 'Tu Garantía',

  };
}

/* ===================== SOCIOS DE PRUEBA ===================== */
/* ============================ SOCIOS DE PRUEBA ============================
   5-ago-2026. Antes había tres socios inventados: Ana Ruiz, Luis Gómez y Joan.
   Ana y Luis se fueron, por pedido de Joan y porque tenían un problema: cuando
   sus clientes de verdad ya están en el Panel, dos personajes de mentira en la
   pantalla de entrada solo sirven para que alguien entre con la cédula
   equivocada y crea que la app le está mostrando datos falsos.

   Queda uno solo, el de Joan, para que pueda verse como socio y probar la app
   sin tocar la cuenta de ningún cliente.

   Los clientes REALES no entran por acá: entran por el Panel (modo panel, en el
   equipo de Joan), por el enlace de WhatsApp, o por Supabase cuando esté
   conectado. Ver el orden de búsqueda en abrirPorCedula().               */
var DEMOS = (function () {
  /* ---- La cuenta de Joan ----
     3 créditos de 100.000, todos pagados en fecha. 60.000 de costos, 45.000 de
     garantía ganada (el 75% de cada costo) + 100.000 de cupón = 145.000 de
     garantía total. Nivel plata (con 3 pagos puntuales; el oro pide 5), y el
     cupo es esa misma garantía UNO A UNO: 145.000. Préstamo con garantía hasta
     45.000, que es solo la ganada.

     5-ago-2026: este comentario decía 54.000 / 154.000 / cupo 308.000, que era
     el 90% del costo y la garantía multiplicada por el factor de plata (2,0).
     Las dos reglas se derogaron el mismo día. Las cifras nunca estuvieron
     escritas a mano —salen del motor unas líneas más abajo—, así que la cuenta
     ya cambió sola; lo único que había quedado mintiendo era este texto. */
  var montosJoan = [100000, 100000, 100000];
  var credJoan = [], ganadaJoan = 0;
  for (var j = 0; j < montosJoan.length; j++) {
    var capJ = montosJoan[j];

    var ganJ = M ? M.acumularGarantia(costoJ, true) : 0;   // 0,75 sobre 20.000 = 15.000
    ganadaJoan += ganJ;
    credJoan.push({
      codigo: 'CR-' + String(3 - j).padStart(4, '0'),
      capital: capJ, costo: costoJ,
      desembolso: fechaRel(-15 * (j + 1) - 12),
      corte: fechaRel(-15 * (j + 1)),
      pagado: true,
      fecha_pagado: fechaRel(-15 * (j + 1) - 1),   // un día antes del corte: puntual
      abonado: capJ + costoJ, prorrogas: 0, garantia: ganJ
    });
  }
  var datosJoan = {
    nombre: 'Joan Hispanista', cedula: '79111000', celular: '3001112026', whatsapp: true,
    correo: 'joan@tugarantia.co', ciudad: 'Bogotá Chapinero', direccion: 'Cll 63 #11-20',
    vivienda: 'apartamento 402', pago: 'Nequi 3001112026', celular2: '6012223344',
    referencia: 'Marta Ruiz 3009998877', ubicacion: { lat: 4.65, lng: -74.06, acc: 20 },
    foto_cedula_frente: 'si', foto_cedula_reverso: 'si', foto_selfie: 'si'
  };
  var cuponJoan = M ? M.garantiaPorDatos(datosJoan).total : 0;

  /* El nivel también sale del motor. Escrito a mano, el día que cambien los
     requisitos esta cuenta seguiría diciendo "platino" mientras el cupo se
     calcula con otra cosa, que es justo la clase de mentira que este proyecto
     lleva semanas persiguiendo. */
  var nivelJoan = M ? M.evaluarNivel(montosJoan.length, montosJoan.length, montosJoan.length, null) : 'plata';
  var totalPrestadoJoan = montosJoan.reduce(function (t, c) { return t + c; }, 0);

  return [

          nivel: nivelJoan, pagados_a_tiempo: montosJoan.length, racha: montosJoan.length,

  ];
})();
function buscarDemo(cedula, tel4) {

/* ============ HISTORIAL QUE VIENE DENTRO DEL ENLACE ============ */
function desdeEnlace() {
  var m = /[#&]d=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
  if (!m) return null;
  try {
    var s = m[1].replace(/-/g, '+').replace(/_/g, '/');
    var bin = atob(s), by = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) by[i] = bin.charCodeAt(i);
    var paq = JSON.parse(new TextDecoder().decode(by));
    if (!paq || !paq.d) return null;
    /* El paquete se queda SIN contacto, acá en la puerta. Cualquiera puede
       armar un #d= a mano —no está firmado ni puede estarlo, ver
       NEGOCIO_OFICIAL— así que si trajera un número de WhatsApp, un estafador
       mandaría un enlace a la página verdadera de Joan con su propio número
       adentro y el cliente le escribiría a él. Números y cifras del socio sí
       vienen del paquete: mentir ahí solo se engaña a sí mismo. El destino no.
       Se borra en vez de ignorarse para que ningún código de mañana lo lea. */
    delete paq.d.negocio;
    return { nombre: paq.n, datos: paq.d, actualizado_en: paq.f || null, deEnlace: true };
  } catch (e) { return null; }
}

var S = null, TAB = 'inicio', MONTO = 300000, NUEVOS = {};
/* Qué producto está mirando en la calculadora. El quincenal sale por defecto:
   es el de todos los días. El de garantía hay que ir a buscarlo. */
var MODO = 'quincenal', PLAZO = 3;

function mostrar(cual) {
  ['pEntrar', 'pCargando', 'pCuenta'].forEach(function (p) { $(p).classList.toggle('oculto', p !== cual); });
  window.scrollTo(0, 0);

/* ================= EL PANEL DE ESTE MISMO EQUIPO =================
   El Panel de Joan y esta app se sirven del mismo origen, así que comparten
   localStorage: acá se leen sus clientes de verdad, sin nube y sin enlaces.

   SOLO LECTURA. Esa llave es la cartera real de Joan. Acá no hay ni puede
   haber un setItem ni un removeItem: si esto escribe, le borra los clientes.

   En el celular de un cliente esa llave está vacía, así que no se filtra nada,
   y aun en el equipo de Joan sigue haciendo falta cédula + 4 dígitos: no se
   puede listar a nadie. */
var LLAVE_PANEL = 'joan_socios_v1';
var P = window.PuenteTuGarantia || null;

function leerPanel() {
  try {
    if (!P) return null;
    if (location.protocol === 'file:') return null;
    var crudo = localStorage.getItem(LLAVE_PANEL);
    if (!crudo) return null;
    return P.normalizar(JSON.parse(crudo));
  } catch (e) { return null; }
}
/* ¿Este equipo es el de Joan, o sea, tiene el Panel con clientes de verdad?
   Se usa para no anunciar la cuenta de prueba donde hay datos reales: quien esté
   mirando no tiene que dudar de si lo que ve son sus números o los inventados. */
function hayPanel() {
  var db = leerPanel();
  return !!(db && db.socios && db.socios.length);
}

/* El enlace que abre el Panel: #p=cedula-4dígitos. Va en el hash a propósito,
   porque el hash no sale del navegador; un ?p= quedaría en los registros del
   servidor. Y solo sirve donde vive el Panel: en el celular de un cliente esa
   llave está vacía. */
function desdePanel() {
  var m = /[#&]p=(\d{5,15})-(\d{4})\b/.exec(location.hash || '');
  return m ? buscarEnPanel(m[1], m[2]) : null;
}
function buscarEnPanel(ced, tel) {
  try {
    var db = leerPanel(); if (!db) return null;
    var s = P.buscarSocio(db, ced, tel); if (!s) return null;
    return { nombre: s.nombre || 'Socio', datos: P.migrarSocio(db, s),
             actualizado_en: null, origen: 'panel', cedula: ced, tel4: tel };
  } catch (e) { return null; }
}

/* ============================ ENTRAR ============================
   Tres fuentes, siempre en este orden: la nube, el Panel de este equipo, y los
   socios de prueba. Si una no está disponible se salta, no se cae. */
function buscarEnNube(ced, tel) {
  if (!CFG.url || !CFG.anon) return Promise.resolve({ dato: null, falloRed: false });
  return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/historial_socio', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
    body: JSON.stringify({ p_cedula: ced, p_tel4: tel })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
    .then(function (j) { return { dato: j || null, falloRed: false }; })
    .catch(function () { return { dato: null, falloRed: true }; });
}

function entrar() {
  var ced = ($('inCedula').value || '').replace(/\D/g, '');
  var tel = ($('inTel').value || '').replace(/\D/g, '').slice(-4);
  $('errEntrar').classList.add('oculto');
  if (ced.length < 5) return fallo('Escribe tu número de cédula completo.');
  if (tel.length < 4) return fallo('Necesito los últimos 4 números de tu celular.');
  mostrar('pCargando');

  buscarEnNube(ced, tel).then(function (n) {
    if (n.dato) { n.dato.cedula = ced; n.dato.tel4 = tel; n.dato.origen = 'nube'; return abrir(n.dato, false); }

    var p = buscarEnPanel(ced, tel);
    if (p) return abrir(p, false);

    var d = buscarDemo(ced, tel);
    if (d) { d.cedula = ced; d.tel4 = tel; d.origen = 'demo'; return abrir(d, true); }

    /* Nunca se dice "la cédula existe pero el celular no coincide": eso
       convertiría la app en un oráculo de cédulas. */
    fallo(n.falloRed
      ? 'No pude conectarme. Revisa que tengas internet y vuelve a intentar.'
      : 'No encontré esa cédula con ese celular. Revisa los números, y si siguen sin salir escríbenos.' +
        (location.protocol === 'file:'
          ? ' Si estás abriendo esto como archivo, ábrelo desde la dirección web: así las dos páginas se ven entre sí.'
          : ''));
  });

  function fallo(msg) { $('errEntrar').textContent = msg; $('errEntrar').classList.remove('oculto'); mostrar('pEntrar'); }
}

function tecleaCodigo(el) {
  var t = (el.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (t.indexOf(M.PREFIJO_CODIGO) === 0) t = t.slice(M.PREFIJO_CODIGO.length);
  t = t.slice(0, M.LARGO_CODIGO);
  el.value = t ? M.PREFIJO_CODIGO + '-' + (t.length > 4 ? t.slice(0, 4) + '-' + t.slice(4) : t) : '';
}

function pedirCuenta() {
  var err = $('errRegistro');

  var cod = $('inCodigo').value || '';
  var nom = ($('regNombre').value || '').trim();
  var ced = ($('regCedula').value || '').replace(/\D/g, '');
  var tel = ($('regTel').value || '').replace(/\D/g, '');

  if (!M.codigoInvitacionValido(cod)) {
    return falla('<b>Ese código no es válido.</b> Fíjate que no falte ni sobre una letra; los códigos ' +
      'son de ' + M.LARGO_CODIGO + ' caracteres, como ' + M.PREFIJO_CODIGO + '-A3F7-K92M.');
  }
  if (nom.length < 3) return falla('Escribe tu nombre completo.');
  if (ced.length < 5) return falla('Escribe tu número de cédula completo.');
  if (tel.length < 7) return falla('Escribe tu número de celular completo.');

  var codigo = M.normalizarCodigoInvitacion(cod);

      method: 'POST',

      body: JSON.stringify({ p_codigo: codigo, p_cedula: ced, p_telefono: tel, p_nombre: nom })
    }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
      .then(function (j) {
        if (j && j.ok) return registroListo(codigo, nom, ced, tel, 'nube');
        var motivo = (j && j.motivo) || 'no_existe';
        /* No se distingue "no existe" de "anulada": si no, la app se vuelve un
           adivinador de códigos. */
        falla(motivo === 'usada'
          ? '<b>Ese código ya lo usó otra persona.</b> Cada código sirve para uno solo. Pídele otro a quien te invitó.'
          : motivo === 'vencida'
            ? '<b>Ese código ya venció.</b> Pídele uno nuevo a quien te invitó.'
            : motivo === 'datos'
              ? 'Revisa tu cédula y tu celular: alguno quedó incompleto.'

      })
      .catch(function () { registroListo(codigo, nom, ced, tel, 'sin_conexion'); });
  }
  registroListo(codigo, nom, ced, tel, 'local');
}
