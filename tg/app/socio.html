/* ==================== PREPARAR AL SOCIO ==================== */
function abrir(resp, esDemo) {
  var d = resp.datos || {};
  var g = d.garantia || {};
  var creditos = (d.creditos || []).slice();
  var respaldados = (d.respaldados || []).slice();

  var nivel = M.evaluarNivel(Number(g.pagados_a_tiempo || 0), Number(g.racha || 0),
                             Number(g.meses_sin_mora || 0), g.nivel || 'bronce');

  /* Las dos garantías. El paquete ya trae el cupón y los referidos en pesos,
     así que el desglose se arma con esos mismos pesos y no se recalcula: si se
     recalculara habría dos verdades sobre la misma plata. */
  var abiertos = respaldados.filter(function (r) { return !r.pagado; });
  var comprometidaCruda = Number(g.comprometida != null ? g.comprometida
    : abiertos.reduce(function (t, r) { return t + Number(r.saldo_capital || 0); }, 0)) || 0;
  var ganada = Math.max(0, Number(g.acumulada || 0));
  var gd = {
    cupon: Number(g.cupon || 0),
    referidos: Number(g.referidos || 0),
    /* Las dos partes tienen que sumar el total SIEMPRE, así que la prestada se
       saca por resta: si un ajuste se comió parte del cupón, se nota acá y no
       queda una cifra que no cuadra con la de arriba. */
    prestada: Math.max(0, Number(g.total || 0) - ganada),
    ganada: ganada,
    comprometida: Math.min(comprometidaCruda, ganada),
    total: Number(g.total || 0)
  };
  gd.ganada_libre = gd.ganada - gd.comprometida;
  gd.base_cupo = Math.max(0, gd.total - gd.comprometida);

  S = {
    nombre: resp.nombre || 'Socio',
    codigo: (d.socio && d.socio.codigo) || '',
    cedula: resp.cedula || '', tel4: resp.tel4 || '',
    esDemo: !!esDemo, deEnlace: !!resp.deEnlace, actualizado: resp.actualizado_en,
    origen: resp.origen || (esDemo ? 'demo' : (resp.deEnlace ? 'enlace' : 'nube')),
    g: g,
    gd: gd,
    comprometida: gd.comprometida,
    garantia: Number(g.total || 0),
    nivel: nivel,
    /* El cupo es la garantía UNO A UNO (5-ago-2026): calcularCupo ya no
       multiplica por el nivel, solo redondea hacia abajo y topa en CUPO_MAXIMO.
       Se le sigue pasando el nivel porque el motor lo valida —un nivel inventado
       tiene que reventar acá y no dos pantallas más allá—, no porque mueva el
       número. */
    cupo: M.calcularCupo(gd.base_cupo, nivel),
    /* Y el máximo respaldado sale de la ÚNICA función que lo produce, no de un
       Math.min escrito acá: maximoRespaldado es la que sabe que solo la ganada
       libre respalda un préstamo, nunca el cupón que le prestamos nosotros. */
    maxRespaldado: M.maximoRespaldado({
      datos: (d.perfil && d.perfil.datos) || {},
      referidos: Number((d.referidos && d.referidos.pagaron) || 0),
      acumulada: gd.ganada, ajuste: 0, comprometida: gd.comprometida }),
    creditos: creditos,
    respaldados: respaldados,
    respaldadoActivo: abiertos[0] || null,
    activo: creditos.filter(function (c) { return !c.pagado; })[0] || null,
    pagados: creditos.filter(function (c) { return c.pagado; }),
    perfil: (d.perfil && d.perfil.datos) || {},
    referidos: d.referidos || { total: 0, pagaron: 0, lista: [] },
    resumen: d.resumen || {},
    /* Solo se lee cuando la fuente es de confianza: quien decide es
       contactoOficial(), no esta línea. Del enlace llega siempre vacío. */
    negocio: d.negocio || { nombre: NEGOCIO_OFICIAL.nombre, whatsapp: NEGOCIO_OFICIAL.whatsapp },
    comunidad: d.comunidad || null
  };
  NUEVOS = {};
  MODO = 'quincenal'; PLAZO = 3;
  /* Abre en un monto donde los DOS productos están VIVOS. Si el arranque pasa
     la garantía ganada, la comparación —que es lo primero que el socio mira
     para elegir— nace con el lado azul desteñido y un "no te alcanza", incluso
     al socio de nivel más alto. Así que el techo de apertura es lo menor entre
     su cupo, su respaldo máximo y 500.000, redondeado hacia abajo al escalón
     del control para que la cifra y el pulgar no digan cosas distintas.
     El piso lo pone limitesCalc, que ya sabe cederle al socio de cupo chico. */
  var lIni = limitesCalc();
  var techoIni = Math.min(S.cupo || 300000, 500000);
  if (S.maxRespaldado > 0) techoIni = Math.min(techoIni, S.maxRespaldado);
  MONTO = Math.max(lIni.min, Math.floor(techoIni / lIni.paso) * lIni.paso);

  $('uNombre').textContent = S.nombre.split(' ').slice(0, 2).join(' ');
  $('uNivel').innerHTML = esc('Socio ' + nivel + ' · ' + COP(S.garantia)) +
    (S.origen === 'panel'
      ? '<span class="pto" title="Datos leídos del Panel de este dispositivo"></span>' : '');
  irA('inicio');
  mostrar('pCuenta');
}

/* La entrada que entiende el motor. El cupón sale de los datos que el socio
   tiene cargados y los referidos de los que ya pagaron: es la misma cuenta que
   hizo el Panel, no una segunda. */
function entradaMotor() {
  return { datos: S.perfil, referidos: Number(S.referidos.pagaron || 0),
           acumulada: S.gd.ganada, ajuste: 0, comprometida: S.gd.comprometida };
}

function irA(tab) {
  TAB = tab;
  var b = $('nav').querySelectorAll('button');
  for (var i = 0; i < b.length; i++) b[i].classList.toggle('on', b[i].dataset.t === tab);
  $('cuerpo').innerHTML = '<div class="panel">' +
    (tab === 'inicio' ? vistaInicio() :
     tab === 'calc' ? vistaCalculadora() :
     tab === 'garantia' ? vistaGarantia() : vistaHistorial()) + '</div>';
  if (tab === 'calc') sincronizarCalc();
  window.scrollTo(0, 0);
}

/* ============================ INICIO ============================
   En cada pantalla manda UNA cifra. Acá manda lo que tiene que pagar este
   corte; si no debe nada, manda su cupo. Nunca las dos grandes a la vez. */
function proximaCuotaRespaldado() {
  if (!S.respaldadoActivo) return null;
  return (S.respaldadoActivo.cuotas || []).filter(function (c) { return !c.pagado; })
    .sort(function (a, b) { return String(a.fecha).localeCompare(String(b.fecha)); })[0] || null;
}

/* El próximo corte del calendario, el 15 o el último día del mes, corrido al
   siguiente día hábil. Sale del motor, no de una cuenta a mano.

   No es lo mismo que calcularFechaCorte(hoy): esa descarta el corte que está a
   menos de cinco días porque es la fecha en que caería un crédito NUEVO. Acá la
   pregunta es otra —qué vence en el corte que viene—, y un corte pasado mañana
   sigue siendo el corte que viene. */
function proximoCorte() {
  var hoy = hoyISO();
  var a = Number(hoy.slice(0, 4)), m = Number(hoy.slice(5, 7)) - 1;
  var cand = M.cortesNominalesDelMes(a, m)
    .concat(M.cortesNominalesDelMes(m === 11 ? a + 1 : a, (m + 1) % 12));
  for (var i = 0; i < cand.length; i++) {
    var f = M.iso(M.siguienteDiaHabilDeCorte(cand[i]));
    if (f >= hoy) return f;
  }
  return M.calcularFechaCorte(hoy);
}

function vistaInicio() {
  var h = '';
  if (S.esDemo) h += '<div class="cinta">Estás viendo un ejemplo: la base todavía no está conectada.</div>';

  var cuota = proximaCuotaRespaldado();
  /* "Este corte" se mide contra el corte que viene DE VERDAD, no contra el
     corte del crédito quincenal: si no hay quincenal abierto, una cuota que
     está a cuatro meses no vence este corte. */
  var corteQueViene = proximoCorte();
  var mismoCorte = !!cuota && String(cuota.fecha || '') <= corteQueViene;
  /* El recargo de mora entra ACÁ. Es lo que tiene que pagar HOY, y esta es la
     cifra que manda en la pantalla. Sin el recargo, esta cifra y la de la
     tarjeta del crédito —que sí lo suma— eran dos números distintos para la
     misma deuda a dos centímetros uno del otro: delante de un cliente eso es
     una discusión, y le hace perder la razón a Joan aunque la tenga.
     La verdad es una sola y es esta: lo de hoy, con mora incluida.

     4-ago-2026: la cuenta la hace el MOTOR (liquidacion), no esta función. Acá
     se sumaban capital + costo + recargo a mano y con el capital entero de
     base, así que a un socio en plan de pagos esta cifra y la del Panel no se
     parecían ni de lejos. */
  var cicloAct = S.activo ? cicloDelCredito(S.activo) : null;
  var qAct = S.activo ? liquidacion(S.activo) : null;
  var diasMora = qAct ? qAct.dias_mora : 0;
  var moraCredito = qAct ? qAct.recargo_mora : 0;
  var deCredito = qAct ? qAct.total_a_pagar : 0;
  var deCuota = mismoCorte ? Number(cuota.total || 0) : 0;
  var aPagar = deCredito + deCuota;

  if (aPagar > 0) {
    /* La cifra que manda acá es una DEUDA, así que no va en amarillo: el
       amarillo es lo que el socio construyó. Sobre la laca la deuda va en la
       tinta de la placa, y el único amarillo de esta tarjeta es el cupo, que
       eso sí se lo ganó. */
    h += '<div class="card laca">' +
      '<div class="etq">Este corte tienes que pagar</div>' +
      '<div class="cifra">' + COP(aPagar) + '</div>' +
      (deCredito && deCuota
        ? fila((cicloAct.en_plan ? 'Tu cuota ' + cicloAct.numero + ' de ' + cicloAct.cuotas +
                                   ' del plan de pagos' : 'Tu crédito quincenal') +
               (moraCredito ? ', con el recargo' : ''), COP(deCredito)) +
          fila('Cuota ' + cuota.n + ' del préstamo con garantía', COP(deCuota))
        : '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
          (deCuota ? 'La cuota ' + cuota.n + ' de tu préstamo con garantía, el ' + fmtFecha(cuota.fecha) + '.'
                   : moraCredito
                     ? 'Es ' + cicloAct.nombre + ', que vencía el ' + fmtFecha(S.activo.corte) +
                       '. Ya trae adentro el recargo de los ' + diasMora + ' días.'
                     : 'Es ' + cicloAct.nombre + ', el ' + fmtFecha(S.activo.corte) + '.') + '</div>') +
      '<div class="sep"></div>' +
      '<div class="fila"><span class="k">Puedes pedir hasta</span>' +
        '<span class="v oro">' + esc(COP(S.cupo)) + '</span></div>' +
      '<button class="btn arriba" onclick="irA(\'calc\')">Calcular y pedir</button>' +
      '</div>';
  } else {
    h += '<div class="card laca">' +
      '<div class="etq">Puedes pedir hasta</div>' +
      '<div class="cifra oro">' + COP(S.cupo) + '</div>' +
      '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      'El costo es siempre el ' + pct(M.TASA_CREDITO) + ' de lo que pidas.</div>' +
      /* LA REGLA DEL PRODUCTO, EN UNA LÍNEA (5-ago-2026). Antes acá había que
         explicar niveles y factores para que el socio entendiera de dónde salía
         su cupo; desde que el cupo es la garantía uno a uno, la regla entera
         cabe en un renglón y va donde primero se mira. El porcentaje sale del
         motor (crecimiento_por_credito = 0,20 × 0,75), nunca escrito acá. */
      '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      'Y cada crédito que pagas en fecha te sube el cupo un <b>' +
      pct(M.reglasResumen().cupo.crecimiento_por_credito) + '</b>.</div>' +
      (S.maxRespaldado > 0
        ? '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
          'Y con la garantía que ya te ganaste puedes pedir hasta ' + COP(S.maxRespaldado) +
          ' al ' + pct(M.TASA_RESPALDADO_MENSUAL) + ' al mes.</div>'
        : '') +
      '<button class="btn arriba" onclick="irA(\'calc\')">Calcular y pedir</button>' +
      '</div>';
  }

  h += S.activo ? tarjetaActivo(S.activo) :
       '<div class="card"><div class="etq">Tu crédito</div>' +
       '<p style="margin:var(--e2) 0 0">No tienes ningún crédito abierto.</p>' +
       '<p class="sub">Tu cupo te está esperando para cuando lo necesites.</p></div>';

  if (S.respaldadoActivo) h += tarjetaRespaldadoActivo(S.respaldadoActivo, cuota);

  h += '<div class="card" onclick="irA(\'garantia\')" style="cursor:pointer">' +
       '<div class="etq">Tu garantía</div>' +
       /* Lo construido, pero sobre papel: acá el amarillo no puede pisar, pisa
          su tinta. Blanco no, que blanco es cualquier cifra. */
       '<div class="cifra sm oro-tinta">' + COP(S.garantia) + '</div>' +
       /* "Es lo que te deja pedir más" era la frase de cuando el cupo salía de
          multiplicar esto por un factor. Hoy no hay nada en el medio: la
          garantía ES el cupo, y decirlo así ahorra la pantalla entera de
          explicación que antes hacía falta. */
       '<p class="sub">Es tu historial hecho número, y es tu cupo: puedes pedir exactamente ' +
       'lo que tienes. No se retira, y cada crédito que pagas en fecha la sube un ' +
       pct(M.reglasResumen().cupo.crecimiento_por_credito) + '.</p>' +
       '<div class="barra"><i style="width:' + progresoNivel() + '%"></i></div>' +
       '<div class="muted" style="font-size:13px;margin-top:var(--e2)">' + textoProximoNivel() + '</div>' +
       '</div>';

  h += tarjetaComunidad();
  return h + pie();
}

/* ========================== LA COMUNIDAD ==========================
   No es un banco: es un grupo. Acá el socio ve que entró a algo, no que le
   prestaron. Solo cifras del conjunto — nunca el nombre ni el monto de nadie. */
function tarjetaComunidad() {
  var c = S.comunidad;
  if (!c || !c.socios) {
    return '<div class="card" onclick="verReglas()" style="cursor:pointer">' +
      '<div class="etq">Cómo funciona esto</div>' +
      '<p style="margin:var(--e2) 0 0;font-size:14.5px">Las reglas del acuerdo, completas y sin letra chica.</p>' +
      '</div>';
  }
  return '<div class="card" onclick="verComunidad()" style="cursor:pointer">' +
    '<div class="etq">La comunidad</div>' +
    '<div class="cifra sm">' + c.socios + ' socios</div>' +
    '<p class="sub">Entre todos llevan ' + COP(c.garantia_construida) + ' de garantía construida.</p>' +
    '<div class="muted" style="font-size:13px;margin-top:var(--e3)">Ver cómo va el grupo y las reglas →</div>' +
    '</div>';
}

function verComunidad() {
  var c = S.comunidad || {};
  var h = '<div class="card laca"><div class="etq">Somos</div>' +
    '<div class="cifra">' + (c.socios || 0) + ' socios</div>' +
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      'Esto no es un banco. Es un grupo que se presta entre sí y crece junto.</div>' +
    (c.desde ? fila('Andando desde', fmtFecha(c.desde)) : '') +
    '</div>';

  h += '<div class="card"><h3 class="tit">Lo que llevamos entre todos</h3>' +
    '<p class="sub">Cifras del grupo. Aquí no aparece el nombre ni el monto de nadie, ni el tuyo.</p>' +
    fila('Garantía construida', COP(c.garantia_construida || 0)) +
    fila('Créditos pagados', String(c.creditos_pagados || 0)) +
    (c.puntualidad != null ? fila('Se pagan en fecha', c.puntualidad + '%') : '') +
    '</div>';

  var miParte = c.garantia_construida
    ? Math.max(1, Math.round(Number(S.g.acumulada || 0) / c.garantia_construida * 100)) : 0;
  h += '<div class="card"><h3 class="tit">Tu parte</h3>' +
    fila('De lo construido, pusiste', miParte + '%') +
    fila('Gente que trajiste', String(S.referidos.total || 0)) +
    '<p class="sub" style="margin-top:var(--e3)">El grupo crece cuando alguien trae a alguien y esa ' +
    'persona paga. Por eso traer gente te suma cupo: no es una comisión, es que el grupo se hizo ' +
    'más grande.</p>' +
    '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="invitar()">Invitar a alguien</button>' +
    '</div>';

  h += '<div class="card" onclick="verReglas()" style="cursor:pointer">' +
    '<div class="etq">Cómo funciona esto</div>' +
    '<p style="margin:var(--e2) 0 0;font-size:14.5px">Las reglas del acuerdo, completas. Las mismas para todos.</p>' +
    '</div>';

  h += '<button class="btn sec" style="margin-top:var(--e3)" onclick="irA(\'inicio\')">Volver</button>';
  $('cuerpo').innerHTML = '<div class="panel">' + h + '</div>';
  window.scrollTo(0, 0);
}

/* ============ LO QUE DE VERDAD CUESTA UN PLAN DE PAGOS ============
   4-ago-2026. Esta pantalla decía —con las palabras del motor— que el saldo se
   puede pasar a "un plan de pagos en 3 cortes con un costo reducido del 5%", y
   se callaba la ENTRADA. El día que el plan se pacta, el Panel cobra el costo
   de la quincena que no se pagó (el 20% del capital) y, si el socio venía
   atrasado, el 1% diario ya causado, que el plan tampoco borra. Sobre 600.000
   el socio leía 60.000 y le cobraban 180.000: el triple. Y a un socio con 35
   días encima, 330.000 solo de entrada.
   Un socio que lee 60.000 y le cobran 180.000 no vuelve, y hace bien. Así que
   el precio se dice entero, con la entrada adentro y el caso de la mora dicho.
   Las cifras salen del motor —calcularCosto y construirPlanDePagos, las mismas
   que hacen el cobro—, nunca de una multiplicación escrita en esta página: el
   día que cambie una tasa, este texto cambia solo. */
function ejemploPlanDePagos(capital) {
  var k = Math.min(M.MONTO_MAXIMO_CALCULADORA,
                   Math.max(M.MONTO_MINIMO, Math.round(Number(capital) || 0)));
  var hoy = hoyISO();
  var plan = M.construirPlanDePagos({ capital: k, fecha_corte: hoy }, { desde: hoy });
  return {
    capital: k,
    entrada: M.calcularCosto(k),          // el costo de la quincena, que no se perdona
    cortes: plan.cuotas.length,
    costo_cortes: plan.total_costo,
    costo_total: M.calcularCosto(k) + plan.total_costo
  };
}

function bloquePlanDePagos() {
  var c = S && S.activo;
  var ciclo = c ? cicloDelCredito(c) : null;
  /* Con su propia deuda si la tiene, que es la que va a entender; si ya está en
     un plan, `capital` es el de la cuota y no sirve de ejemplo, así que manda su
     cupo. Nunca una cifra inventada por esta página. */
  var base = (c && ciclo && !ciclo.en_plan) ? c.capital : (S ? S.cupo : 0);
  var e = ejemploPlanDePagos(base);
  /* Si el ejemplo terminó siendo SU deuda, el recargo que se le dice es el suyo
     de verdad —el que ya liquidó el puente y le va a cobrar el Panel—, no un 1%
     recalculado acá sobre el capital que quedó: con un abono de por medio esas
     dos cifras no son la misma, y la que él cree es la que lee. */
  var suyo = !!(c && ciclo && !ciclo.en_plan && e.capital === c.capital);
  var q = suyo ? liquidacion(c) : null;
  var dias = suyo ? q.dias_mora : (c ? Math.max(0, M.diasDeMora(c.corte, hoyISO())) : 0);
  var recargo = suyo ? q.recargo_mora : (dias > 0 ? M.recargoPorMora(e.capital, dias) : 0);

  return '<div class="card"><div class="etq">El plan de pagos, con todo lo que cuesta</div>' +
    '<p style="margin:var(--e2) 0 0;font-size:14.5px">El plan reparte lo que debes en ' + e.cortes +
    ' cortes, y cada corte cuesta el ' + pct(M.TASA_PLAN_DE_PAGOS) + ' de lo que quede debiendo. ' +
    'Pero ese ' + pct(M.TASA_PLAN_DE_PAGOS) + ' <b>no es todo lo que cuesta el plan</b>: el día que se ' +
    'pacta se paga una <b>entrada</b>, que es el costo de la quincena que no alcanzaste a pagar, el ' +
    pct(M.TASA_CREDITO) + ' del capital. Preferimos que lo sepas hoy y no el día del cobro.</p>' +
    fila('Si debieras ' + COP(e.capital) + ', la entrada', COP(e.entrada)) +
    fila('Los ' + e.cortes + ' cortes al ' + pct(M.TASA_PLAN_DE_PAGOS), COP(e.costo_cortes)) +
    '<div class="fila"><span class="k">Te costaría en total</span>' +
      '<span class="v"><b>' + esc(COP(e.costo_total)) + '</b></span></div>' +
    '<div class="aviso ambar">Y si llegas al plan <b>ya atrasado</b>, el plan no borra el recargo: la ' +
    'entrada lleva además el ' + pct(M.TASA_MORA_DIARIA) + ' diario de los días que lleves encima.' +
    (recargo ? ' Con los ' + dias + ' que llevas hoy, serían ' + COP(recargo) + ' más de entrada.' : '') +
    '</div>' +
    /* "Igual que cualquier otro pago" ya no era exacto: si el crédito llegó al
       plan atrasado, sus cuotas acreditan al factor de mora (§4-bis). Suma, y eso
       es lo que importa acá, pero no se promete el factor completo que no va a
       llegar. Los dos porcentajes salen de las constantes —hoy 75% y 37,5%—, así
       que esta pantalla no se puede quedar en el reparto viejo. */
    '<div class="muted" style="font-size:13px;margin-top:var(--e3)">Todo lo que pagues en el plan te ' +
    'sigue sumando garantía: el ' + pct(M.FACTOR_GARANTIA) + ' del costo si el crédito nunca se ' +
    'atrasó, el ' + pct(M.FACTOR_GARANTIA_MORA) + ' si venía atrasado. Y el plan es una salida, no ' +
    'un castigo: no bajas de nivel ni pierdes nada de lo que llevas construido.</div></div>';
}

/* Las reglas salen del motor, no de un texto suelto: si algún día cambia un
   número, esta pantalla cambia sola. No puede quedar prometiendo otra cosa. */
function verReglas() {
  var r = M.reglasResumen();
  /* `extra` va en crudo y solo lo pone esta función: es para la letra que el
     motor no trae en su resumen y que la pantalla no puede callarse. */
  var bloque = function (titulo, texto, extra) {
    return '<div class="card"><div class="etq">' + esc(titulo) + '</div>' +
      '<p style="margin:var(--e2) 0 0;font-size:14.5px">' + esc(texto) + '</p>' +
      (extra || '') + '</div>';
  };
  var h = '<div class="card laca"><div class="etq">El acuerdo</div>' +
    '<h1 style="font-size:22px;margin-top:var(--e2);color:var(--blanco-laca)">Cómo funciona esto</h1>' +
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">Las mismas reglas para todos los ' +
    'socios. Están aquí para que las puedas leer cuando quieras, no solo cuando pides.</div></div>';

  h += bloque('El costo', r.costo.texto);
  /* 5-ago-2026 — EL CUPO, PRIMERO Y EN UNA LÍNEA.
     Acá antes se llegaba al cupo por partes: la garantía en un bloque, los
     niveles en otro, y el socio tenía que multiplicar de cabeza para saber
     cuánto podía pedir. Desde que el cupo es la garantía uno a uno, la regla
     entera es una frase, y va antes que todo lo demás porque es la pregunta que
     el socio trae. El texto sale de reglasResumen().cupo, o sea de las mismas
     constantes que hacen la cuenta. */
  h += bloque('Tu cupo es tu garantía', r.cupo.texto);
  /* §4-bis, y va acá porque es la única pantalla donde el socio viene a leer la
     regla entera. "Pagando en la fecha suma completo" es verdad del crédito que
     nunca se atrasó; el que ya se atrasó suma la mitad hasta que termine,
     aunque el corte que le compró la prórroga se pague puntual. Sin esto, el
     acuerdo prometía algo que la cuenta no iba a dar. */
  h += bloque('De dónde sale la garantía', r.garantia.texto,
    '<div class="aviso"><b>Y el atraso no se borra aplazando.</b><br>' +
    'El ' + pct(r.garantia.factor_puntual) + ' es del crédito que <b>nunca</b> se atrasó. Si uno se ' +
    'atrasa, desde ahí suma el ' + pct(r.garantia.factor_mora) + ' hasta que lo termines, aunque ' +
    'pidas una prórroga y pagues puntual la fecha nueva: la prórroga te compra tiempo, que es para ' +
    'lo que está, no te devuelve la puntualidad. Lo que ya ganaste no se toca nunca, y el crédito ' +
    'siguiente arranca otra vez en el ' + pct(r.garantia.factor_puntual) + '.</div>');
  h += bloque('Y crece dando tus datos', r.cupon.texto);
  h += bloque('Y crece trayendo gente', r.referidos.texto);
  if (r.respaldado) h += bloque('El préstamo con garantía', r.respaldado.texto);

  /* 5-ago-2026 — LOS NIVELES SIGUEN, PERO YA NO DAN CUPO.
     Este bloque decía "cuánto puedes pedir es tu garantía multiplicada por el
     factor de tu nivel" y pintaba un "×2" al lado de cada nivel. Las dos cosas
     se derogaron: el factor ni existe (leerlo daba `undefined`) y el cupo es la
     garantía uno a uno. Los niveles se quedan porque Joan lo decidió, y lo que
     de verdad dan se dice sin adornos: PRÓRROGAS, o sea cuántas veces se puede
     aplazar un corte. La frase que separa las dos ideas —reconocimiento sí,
     cupo no— la trae el motor en `niveles_texto`, para que ninguna pantalla la
     tenga que inventar y volver a insinuar lo que no es. */
  h += '<div class="card"><div class="etq">Los niveles</div>' +
    '<p class="sub">' + esc(r.niveles_texto) + '</p>' +
    '<div style="margin-top:var(--e2)">' + r.niveles.map(function (n) {
      return '<div class="nivel ' + (n.nivel === S.nivel ? 'aqui' : '') + '">' +
        '<span class="txt"><span class="nm">' + n.nivel + (n.nivel === S.nivel ? ' · aquí estás' : '') + '</span>' +
        '<span class="rq">' + requisitoTexto(n) + '</span></span>' +
        '<span class="cp">' + prorrogasTexto(n.prorrogas) + '</span></div>';
    }).join('') + '</div>' +
    '<div class="muted" style="font-size:13px;margin-top:var(--e3)">' + esc(r.tope.texto) + '</div></div>';

  h += '<div class="card"><div class="etq">Si te atrasas</div>' +
    '<p style="margin:var(--e2) 0 0;font-size:14.5px">' + esc(r.mora.texto) + '</p>' +
    /* La prórroga se decide acá, así que acá se dice lo único que no se ve en
       su precio: mueve la fecha, no limpia el historial del crédito (§4-bis). */
    '<div class="aviso" style="margin-top:var(--e3)">' + esc(r.prorroga.texto) +
    ' Lo que la prórroga <b>no</b> hace es borrar el atraso: si el crédito ya se atrasó, sigue ' +
    'sumando el ' + pct(r.garantia.factor_mora) + ' de garantía hasta que lo termines, aunque ' +
    'pagues puntual la fecha nueva.</div></div>';

  /* Va pegado al de arriba a propósito: el texto del motor nombra el plan y su
     5%, y el precio completo tiene que leerse en el mismo tirón, no dos
     pantallas más allá. */
  h += bloquePlanDePagos();

  h += '<button class="btn sec" style="margin-top:var(--e3)" onclick="irA(\'inicio\')">Volver</button>';
  $('cuerpo').innerHTML = '<div class="panel">' + h + '</div>';
  window.scrollTo(0, 0);
}

/* Cuánto le falta para el siguiente nivel, en porcentaje y en palabras. */
function siguienteNivel() {
  var orden = M.NIVELES, i = orden.indexOf(S.nivel);
  if (i < 0 || i >= orden.length - 1) return null;
  var sig = orden[i + 1], r = M.REQUISITOS_NIVEL[sig];
  var faltanPagos = Math.max(0, r.pagos_a_tiempo - Number(S.g.pagados_a_tiempo || 0));
  var faltanRacha = Math.max(0, r.racha - Number(S.g.racha || 0));
  return { nivel: sig, pagos: faltanPagos, racha: faltanRacha,
           meses: Math.max(0, r.meses_sin_mora - Number(S.g.meses_sin_mora || 0)) };
}
function progresoNivel() {
  var s = siguienteNivel();
  if (!s) return 100;
  var r = M.REQUISITOS_NIVEL[s.nivel];
  var meta = Math.max(1, r.pagos_a_tiempo);
  return Math.max(6, Math.min(100, Number(S.g.pagados_a_tiempo || 0) / meta * 100));
}
/* 5-ago-2026 — ESTA LÍNEA PROMETÍA UN CUPO QUE EL NIVEL YA NO DA.
   Decía "pasas a plata, y tu cupo sube a $308.000", y en el nivel más alto leía
   `M.FACTOR_CUPO[S.nivel]`, que desde el cambio de reglas no existe: la frase
   salía "Tu cupo es undefined veces tu garantía". Las dos cosas se caen por lo
   mismo — el cupo es la garantía uno a uno y subir de nivel no abre un peso.
   Lo que el nivel sí da son PRÓRROGAS, y eso es lo que se dice. El cupo tiene su
   propia frase, la del 15%, y no se mezcla con esta: mezclarlas es exactamente
   como volvió a colarse la promesa vieja las tres veces anteriores. */
function textoProximoNivel() {
  var s = siguienteNivel();
  var prorrogasDe = function (nivel) {
    return Math.min(M.PRORROGAS_POR_NIVEL[nivel], M.TOPE_DURO_PRORROGAS);
  };
  if (!s) {
    return 'Estás en el nivel más alto: puedes aplazar hasta ' +
      vecesTexto(prorrogasDe(S.nivel)) + ' por crédito. Tu cupo no depende del nivel, ' +
      'depende de tu garantía.';
  }
  var partes = [];
  if (s.pagos) partes.push(s.pagos + ' pago' + (s.pagos !== 1 ? 's' : '') + ' más');
  if (s.racha) partes.push('racha de ' + M.REQUISITOS_NIVEL[s.nivel].racha);
  if (s.meses) partes.push(s.meses + ' mes' + (s.meses !== 1 ? 'es' : '') + ' sin atrasarte');
  var hoy = prorrogasDe(S.nivel), luego = prorrogasDe(s.nivel);
  /* Sin nada pendiente la frase decía "Con ya casi pasas a plata", que no es
     castellano. Cuando ya cumple, se dice eso y no se le inventa un requisito. */
  return (partes.length
    ? 'Con ' + partes.join(' y ') + ' pasas a <b>' + s.nivel + '</b>'
    : 'Ya cumples lo que pide <b>' + s.nivel + '</b>') +
    (luego > hoy
      ? ', y podrás aplazar hasta ' + vecesTexto(luego) + ' por crédito.'
      /* Del nivel siguiente que no cambia las prórrogas no se puede decir nada
         material, así que se dice eso mismo en vez de inventarle un premio: es
         reconocimiento, y el cupo va por otro lado. */
      : ', el reconocimiento del historial que llevas. El cupo lo sube pagar en fecha, no ' +
        'subir de nivel.');
}

/* ============ QUÉ CICLO SE ESTÁ COBRANDO, Y A QUÉ PRECIO ============
   4-ago-2026. Un crédito no siempre está en su quincena: cuando al socio se le
   acaban las prórrogas pasa a un PLAN DE PAGOS, y ahí lo que se cobra es otra
   cosa — la cuota, no el capital entero, y al 5% del saldo, no al 20%.

   La app pintaba las tres cifras mezcladas: el capital entero, el costo de la
   cuota y la etiqueta "(20%)". A un socio con 600.000 en plan le mostraba
   "Capital $600.000 · Costo (20%) $30.000 · Recargo $60.000" cuando el Panel le
   cobraba 250.000. Tres números, ninguno del mismo ciclo.

   De acá salen la etiqueta, el porcentaje y el número de cuota, y de una sola
   pregunta: `plan_cuotas`, que el paquete ya trae. Ninguna pantalla vuelve a
   decidirlo por su cuenta. */
function cicloDelCredito(c) {
  var total = Math.max(0, Math.round(Number(c && c.plan_cuotas) || 0));
  var pagas = Math.max(0, Math.round(Number(c && c.plan_cuotas_pagadas) || 0));
  var enPlan = total > 0;
  var n = enPlan ? Math.min(total, pagas + 1) : 0;
  return {
    en_plan: enPlan,
    numero: n,
    cuotas: total,
    /* El porcentaje del producto que DE VERDAD rige. Si el paquete trae la tasa
       de este ciclo, manda esa: lo que ya viene dicho no se adivina. Si no
       viene, sale del motor —5% en plan, 20% en la quincena—, nunca escrita a
       mano acá. Y se normaliza: el Panel guarda el costo como `costoPct` (20),
       el motor lo maneja en decimal (0,20), y un 20 leído como decimal pintaría
       "2000%". Por debajo de 1 es decimal, por encima es porcentaje: entre 0,05
       y 5 no hay ambigüedad posible. */
    tasa: tasaDecimal((c && c.tasa != null) ? c.tasa
        : (enPlan ? M.TASA_PLAN_DE_PAGOS : M.TASA_CREDITO)),
    etiqueta_capital: enPlan ? 'Capital de la cuota ' + n + ' de ' + total : 'Capital',
    nombre: enPlan ? 'la cuota ' + n + ' de ' + total + ' de tu plan de pagos'
                   : 'tu crédito quincenal'
  };
}

/* Un porcentaje puede llegar en decimal (0,20, como lo maneja el motor) o en
   entero (20, como lo guarda el Panel en `costoPct`). Entre 0,05 y 20 no hay
   ambigüedad: por debajo de 1 es decimal, por encima es porcentaje. Si llega
   basura manda el 20% del quincenal, que es el precio más alto de los dos:
   equivocarse hacia abajo sería prometerle al socio algo más barato de lo que
   va a pagar, y eso es justo lo que esta ronda vino a cerrar. */
function tasaDecimal(t) {
  var n = Number(t);
  if (!isFinite(n) || n <= 0) return M.TASA_CREDITO;
  return n > 1 ? n / 100 : n;
}

/* ============ LA CUENTA DEL CRÉDITO: LA TRAE HECHA EL PUENTE ============
   5-ago-2026 — LA APP DECÍA "$1" DE UN CRÉDITO QUE EL PANEL COBRABA EN 80.001.

   Esta función liquidaba el crédito ella misma: le pasaba al motor `capital` y
   `costo` sueltos y dejaba que el 1% diario se recalculara desde cero sobre el
   capital que quedaba HOY. Con un abono de por medio eso borra hacia atrás los
   días que ya corrieron sobre el capital que HABÍA: 200.000 a 20 días con
   199.999 abonados daban 1 peso de total, mientras el Panel le cobraba 80.001.
   Y la cifra que ve el socio es la que él cree: si no es la que le cobran, Joan
   pierde la razón aunque la tenga.

   La cuenta ya está hecha, una sola vez y en un solo sitio: PUENTE.liquidarCiclo,
   la MISMA que canta el Panel. Viaja en el paquete y acá se muestra tal cual:

     capital · costo · mora · dias_mora · total_hoy   liquidado HOY
     causado {costo, mora, dias}                      lo ya corrido, congelado

   PARA OTRA FECHA la rehace el MOTOR —el recordatorio del calendario liquida en
   el corte, no hoy—, y arranca de lo ya causado (recargoPorMoraDesde) para no
   volver a caer en lo mismo. Lo causado solo se arrastra hacia ADELANTE: en el
   corte todavía no había ocurrido, así que ahí no se suma.

   El mismo camino cubre el paquete VIEJO que llega por el enlace de WhatsApp y
   se abre días después: sus cifras son las de aquel día, y el motor le corre el
   1% de los días que pasaron desde entonces, sin recalcular lo de antes.

   No puede lanzar: liquidarCredito exige capital > 0, y un crédito con el
   capital ya abonado —que sigue debiendo costo y recargo— no puede dejar al
   socio sin ver su cuenta. */
function liquidacion(c, fecha) {
  var hoy = hoyISO();
  var cuando = fecha || hoy;
  var capital = Math.max(0, Number(c && c.capital) || 0);
  var costo = Math.max(0, Number(c && c.costo) || 0);
  var corte = (c && /^\d{4}-\d{2}-\d{2}/.test(String(c.corte || ''))) ? String(c.corte).slice(0, 10) : null;
  var dias = corte ? Math.max(0, M.diasDeMora(corte, cuando)) : 0;

  /* Lo que el puente ya liquidó. Un paquete sin `causado` es de antes de esta
     ronda (o el ejemplo de la pantalla de entrada): se sigue de largo y la
     cuenta la hace el motor, como siempre. */
  var cs = (c && c.causado) || null;
  var moraCausada = cs ? Math.max(0, Number(cs.mora) || 0) : 0;
  var diasCausados = cs ? Math.max(0, Number(cs.dias) || 0) : 0;

  /* 5-ago-2026 §4-bis — EL FACTOR COMPLETO ES DEL CRÉDITO QUE NUNCA SE ATRASÓ, y
     este lado tampoco lo adivina: el puente ya se lo manda hecho en el paquete
     (`migrarSocio(...).creditos[].estuvo_en_mora`), que es el mismo dato que
     lee el Panel. Sin leerlo, las tres salidas de acá daban el factor completo
     siempre, y el crédito que venía de una mora prorrogada veía en su celular el
     DOBLE de lo que el Panel le iba a acreditar. El doble, y del lado optimista,
     que es el que produce el reclamo.
     Los porcentajes ya no se nombran acá: el reparto pasó de 90/45 a 75/37,5 el
     5-ago-2026 y este comentario habría quedado mintiendo igual que el resto. */
  var vieneDeMora = !!(c && c.estuvo_en_mora);
  /* Lo que acredita el pago que se está liquidando, y lo que acreditaría uno
     puntual. Con mora en la historia, ni pagando hoy en fecha vuelve el factor
     completo: el techo honesto es la mitad. */
  var acreditaSi = function (enFecha) {
    return M.cuentaComoPuntualParaGarantia({
      pagado_en_fecha: enFecha, credito_estuvo_en_mora: vieneDeMora });
  };
  /* Lo que sumaría pagando TARDE, en pesos. Va en pesos y no como "la mitad"
     porque las dos cifras son dos constantes distintas del motor y ya cambiaron
     una vez: FACTOR_GARANTIA y FACTOR_GARANTIA_MORA hoy son 0,75 y 0,375, o sea
     mitad y doble exactos, pero eso es una coincidencia de dos números, no una
     regla. Diciéndolo en pesos la frase no puede quedar prometiendo una relación
     que dejó de existir. */
  var garantiaSiTarde = function (costoBase) { return M.acumularGarantia(costoBase, false); };

  /* HOY, y con el paquete al día: se muestra lo que trae, sin tocarlo. Es la
     única forma de que la app y el Panel no puedan decir dos cifras. */
  if (cs && cuando === hoy && dias === diasCausados && c.total_hoy != null) {
    return { capital: capital, costo: costo,
             recargo_mora: moraCausada,
             dias_mora: diasCausados,
             pago_a_tiempo: diasCausados === 0,
             acredita_en_fecha: acreditaSi(diasCausados === 0),
             costo_total_pagado: costo + moraCausada,
             total_a_pagar: Math.max(0, Number(c.total_hoy) || 0),
             garantia_generada: M.acumularGarantia(costo + moraCausada, acreditaSi(diasCausados === 0)),
             garantia_si_puntual: M.acumularGarantia(costo, acreditaSi(true)),
             garantia_si_tarde: garantiaSiTarde(costo),
             credito_estuvo_en_mora: vieneDeMora };
  }

  /* Otra fecha (o un paquete viejo): lo causado se arrastra solo hacia
     adelante. Liquidar en el corte no puede llevar el recargo de una mora que
     ese día todavía no había ocurrido. */
  var opciones = (cs && dias >= diasCausados)
    ? { recargoCausado: moraCausada, diasCausados: diasCausados } : {};
  if (capital > 0 && corte) {
    try {
      /* `estuvo_en_mora` viaja DENTRO del crédito: es de donde el motor lo lee
         (§4-bis). Sin él, el motor asume el crédito recién desembolsado y
         devuelve el factor completo. */
      var liq = M.liquidarCredito({ capital: capital, costo: costo, fecha_corte: corte,
                                    estuvo_en_mora: vieneDeMora }, cuando, opciones);
      liq.credito_estuvo_en_mora = vieneDeMora;
      liq.garantia_si_tarde = garantiaSiTarde(liq.costo);
      return liq;
    } catch (e) {}
  }
  /* Sin capital vigente —todo abonado— o sin corte. El recargo lo sigue dando
     el motor; lo único que queda acá es juntar las tres partes que la pantalla
     muestra línea por línea, que es exactamente lo que suma el total. */
  var recargo = opciones.recargoCausado != null
    ? M.recargoPorMoraDesde(opciones.recargoCausado, opciones.diasCausados, capital, dias)
    : M.recargoPorMora(capital, dias);
  return { capital: capital, costo: costo, recargo_mora: recargo, dias_mora: dias,
           pago_a_tiempo: dias === 0,
           acredita_en_fecha: acreditaSi(dias === 0),
           costo_total_pagado: costo + recargo,
           total_a_pagar: capital + costo + recargo,
           garantia_generada: M.acumularGarantia(costo + recargo, acreditaSi(dias === 0)),
           garantia_si_puntual: M.acumularGarantia(costo, acreditaSi(true)),
           garantia_si_tarde: garantiaSiTarde(costo),
           credito_estuvo_en_mora: vieneDeMora };
}

function tarjetaActivo(c) {
  var ciclo = cicloDelCredito(c);
  var q = liquidacion(c);            // capital, costo, recargo y total: del puente
  /* Los días del atraso son los MISMOS que causaron el recargo: salen de la
     liquidación, no de una segunda cuenta hecha acá. La píldora y la línea del
     recargo no pueden decir dos números de días. `faltan` es lo contrario —los
     que quedan hasta el corte— y por eso sí se mide aparte: no es mora. */
  var enMora = q.dias_mora > 0;
  /* Un crédito sin fecha de corte no puede dejar al socio sin ver su cuenta:
     diasDeMora lanza con una fecha vacía y esto se pinta antes que nada. */
  var faltan = /^\d{4}-\d{2}-\d{2}/.test(String(c.corte || ''))
    ? M.diasDeMora(String(c.corte).slice(0, 10), hoyISO()) : 0;
  var h = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center">' +
    '<div class="etq">' + (ciclo.en_plan ? 'Tu plan de pagos · cuota ' + ciclo.numero + ' de ' + ciclo.cuotas
                                         : 'Tu crédito de ahora') + '</div>' +
    '<span class="pill ' + (enMora ? 'ambar' : '') + '">' +
    (enMora ? q.dias_mora + ' día' + (q.dias_mora !== 1 ? 's' : '') + ' de atraso' :
     (faltan === 0 ? 'Vence hoy' : 'Faltan ' + Math.abs(faltan) + ' días')) + '</span></div>';

  if (enMora) {
    /* Acá NO va cifra grande. La que manda en esta pantalla es la de arriba,
       que ya trae el recargo; esta tarjeta es el desglose de esa misma cifra,
       para que el socio pueda seguir la cuenta línea por línea y llegue al
       mismo total. El total se repite al pie, en el peso de una fila y sin
       color propio: explica, no compite. */
    h += '<div class="muted" style="font-size:13px;margin-top:var(--e2)">' +
      'De qué está hecho lo que tienes que pagar hoy:</div>' +
      fila(ciclo.etiqueta_capital, COP(q.capital)) +
      fila('Costo (' + pct(ciclo.tasa) + ')', COP(q.costo)) +
      fila('Recargo por los ' + q.dias_mora + ' días', COP(q.recargo_mora)) +
      '<div class="fila"><span class="k">Total para saldar hoy</span>' +
        '<span class="v"><b>' + esc(COP(q.total_a_pagar)) + '</b></span></div>' +
      '<div class="aviso ambar"><b>Aunque te atrases, sigues siendo socio.</b><br>' +
      'No bajas de nivel, no pierdes garantía y puedes volver a pedir. Paga lo que puedas ' +
      'cuando puedas: todo lo que pagues sigue sumando a tu cupo.</div>';
  } else {
    h += '<div class="cifra sm">' + COP(q.total_a_pagar) + '</div>' +
      '<div class="muted" style="font-size:13px">Total para saldar</div>' +
      fila(ciclo.etiqueta_capital, COP(q.capital)) +
      fila('Costo (' + pct(ciclo.tasa) + ')', COP(q.costo)) +
      fila('Fecha de pago', fmtFecha(c.corte)) +
      /* 5-ago-2026 §4-bis — acá decía "si pagas en fecha, sumas el doble", y
         para el crédito que ya se atrasó una vez eso dejó de ser verdad: ese
         suma la mitad aunque el corte nuevo se pague puntual. La cifra ya la
         trae bien la liquidación; lo que faltaba era que la frase dijera lo mismo
         que la cifra. Se dice de frente, sin letra chica: la puntualidad se
         premia desde el primer día, y una prórroga compra tiempo, no borra el
         atraso que ya hubo.
         Y las dos ramas dicen los pesos de las DOS opciones, no "el doble": los
         factores son dos constantes que ya cambiaron una vez (90/45 → 75/37,5) y
         la relación entre ellas no es una regla del acuerdo. */
      (q.credito_estuvo_en_mora
        ? '<div class="aviso ambar"><b>Este crédito ya se atrasó una vez, y eso no se borra.</b><br>' +
          'Pagando el ' + fmtFecha(c.corte) + ' o antes, tu cupo sube ' + COP(q.garantia_si_puntual) +
          ': lo que suma un crédito que ya se atrasó, no lo que sumaría uno que nunca se atrasó. ' +
          'La prórroga te compró tiempo, no la puntualidad. Págalo en fecha igual —te lo quitas de ' +
          'encima— y el siguiente, si no se atrasa nunca, ya te vuelve a sumar completo.</div>'
        : '<div class="aviso"><b>La puntualidad se premia desde el primer día.</b><br>' +
          'Pagando el ' + fmtFecha(c.corte) + ' o antes, tu cupo sube ' + COP(q.garantia_si_puntual) +
          '. Pagando tarde sube ' + COP(q.garantia_si_tarde) + ', que también suma. Y si te atrasas ' +
          'una vez, este crédito sigue sumando lo de pagar tarde hasta que lo termines: aplazarlo ' +
          'no lo vuelve a poner en cero.</div>');
  }
  if (ciclo.en_plan) {
    /* La cuota NO es la deuda: el saldo del crédito entero viene aparte en el
       paquete y se dice, para que nadie crea que con esta cuota terminó. */
    h += (c.saldo_capital != null ? fila('Te falta del crédito', COP(c.saldo_capital)) : '') +
      '<div class="aviso info">Esta es la cuota ' + ciclo.numero + ' de ' + ciclo.cuotas +
      ' de tu plan. Cada cuota cuesta el ' + pct(ciclo.tasa) +
      ' de lo que quede debiendo, así que las de más adelante cuestan menos. ' +
      'La entrada del plan ya la pagaste el día que lo pactamos.</div>';
  }
  if (c.prorrogas) h += fila('Prórrogas usadas', String(c.prorrogas));
  h += '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="recordarme()">Que mi celular me lo recuerde</button>' +
       '<div class="muted" id="recordarPie" style="font-size:12px;margin-top:var(--e2);text-align:center">' +
       /* El corte ya pasado no admite un "dos días antes": el recordatorio que
          se arma es de hoy, y acá se dice lo mismo que va a hacer. */
       (enMora ? 'Te lo pone en el calendario de hoy, con el total de hoy.'
               : 'Te avisa dos días antes y el mismo día, aunque no tengas la app abierta.') + '</div>';
  return h + '</div>';
}

/* El préstamo con garantía que tiene abierto: cuánto le falta y cuándo. */
function tarjetaRespaldadoActivo(r, cuota) {
  var cuotas = r.cuotas || [];
  var pagas = cuotas.filter(function (c) { return c.pagado; }).length;
  return '<div class="card respaldo">' +
    '<div class="etq r">Tu préstamo con garantía</div>' +
    '<div class="cifra sm">' + COP(cuota ? cuota.total : 0) + '</div>' +
    '<div class="muted" style="font-size:13px">' +
      (cuota ? 'cuota ' + cuota.n + ' de ' + (cuotas.length || r.plazo_meses) + ', el ' + fmtFecha(cuota.fecha)
             : 'ya lo terminaste') + '</div>' +
    fila('Llevas pagadas', pagas + ' de ' + (cuotas.length || r.plazo_meses)) +
    fila('Te falta de capital', COP(r.saldo_capital)) +
    '<div class="aviso info">Esos ' + COP(r.saldo_capital) + ' de tu garantía están comprometidos ' +
    'mientras lo pagas. Se sueltan solos, cuota a cuota.</div>' +
    '</div>';
}

/* ========================= CALCULADORA =========================
   Dos productos en un solo lugar. Sale el quincenal, que es el de todos los
   días; el de garantía está al lado, a un toque, y solo se puede tocar si ya
   se ganó garantía pagando. Todas las cuentas salen del motor. */
function vistaCalculadora() {
  var l = limitesCalc();
  return '<div class="card">' +
    '<div class="seg" id="calcSeg" role="tablist" aria-label="Qué quieres pedir" onkeydown="segTeclas(event)">' +
      botonSeg('quincenal', 'q', 'Crédito quincenal', pct(M.TASA_CREDITO) + ' · hasta el corte') +
      botonSeg('respaldado', 'r', 'Préstamo con garantía',
               pct(M.TASA_RESPALDADO_MENSUAL) + ' al mes · ' + M.PLAZO_RESPALDADO_MIN + ' a ' +
               M.PLAZO_RESPALDADO_MAX + ' meses') +
    '</div>' +
    '<h3 class="tit">¿Cuánto necesitas?</h3>' +
    '<p class="sub" id="calcSub"></p>' +
    /* Va en .sm a propósito: es el número que el socio MUEVE, no el que manda.
       La cifra grande de esta pantalla es una sola, la de abajo: lo que va a
       pagar. Dos cifras de 34px en el mismo pantallazo no hacen jerarquía,
       hacen empate. */
    '<div class="cifra sm" id="calcMonto">' + COP(MONTO) + '</div>' +
    '<div class="muted" id="calcAviso" style="font-size:13px;min-height:var(--e4)"></div>' +
    '<input type="range" id="calcRange" min="' + l.min + '" max="' + Math.max(l.min, l.max) +
      '" step="1" value="' + MONTO + '" ' +
      'oninput="setMonto(this.value)" aria-label="Cuánto quieres pedir">' +
    '<div class="chips" id="calcChips"></div>' +
    '<div id="calcPlazo"></div>' +
    '</div>' +
    '<div id="calcSalida"></div>' +
    '<div id="calcComparar"></div>';
}
function botonSeg(modo, cls, titulo, sub) {
  return '<button type="button" role="tab" aria-selected="false" class="' + cls + '" data-modo="' + modo + '" ' +
    'onclick="setModo(\'' + modo + '\')"><b>' + esc(titulo) + '</b><i>' + esc(sub) + '</i></button>';
}
function segTeclas(e) {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  e.preventDefault();
  setModo(e.key === 'ArrowRight' ? 'respaldado' : 'quincenal');
  var b = $('calcSeg').querySelector('button.on');
  if (b) b.focus();
}

/* 3-ago-2026, pedido de Joan: los dos productos arrancan en 50.000 y la calculadora
   no pasa de 5 millones. Los dos números salen del motor (M.MONTO_MINIMO y
   M.MONTO_MAXIMO_CALCULADORA), no de acá: antes cada producto tenía el suyo escrito
   a mano y por eso terminaron distintos sin que nadie lo decidiera.

   El techo de 5 millones NO es el techo del negocio —ese sigue en CUPO_MAXIMO, 20
   millones— sino hasta dónde llega lo que el socio se pide solo desde el teléfono.

   El piso cede ante el cupo, y esto no es un detalle: el socio que acaba de entrar
   tiene el cupo POR DEBAJO del mínimo, y desde el 5-ago-2026 más todavía — el cupo
   es la garantía uno a uno, así que con la ficha a medias son 25.000 de cupón y
   25.000 de cupo, donde antes el factor de bronce los inflaba a 37.500. Con el
   multiplicador muerto el caso se volvió más común, no menos.
   Si el piso no cediera, no podría elegir ni un monto que
   le alcance y el aviso le quedaría clavado en "es más que tu cupo" desde el primer
   día. Con el cupo en cero no hay monto válido que ofrecer —el motor ni siquiera
   simula un capital de 0— así que ahí se queda el piso, que al menos dice la verdad. */
/* EL ESCALÓN, 5-ago-2026, pedido de Joan: de 50.000 a 1.000.
   Con el escalón viejo, entre 50.000 y 100.000 no había NADA que elegir: el socio
   que necesitaba 70.000 tenía que pedir 100.000 y pagar el costo de 30.000 de más
   que no necesitaba. Y con el cupo uno a uno el caso se volvió la regla, no la
   excepción: los cupos reales son cifras como 145.000 o 132.250, no múltiplos de
   50.000, así que un escalón grueso deja la mayor parte del recorrido sin usar.

   Mil pesos es el escalón fino que sigue siendo cómodo de leer. Sobre el cupo de un
   socio típico eso son más de cien paradas en los ~335px de una pantalla de celular:
   cada pixel de arrastre son unos cientos de pesos, así que se puede afinar de
   verdad. No se baja a 1 peso a propósito: un monto como "137.412" no lo piensa
   nadie, y ver esa cifra en pantalla parece un error del sistema, no una elección. */
var ESCALON_MONTO = 1000;

function limitesCalc() {
  var piso = M.MONTO_MINIMO;
  var techo = M.MONTO_MAXIMO_CALCULADORA;
  if (MODO === 'respaldado') {
    var max = Math.min(Math.max(0, Math.floor(S.maxRespaldado)), techo);
    return { min: Math.min(piso, max), max: max, paso: ESCALON_MONTO };
  }
  /* El tope sube a 500.000 aunque el cupo sea menor, a propósito: que el socio vea
     que el producto llega más lejos y cuánto le falta, en vez de esconderle el
     recorrido. Pero nunca por encima del techo de la calculadora. */
  var cupo = Math.max(0, Math.floor(S.cupo || 0));
  return { min: cupo > 0 ? Math.min(piso, cupo) : piso,
           max: Math.min(Math.max(cupo, 500000), techo), paso: ESCALON_MONTO };
}

function setModo(m) {
  if (m !== 'quincenal' && m !== 'respaldado') return;
  if (m === 'respaldado' && S.maxRespaldado <= 0) {
    var a = $('calcAviso');
    /* §4-bis: el factor completo es del crédito que nunca se atrasó, así que la
       frase que lo promete tiene que decir a cambio de qué. Los dos porcentajes
       salen de las constantes (hoy 75% y 37,5%), nunca escritos acá. */
    if (a) a.innerHTML = 'Todavía no tienes garantía ganada. Se gana pagando en fecha: cada crédito ' +
      'quincenal que pagas sin haberte atrasado te deja el ' + pct(M.FACTOR_GARANTIA) +
      ' del costo. Si se atrasó alguna vez, el ' + pct(M.FACTOR_GARANTIA_MORA) + '.';
    return;
  }
  /* Tiene garantía ganada, pero no le llega al mínimo. Es un estado NORMAL y va a
     durar varias quincenas: con el reparto nuevo la ganada sube el 75% del costo,
     así que un socio que pide 100.000 suma 15.000 por crédito y tarda cuatro en
     llegar a los 50.000. Sin este corte, la barra queda de un solo punto —min y max
     pegados en la ganada— y el socio ve un control muerto sin entender por qué.
     Se le dice cuánto le falta, que es lo único útil que se le puede decir. */
  if (m === 'respaldado' && S.maxRespaldado < M.MONTO_MINIMO) {
    var av = $('calcAviso');
    if (av) av.innerHTML = 'Llevas <b>' + COP(S.maxRespaldado) + '</b> de garantía ganada, y este ' +
      'préstamo arranca en ' + COP(M.MONTO_MINIMO) + '. Te faltan <b>' +
      COP(M.MONTO_MINIMO - S.maxRespaldado) + '</b>, que se juntan pagando en fecha: cada crédito ' +
      'quincenal te deja el ' + pct(M.FACTOR_GARANTIA) + ' de su costo.';
    return;
  }
  if (m === MODO) return;
  MODO = m;
  var l = limitesCalc();
  MONTO = Math.max(l.min, Math.min(MONTO, l.max));
  sincronizarCalc();
}
function setPlazo(n) { PLAZO = Math.max(M.PLAZO_RESPALDADO_MIN, Math.min(Number(n) || 3, M.PLAZO_RESPALDADO_MAX)); sincronizarCalc(); }
/* Desde la pantalla de garantía: cae en la calculadora ya en el modo azul. */
function irACalcRespaldado() {
  if (S.maxRespaldado <= 0) return irA('calc');
  MODO = 'respaldado';
  MONTO = Math.min(MONTO, S.maxRespaldado);
  irA('calc');
}

/* Redondea al escalón sin perder los extremos.

   4-ago-2026. Un <input type=range> solo acepta valores de la forma min + n·step, y
   los cupos reales no caen en esa grilla: con mínimo 50.000 y escalón 50.000, un cupo
   de 1.272.000 no existe, así que la barra llegaba al tope y se quedaba en 1.250.000
   mientras el aviso de abajo decía "dentro de tu cupo de $1.272.000". Peor con un
   socio nuevo de cupo 37.500: tocaba el atajo de "$50k", el número decía $50.000 y el
   pulgar se iba al extremo izquierdo, porque 50.000 tampoco caía en la grilla.

   Se arregla dejando el <input> con escalón de 1 —así los dos extremos siempre
   existen— y redondeando acá, que además deja pasar el mínimo y el máximo exactos. */
function alEscalon(v, l) {
  if (v <= l.min) return l.min;
  if (v >= l.max) return l.max;
  /* La grilla se ancla en CERO, no en el mínimo. Anclada en el mínimo, a un socio
     nuevo con cupo de 37.500 le quedaban parando en 87.500 y 137.500: tocaba el
     atajo de "$100k" y el monto se iba a 87.500. Anclada en cero, los montos
     redondos —que son los que la gente piensa y los que dicen los atajos— siempre
     existen, y el mínimo y el máximo exactos siguen pasando por los dos ifs. */
  var n = Math.round(v / l.paso) * l.paso;
  return Math.max(l.min, Math.min(n, l.max));
}

function setMonto(v, saltar) {
  var l = limitesCalc();
  var techo = MODO === 'respaldado' ? l.max : M.CUPO_MAXIMO;
  MONTO = Math.max(l.min, Math.min(alEscalon(Number(v) || 0, l), techo));
  var r = $('calcRange');
  if (r) {
    if (saltar && MONTO > Number(r.max)) r.max = MONTO;
    r.value = Math.min(MONTO, Number(r.max));
  }
  sincronizarCalc();
}

function bloquePlazo() {
  var h = '<span class="etq suelta">¿En cuántos meses?</span><div class="chips">';
  for (var n = M.PLAZO_RESPALDADO_MIN; n <= M.PLAZO_RESPALDADO_MAX; n++) {
    h += '<button class="chip pz' + (n === PLAZO ? ' on azul' : '') + '" onclick="setPlazo(' + n + ')">' + n + '</button>';
  }
  return h + '</div><div class="muted" style="font-size:13px;margin-top:var(--e2)">' +
    'Una cuota por mes, siempre en una fecha de corte.</div>';
}

function sincronizarCalc() {
  var resp = MODO === 'respaldado', l = limitesCalc();
  MONTO = Math.max(l.min, Math.min(MONTO, resp ? l.max : M.CUPO_MAXIMO));

  var bs = $('calcSeg').querySelectorAll('button');
  for (var i = 0; i < bs.length; i++) {
    var esEste = bs[i].getAttribute('data-modo') === MODO;
    bs[i].classList.toggle('on', esEste);
    bs[i].setAttribute('aria-selected', esEste ? 'true' : 'false');
    if (bs[i].getAttribute('data-modo') === 'respaldado' && S.maxRespaldado <= 0) {
      bs[i].setAttribute('aria-disabled', 'true');
    }
  }

  $('calcMonto').textContent = COP(MONTO);
  $('calcSub').textContent = resp
    ? pct(M.TASA_RESPALDADO_MENSUAL) + ' al mes sobre lo que pidas. Lo respalda la garantía que ya te ganaste.'
    : 'El costo es el ' + pct(M.TASA_CREDITO) + ' de lo que pidas, por quincena.';

  var r = $('calcRange');
  /* step=1 a propósito: el redondeo al escalón lo hace alEscalon(), que además deja
     pasar el mínimo y el máximo exactos. Ver el comentario de setMonto. */
  r.min = l.min; r.max = Math.max(l.min, l.max, resp ? 0 : MONTO); r.step = 1;
  r.value = Math.min(MONTO, Number(r.max));
  r.classList.toggle('azul', resp);

  var chips;
  if (resp) {
    chips = [0.25, 0.5, 1].map(function (f) {
      return Math.max(l.min, Math.round(S.maxRespaldado * f / 10000) * 10000);
    });
  } else {
    var tope = Math.max(S.cupo, 500000);
    chips = [50000, 100000, 300000, 500000, 1000000]
      .filter(function (v, i) { return i < 3 || v <= tope * 2; })
      .filter(function (v) { return v >= l.min && v <= l.max; });
    /* Si el cupo no llega ni al primer atajo, el cupo entra de primero: tiene
       que haber al menos un botón que el socio pueda tocar y le alcance. */
    if (!chips.length || l.min < chips[0]) chips.unshift(l.min);
  }
  chips = chips.filter(function (v, i, a) { return v > 0 && a.indexOf(v) === i; });
  $('calcChips').innerHTML = chips.map(function (v) {
    return '<button class="chip' + (v === MONTO ? (resp ? ' on azul' : ' on') : '') +
      '" onclick="setMonto(' + v + ',true)">' + COPc(v) + '</button>';
  }).join('');

  $('calcPlazo').innerHTML = resp ? bloquePlazo() : '';

  if (resp) {
    var sr = M.simularPrestamoRespaldado(Math.max(1, MONTO), PLAZO, entradaMotor(),
      { nivelSocio: S.nivel, fechaDesembolso: hoyISO() });
    $('calcAviso').innerHTML = sr.dentro_del_respaldo
      ? 'Puedes pedir hasta ' + COP(sr.respaldo_disponible) + ': es la garantía que te ganaste pagando.'
      : 'Es más que tu garantía ganada de ' + COP(sr.respaldo_disponible) + '.';
    $('calcSalida').innerHTML = salidaRespaldado(sr);
  } else {
    var s = M.simularCredito(MONTO, S.gd.base_cupo, { nivelSocio: S.nivel, fechaDesembolso: hoyISO() });
    $('calcAviso').innerHTML = s.dentro_del_cupo
      ? 'Dentro de tu cupo de ' + COP(s.cupo) + '.'
      : 'Es más que tu cupo de ' + COP(s.cupo) + '.';
    $('calcSalida').innerHTML = salidaCalc(s);
  }
  $('calcComparar').innerHTML = piezaComparar();
}

function salidaCalc(s) {
  /* 1 · Lo que pagarías — es la cifra que manda: es lo que va a salir del bolsillo */
  var h = '<div class="card quincenal">' +
    '<div class="etq q">Lo que pagarías</div>' +
    '<div class="cifra">' + COP(s.total_a_pagar) + '</div>' +
    '<div class="muted" style="font-size:13px">el ' + fmtFecha(s.fecha_corte) + ', en un solo pago</div>' +
    fila('Te llevas', COP(s.capital)) +
    fila('Costo (' + pct(s.tasa) + ')', COP(s.costo)) +
    fila('Total a devolver', COP(s.total_a_pagar)) + '</div>';

  /* 2 · Lo que te deja — el premio, ahora es cupo y no descuento */
  h += '<div class="card laca">' +
    '<div class="etq">Y al pagarlo, tu cupo sube</div>' +
    '<div class="cifra sm oro">' + COP(s.cupo_despues) + '</div>' +
    /* 5-ago-2026 — acá decía "porque los $10.000 de costo se te vuelven
       garantía", y eso nunca fue verdad del todo: se vuelve garantía el 75% del
       costo, no el costo entero. Con el reparto viejo la diferencia era del 10%
       y pasaba desapercibida; con el nuevo son 2.500 de cada 10.000, y la línea
       de abajo ("Suma este crédito +7.500") la desmentía dos renglones después.
       Se dice lo que la cifra dice: el 15% de lo que pide, que es la regla del
       producto entera. */
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">' +
      'desde ' + COP(s.cupo) + ': pagarlo en fecha te suma el ' +
      pct(M.reglasResumen().cupo.crecimiento_por_credito) + ' de lo que pidas.</div>' +
    fila(S.gd.comprometida > 0 ? 'Tu garantía libre hoy' : 'Tu garantía hoy', COP(s.garantia_disponible)) +
    fila('Suma este crédito', '+' + COP(s.garantia_que_deja)) +
    fila('Quedarías con', COP(s.garantia_despues)) +
    '</div>';

  /* 3 · Si no le alcanza, cuánto le falta */
  if (!s.dentro_del_cupo) {
    /* Sin el nombre de la marca de sujeto: en una pantalla que habla de la
       garantía del socio, "Tu Garantía lo revisa" se lee "tu saldo lo revisa". */
    h += '<div class="aviso ambar"><b>Te falta ' + COP(s.falta_garantia) + ' de garantía para pedir ' +
      COP(s.capital) + '.</b><br>Puedes pedirlo igual: lo revisamos y te respondemos, ' +
      'o pide hasta ' + COP(s.cupo) + ' que ya tienes disponible.</div>';
  }

  /* 4 · Pedirlo */
  h += tarjetaPedir('Pedir ' + COP(s.capital), '');

  /* 5 · La escalera, plegada: es pedagogía, no decisión */
  /* 6-ago-2026 — LA ESCALERA ARRANCA DONDE ESTÁ EL SOCIO, NO DONDE ESCRIBIÓ.
     Acá iba MONTO, lo que el socio acaba de teclear en la calculadora, que llega
     hasta 5.000.000. Y `pideElCupo` usa ese número como PISO
     (Math.max(capital, cupo)): con un cupo de 200.000 y 5.000.000 tecleados, los
     seis peldaños se dibujaban sobre 5.000.000, o sea seis créditos que hoy no
     puede pedir —y el aviso de dos tarjetas más arriba le acaba de decir que se
     pasó de su cupo. Una escalera que arranca por encima de lo que puede pedir no
     motiva: contradice la pantalla. El primer peldaño es su cupo de hoy, que es
     además lo que promete el texto de al lado ("pidiendo cada vez todo tu cupo").
     El piso de 1 es porque el motor exige capital positivo. */
  var pasos = M.proyectarCrecimiento(S.gd.base_cupo, Math.max(1, s.cupo), 6, S.nivel,
    { pideElCupo: true });
  var minG = S.gd.base_cupo, maxG = pasos[pasos.length - 1].garantia;
  var rango = Math.max(1, maxG - minG);
  h += '<div class="card"><details><summary>Ver cómo crece si lo repites</summary>' +
    '<p class="sub">Pidiendo cada vez todo tu cupo y pagando en fecha: un ' +
      pct(M.reglasResumen().cupo.crecimiento_por_credito) + ' más cada vez.</p>' +
    '<div class="crece">' + pasos.map(function (p) {
      return '<div style="height:' + (18 + (p.garantia - minG) / rango * 82).toFixed(0) + '%">' +
             '<span>' + COPc(p.cupo) + '</span></div>';
    }).join('') + '</div>' +
    '<div class="crece-pie">' + pasos.map(function (p) { return '<span>' + p.credito + '°</span>'; }).join('') + '</div>' +
    '<div class="muted" style="font-size:13px;margin-top:var(--e3)">Al sexto crédito podrías pedir hasta <b>' +
      COP(pasos[pasos.length - 1].cupo) + '</b>.</div>' +
    '</details></div>';

  return h;
}

/* ------- el préstamo con garantía: azul de punta a punta ------- */
function salidaRespaldado(r) {
  /* 1 · La cuota. Es lo único que el socio va a tener que juntar cada mes, así
     que es la cifra que manda. */
  var h = '<div class="card respaldo">' +
    '<div class="etq r">Tu cuota, cada mes</div>' +
    '<div class="cifra">' + COP(r.cuota_tipica) + '</div>' +
    '<div class="muted" style="font-size:13px">Durante ' + r.plazo_meses + ' meses. ' +
      'La última puede variar unos pesos.</div>' +
    fila('Te llevas', COP(r.capital)) +
    fila('Costo (' + pct(r.tasa_mensual) + ' al mes × ' + r.plazo_meses + ')', COP(r.costo_total)) +
    fila('Total a devolver', COP(r.total_a_pagar)) + '</div>';

  /* 2 · Las fechas, que salen del calendario real: ni domingo ni festivo. */
  h += '<div class="card"><h3 class="tit">Las ' + r.plazo_meses + ' fechas</h3>' +
    '<p class="sub">Cada una cae en una fecha de corte, como tu quincena.</p>' +
    r.cuotas.map(function (c, i) {
      return '<div class="fila"><span class="k">' + (i === 0 ? '<span class="pto"></span> ' : '') +
        'Cuota ' + c.numero + ' · ' + fmtFecha(c.fecha_corte) + '</span>' +
        '<span class="v">' + COP(c.total) + '</span></div>';
    }).join('') + '</div>';

  /* 3 · Lo que se compromete mientras lo paga. */
  var cupoMientras = M.calcularCupo(Math.max(0, S.gd.base_cupo - r.capital), S.nivel);
  h += '<div class="card laca"><div class="etq">Mientras lo pagas</div>' +
    '<p style="margin:var(--e2) 0 0;font-size:14px">Estos <b>' + COP(r.garantia_comprometida) +
    '</b> de tu garantía quedan comprometidos: no cuentan para tu cupo quincenal. Se van soltando ' +
    'cada mes, a medida que devuelves capital, y quedan libres del todo cuando terminas.</p>' +
    '<div class="fila"><span class="k">Tu cupo quincenal ahora</span><span class="v oro">' + COP(S.cupo) + '</span></div>' +
    '<div class="fila"><span class="k">Tu cupo mientras lo pagas</span><span class="v oro">' + COP(cupoMientras) + '</span></div>' +
    '<div class="fila"><span class="k">Tu cupo cuando lo termines</span><span class="v oro">' + COP(r.cupo_despues) + '</span></div>' +
    '</div>';

  if (!r.dentro_del_respaldo) {
    h += '<div class="aviso ambar"><b>Todavía no te alcanza la garantía ganada: te faltan ' +
      COP(r.falta_garantia_ganada) + '.</b><br>Este préstamo va uno a uno contra lo que ya te ganaste ' +
      'pagando. Puedes pedir hasta ' + COP(r.respaldo_disponible) + ', o pedirlo igual: ' +
      'lo revisamos y te respondemos.</div>';
  }

  h += tarjetaPedir('Pedir ' + COP(r.capital) + ' a ' + r.plazo_meses + ' meses', 'azul');
  return h;
}

function tarjetaPedir(texto, clase) {
  var puede = M.puedeSolicitar({ nivel_kyc: 1, estado: 'activo', garantia_total: S.garantia, nivel_socio: S.nivel });
  return '<div class="card"><h3 class="tit">¿Te sirve así?</h3>' +
    '<p class="sub">Nos llega por WhatsApp con estos mismos números. ' +
    'No es un compromiso: lo revisamos, te respondemos y ahí decides.</p>' +
    (puede.ok
      ? '<button class="btn ' + clase + ' arriba" onclick="pedirCredito()">' + esc(texto) + '</button>'
      : '<div class="aviso ambar">Para pedir necesitas completar tus datos primero.</div>') +
    '</div>';
}

/* ============ LA COMPARACIÓN: PLATA BARATA O CRECER ============
   El corazón de Tu Garantía. Dos lados enfrentados, cada uno con su color, cada
   uno diciendo su ventaja Y su costo. Las dos frases del final salen del motor
   (compararProductos), nunca escritas a mano: si un día cambia un número,
   cambian solas y no quedan mintiendo.

   LAS DOS CIFRAS GRANDES SON EL MISMO PLAZO. Esto se lee en tres segundos: lo
   que el socio ve son los dos números de arriba y la frase de abajo, y si no
   dicen lo mismo la pieza miente aunque cada dato sea cierto. El quincenal
   vence en el corte, así que para tener la plata los mismos meses hay que
   renovarlo: por eso arriba va lo que cuesta RENOVADO (costo_en_el_plazo), y
   los 20% de una vuelta quedan en el renglón de abajo, donde se explican. Lo
   mismo con la garantía y con el cupo: toda la columna habla del mismo plazo,
   o las barras vuelven a comparar quince días contra seis meses.

   CADA LADO DICE SU COSTO, NO SOLO SU VENTAJA. El del quincenal es que hay que
   renovarlo y sale caro; el del préstamo con garantía es que, mientras lo
   pagás, esa garantía queda comprometida y el cupo quincenal se desploma. Ese
   segundo costo estaba solo en la tarjeta de la calculadora, y la pieza que se
   presenta como la comparación honesta es justo la que el socio mira para
   elegir: si acá no está, la pieza vende un producto.

   Y VA SOBRE LACA. Las dos barras miden GARANTÍA —lo que el socio construye—,
   y la garantía es amarilla; el amarillo solo existe sobre la laca. Sobre papel
   la pieza quedaba con dos barras AZULES, una de ellas colgando del lado rojo,
   y el ojo leía la barra grande como si fuera del producto azul. Por eso el
   ámbar de "no te alcanza" salió del cuadro: el ámbar solo pisa papel, así que
   va abajo, en su propio aviso.

   5-ago-2026 — REVISADA CONTRA LAS REGLAS NUEVAS, y no hubo que tocar una cifra:
   toda la pieza sale de compararProductos y de simularPrestamoRespaldado, así que
   el paso de 90 a 75 y la muerte del factor de nivel la recalcularon sola. Se
   verificó renglón por renglón, que es lo que había que hacer: las seis vueltas
   del quincenal, la garantía de cada lado, los dos cupos "mientras" y "al final",
   y la distancia entre los dos (0,75 contra 0,20 por peso de costo, que en tres
   meses son 45.000 contra 1.500).
   Lo único que se agregó es la frase que ahora hace legibles las dos barras: como
   el cupo es la garantía uno a uno, lo que cada producto le deja de garantía ES
   lo que va a poder pedir de más. Antes esa traducción la hacía un factor que el
   socio no veía, y las barras medían una cosa mientras el cupo decía otra. */
function piezaComparar() {
  var c, r;
  try {
    var ent = entradaMotor(), op = { nivelSocio: S.nivel, fechaDesembolso: hoyISO() };
    c = M.compararProductos(Math.max(1, MONTO), PLAZO, ent, op);
    r = M.simularPrestamoRespaldado(Math.max(1, MONTO), PLAZO, ent, op);
  } catch (e) { return pie(); }

  var q = c.quincenal, rr = c.respaldado, dif = c.diferencias;
  /* Las mismas palabras de los dos lados, salidas del mismo lugar: es lo que
     hace que la cifra de la izquierda y la de la derecha se puedan restar. */
  var enPlazo = rr.plazo_texto;
  var maxG = Math.max(q.garantia_en_el_plazo, rr.garantia_que_deja, 1);
  var ancho = function (v) { return Math.max(2, Math.round(v / maxG * 100)); };
  /* Un solo formato para las dos cifras de arriba: si una se va a lo alto se
     abrevian las dos. Media pantalla no aguanta siete dígitos, y dos formatos
     distintos enfrentados tampoco se comparan de un vistazo. */
  var apretar = Math.max(q.costo_en_el_plazo, rr.costo_total) >= 1000000;
  var grande = function (v) { return apretar ? COPc(v) : COP(v); };
  /* El costo escondido del lado azul: mientras vive el préstamo, ese capital
     queda comprometido y no cuenta para el cupo quincenal. Sale del motor, con
     la misma cuenta que la tarjeta "Mientras lo pagás" de la calculadora. */
  var cupoMientras = M.calcularCupo(Math.max(0, S.gd.base_cupo - c.capital), S.nivel);

  var izq = '<div>' +
    '<div class="etq q">Quincenal</div>' +
    '<div class="cifra sm">' + grande(q.costo_en_el_plazo) + '</div>' +
    '<div class="lin">te cuesta en ' + enPlazo + '</div>' +
    '<div class="rayita"></div>' +
    '<div class="det">' + q.cortes_en_el_plazo + ' cortes de ' + COP(q.costo) + '<br>' +
      'renovándolo cada quincena</div>' +
    '<div class="det">Te deja <b>' + COP(q.garantia_en_el_plazo) + '</b> de garantía' +
      '<div class="barra"><i style="width:' + ancho(q.garantia_en_el_plazo) + '%"></i></div></div>' +
    '<div class="det">Mientras lo pagas tu cupo <b>no baja</b></div>' +
    '<div class="det">Al final tu cupo es <b class="oro">' + COP(q.cupo_en_el_plazo) + '</b></div>' +
    '</div>';

  var der = '<div' + (rr.dentro_del_respaldo ? '' : ' class="flojo"') + '>' +
    '<div class="etq r">Con garantía</div>' +
    '<div class="cifra sm">' + grande(rr.costo_total) + '</div>' +
    '<div class="lin">te cuesta en ' + enPlazo + '</div>' +
    '<div class="rayita"></div>' +
    '<div class="det">' + (c.plazo_meses === 1
      ? '1 cuota de ' + COP(rr.cuota_tipica) + '<br>dentro de un mes'
      : c.plazo_meses + ' cuotas de ' + COP(rr.cuota_tipica) + '<br>una por mes') + '</div>' +
    '<div class="det">Te deja <b>' + COP(rr.garantia_que_deja) + '</b> de garantía' +
      '<div class="barra"><i style="width:' + ancho(rr.garantia_que_deja) + '%"></i></div></div>' +
    '<div class="det">Mientras lo pagas tu cupo baja a <b class="oro">' + COP(cupoMientras) + '</b></div>' +
    '<div class="det">Al final tu cupo es <b class="oro">' + COP(rr.cupo_despues) + '</b></div>' +
    '</div>';

  /* Los "no te alcanza" salen del cuadro: son ámbar, y el ámbar solo vive sobre
     papel. Van juntos, abajo, donde se pueden leer completos. */
  var faltas = [];
  if (!q.dentro_del_cupo) {
    faltas.push('<b>El quincenal es más que tu cupo de hoy</b> (' + COP(S.cupo) + ').');
  }
  if (!rr.dentro_del_respaldo) {
    faltas.push('<b>Para el de garantía te faltan ' + COP(r.falta_garantia_ganada) + '</b> de garantía ganada.');
  }
  var avisoFaltas = faltas.length
    ? '<div class="aviso ambar">' + faltas.join('<br>') +
      ' Puedes pedirlo igual: lo revisamos y te respondemos.</div>'
    : '';

  var barato = dif.cual_es_mas_barato === 'respaldado'
    ? '<b class="r">El de garantía te sale más barato</b>: ' +
      COP(dif.costo_extra_quincenal) + ' menos en ' + enPlazo + '.'
    : (dif.cual_es_mas_barato === 'quincenal'
      ? '<b class="q">El quincenal te sale más barato</b>: ' +
        COP(-dif.costo_extra_quincenal) + ' menos en ' + enPlazo + '.'
      : 'En ' + enPlazo + ' los dos te cuestan lo mismo.');

  var crece;
  if (dif.cual_hace_crecer_mas === 'quincenal') {
    crece = dif.veces_mas_garantia > 1
      ? '<b class="q">El quincenal te hace crecer ' + dif.veces_mas_garantia + ' veces más rápido.</b>'
      : '<b class="q">El quincenal te deja ' + COP(dif.garantia_extra_quincenal) + ' más de garantía.</b>';
  } else if (dif.cual_hace_crecer_mas === 'respaldado') {
    crece = '<b class="r">El de garantía te deja ' + COP(-dif.garantia_extra_quincenal) + ' más de garantía.</b>';
  } else {
    crece = 'Los dos te dejan la misma garantía.';
  }

  return '<h3 class="tit" style="margin-top:var(--e4)">Dos formas de pedir ' + COP(c.capital) + '</h3>' +
    '<p class="sub">Las dos por el mismo tiempo: ' + enPlazo + '. El quincenal vence en cada corte, ' +
    'así que aquí va renovado hasta cubrir ese plazo.</p>' +
    '<div class="card laca pegado">' +
      '<div class="dual">' + izq + der + '</div>' +
      '<div class="remate">' + barato + ' ' + crece +
      ' Tu cupo es tu garantía, así que lo que cada uno te deja es exactamente lo que vas a poder ' +
      'pedir de más. Los dos son buenos: uno cuida la plata de hoy, el otro te sube el cupo de ' +
      'mañana. Eliges tú.</div>' +
    '</div>' + avisoFaltas + pie();
}

/* ================= RECORDATORIO EN SU PROPIO CELULAR ================= */
function textoICS(s) { return String(s).replace(/[\\;,]/g, '\\$&').replace(/\n/g, '\\n'); }
function plegarICS(lineas) {
  var out = [];
  lineas.forEach(function (l) {
    while (l.length > 70) { out.push(l.slice(0, 70)); l = ' ' + l.slice(70); }
    out.push(l);
  });
  return out.join('\r\n');
}
function armarICS(c) {
  /* El recordatorio se liquida EN EL DÍA PARA EL QUE ES, y por eso no lleva el
     recargo de una mora que ese día todavía no habrá ocurrido.

     5-ago-2026: si el corte YA PASÓ, ese día no puede ser el corte. Un evento
     con fecha vieja no suena nunca, y su cifra tampoco es la que le van a
     cobrar: al socio con 20 días encima el calendario le decía 40.001 mientras
     la tarjeta y el Panel decían 80.001. Dos cifras de la misma deuda, que es
     justo lo que le hace perder la razón a Joan aunque la tenga. Entonces el
     recordatorio es de HOY y lleva el total de hoy, recargo incluido. Si el
     corte todavía no llegó no cambia nada: sigue siendo el del corte. */
  var ciclo = cicloDelCredito(c);
  var hoy = hoyISO();
  var corte = String(c.corte || '').slice(0, 10) || hoy;
  var vencido = corte < hoy;
  var dia = vencido ? hoy : corte;
  var q = liquidacion(c, dia);
  var total = q.total_a_pagar;
  var f = dia.replace(/-/g, '');
  var sello = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  var quien = nombreJoan();
  var desc = 'Total a pagar: ' + COP(total) + ' (' + ciclo.etiqueta_capital.toLowerCase() + ' ' +
    COP(q.capital) + ' + costo ' + COP(q.costo) +
    (q.recargo_mora ? ' + recargo de ' + q.dias_mora + ' día' + (q.dias_mora !== 1 ? 's' : '') +
                      ' ' + COP(q.recargo_mora) : '') + '). ' +
    /* §4-bis: la cifra la trae la liquidación, que ya sabe si este crédito
       viene de una mora; la frase tiene que decir lo mismo que la cifra, o el
       recordatorio promete el doble de lo que el Panel va a acreditar.

       Y la rama se decide por los DÍAS, no por el recargo. 5-ago-2026: el 1%
       diario corre sobre el capital que queda, así que un socio que abonó casi
       todo el capital tiene días de atraso con recargo redondeado a cero. Mirando
       el recargo, este recordatorio se iba por la rama del crédito al día y le
       prometía el doble de lo que el Panel acredita, sobre un evento que él mismo
       fecha HOY porque el corte ya pasó. Pasaba en 177 de 4.000 estados. La
       tarjeta de Inicio ya lo hacía bien dos funciones arriba
       (var enMora = q.dias_mora > 0) y las dos pantallas se contradecían.

       5-ago-2026: y ahora van también los PESOS de las dos opciones. "El doble"
       describe la relación entre FACTOR_GARANTIA y FACTOR_GARANTIA_MORA, que hoy
       sigue siendo exacta (0,75 y 0,375) pero que ya cambió de valores una vez
       sin que esta frase se enterara; los pesos salen de la liquidación y no
       pueden quedar viejos. Se dicen las dos cosas, no una en lugar de la otra:
       pruebas/motor.test.js fija la frase "el doble de lo que sube pagando tarde"
       en esta función, así que quien la quite tiene que tocar la prueba en el
       mismo movimiento — y ese es justo el momento de comprobar si los dos
       factores siguen siendo mitad y doble. */
    (q.dias_mora > 0
      ? 'Aunque te atrases sigues siendo socio, y este pago te suma ' +
        COP(q.garantia_generada) + ' de garantía. '
      : q.credito_estuvo_en_mora
        ? 'Pagando en fecha tu cupo sube ' + COP(q.garantia_si_puntual) +
          '. Es lo que suma un crédito que ya se atrasó una vez, y eso no se borra: la prórroga ' +
          'compró tiempo, no puntualidad. '
        : 'Pagando en fecha tu cupo sube ' + COP(q.garantia_si_puntual) +
          ', el doble de lo que sube pagando tarde (' + COP(q.garantia_si_tarde) + '). ') +
    'Si ese día no puedes pagar todo, se puede dejar una prórroga o pasar a un plan de pagos; ' +
    'las dos cosas tienen costo y te lo decimos antes. Y aunque te atrases sigues siendo socio.';
  /* Un recordatorio de hoy no puede avisar "en 2 días": ese aviso ya pasó. */
  var alarmas = vencido ? [] : [
    'BEGIN:VALARM', 'TRIGGER:-P2D', 'ACTION:DISPLAY',
    'DESCRIPTION:' + textoICS('En 2 días vence tu pago de ' + COP(total) + ' con ' + quien),
    'END:VALARM'
  ];
  return plegarICS([
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tu Garantia//Socios//ES',
    'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
    'UID:' + (c.codigo || 'credito') + '-' + f + '@joantepresta',
    'DTSTAMP:' + sello, 'DTSTART:' + f + 'T090000', 'DTEND:' + f + 'T093000',
    'SUMMARY:' + textoICS('Pagar ' + COP(total) + ' a ' + quien),
    'DESCRIPTION:' + textoICS(desc)
  ].concat(alarmas).concat([
    'BEGIN:VALARM', 'TRIGGER:PT0S', 'ACTION:DISPLAY',
    'DESCRIPTION:' + textoICS((vencido ? 'Hoy tienes que pagar ' : 'Hoy vence tu pago de ') +
                              COP(total) + ' con ' + quien),
    'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'
  ]));
}
function recordarme() {
  var c = S.activo;
  if (!c) return alert('No tienes ningún crédito abierto para recordar.');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([armarICS(c)], { type: 'text/calendar;charset=utf-8' }));
  a.download = 'pago-' + (c.codigo || 'credito') + '.ics';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  $('recordarPie').innerHTML = 'Listo. Ábrelo y toca “Agregar” para que quede en tu calendario. ' +
    'Te avisa <b>dos días antes</b> y otra vez el mismo día.';
}

/* ======================= PEDIR EL CRÉDITO ======================= */
function codigoSolicitud(s, monto) {
  var resp = MODO === 'respaldado';
  var paq = { n: S.nombre, c: S.codigo || '', d: S.cedula || '',
    k: s.capital, t: resp ? s.tasa_mensual : s.tasa,
    o: resp ? s.costo_total : s.costo, p: s.total_a_pagar,
    f: resp ? s.ultima_fecha : s.fecha_corte, g: S.garantia, u: S.cupo,
    x: resp ? (s.dentro_del_respaldo ? 0 : 1) : (monto > S.cupo ? 1 : 0),
    pr: resp ? 'respaldado' : 'quincenal', pz: resp ? s.plazo_meses : null };
  var bytes = new TextEncoder().encode(JSON.stringify(paq));
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/* La misma simulación que ve el socio en la calculadora, para que la pantalla
   de confirmación no pueda decir otra cosa que la de atrás. */
function simulacionDeAhora() {
  var op = { nivelSocio: S.nivel, fechaDesembolso: hoyISO() };
  return MODO === 'respaldado'
    ? M.simularPrestamoRespaldado(Math.max(1, MONTO), PLAZO, entradaMotor(), op)
    : M.simularCredito(MONTO, S.gd.base_cupo, op);
}

function pedirCredito() {
  var resp = MODO === 'respaldado', s = simulacionDeAhora();
  var h = '<div class="card"><h3 class="tit">Revisa antes de pedir</h3>' +
    '<p class="sub">Esto es todo lo que hay. No hay cobros escondidos ni letra chica.</p>' +
    '<div class="cifra">' + COP(s.capital) + '</div>' +
    '<div class="muted" style="font-size:13px">es lo que recibirías</div>' +
    (resp
      ? fila('Costo (' + pct(s.tasa_mensual) + ' al mes × ' + s.plazo_meses + ')', COP(s.costo_total)) +
        fila('Cuota, cada mes', COP(s.cuota_tipica)) +
        fila('Primera cuota', fmtFecha(s.primera_fecha)) +
        fila('Última cuota', fmtFecha(s.ultima_fecha)) +
        fila('Total a devolver', COP(s.total_a_pagar))
      : fila('Costo por la quincena (' + pct(s.tasa) + ')', COP(s.costo)) +
