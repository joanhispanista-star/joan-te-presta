    '<div class="sep"></div>' +
    fila('Tu cupo hoy', COP(S.cupo)) +
    fila(resp ? 'Tu cupo cuando lo termines' : 'Tu cupo después de pagarlo', COP(s.cupo_despues)) +
    (resp
      ? '<div class="aviso info">Mientras lo pagas, <b>' + COP(s.garantia_comprometida) + '</b> de tu ' +
        'garantía quedan comprometidos y no cuentan para tu cupo quincenal. Se sueltan a medida que ' +
        'devuelves capital.</div>' +
        (s.dentro_del_respaldo ? ''
          : '<div class="aviso ambar">Estás pidiendo más que tu garantía ganada. Puedes pedirlo igual: ' +
            'lo revisamos y te respondemos.</div>')
      : (!s.dentro_del_cupo
        ? '<div class="aviso ambar">Estás pidiendo más que tu cupo. Puedes pedirlo igual: ' +
          'lo revisamos y te respondemos.</div>'
        : '')) +
    /* Las dos salidas cuestan, y el plan además tiene entrada. Decir solo que
       existen suena a que son gratis, y el día del cobro la sorpresa es del
       socio. Acá se nombra el costo y las reglas lo explican entero. */
    '<div class="aviso">Si llegado el día no puedes pagar todo, no se te cierra nada: puedes dejar ' +
    'una prórroga o pasar a un plan de pagos. Las dos cosas tienen costo —el plan arranca con una ' +
    'entrada del ' + pct(M.TASA_CREDITO) + '— y está todo explicado en <b>Cómo funciona esto</b>. ' +
    'Y aunque te atrases, sigues siendo socio.</div>' +
    '<button class="btn ' + (resp ? 'azul' : '') + ' arriba" onclick="mandarSolicitud(' + MONTO + ')">' +
      'Mandar la solicitud' + '</button>' +
    '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="irA(\'calc\')">Volver</button>' +
    '</div>';
  $('cuerpo').innerHTML = '<div class="panel">' + h + '</div>';
  window.scrollTo(0, 0);
}

function mandarSolicitud(monto) {
  var resp = MODO === 'respaldado', s = simulacionDeAhora();
  var fechaFin = resp ? s.ultima_fecha : s.fecha_corte;
  var costo = resp ? s.costo_total : s.costo;
  var seExcede = resp ? !s.dentro_del_respaldo : (monto > S.cupo);

  if (CFG.url && CFG.anon && S.cedula && S.tel4) {
    fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/crear_solicitud', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: CFG.anon, Authorization: 'Bearer ' + CFG.anon },
      body: JSON.stringify({
        p_cedula: S.cedula, p_tel4: S.tel4,
        p_producto: resp ? 'respaldado' : 'quincenal',
        p_plazo: resp ? s.plazo_meses : null,
        p_datos: { capital: s.capital, tasa: resp ? s.tasa_mensual : s.tasa, costo: costo,
          total: s.total_a_pagar, fecha_corte: fechaFin, garantia: S.garantia, cupo: S.cupo,
          sobre_cupo: seExcede, producto: resp ? 'respaldado' : 'quincenal',
          plazo_meses: resp ? s.plazo_meses : null }
      })
    }).catch(function () {});
  }

  var texto = 'Hola, soy ' + S.nombre +
    (S.codigo ? ' (' + S.codigo + ')' : '') +
    (resp ? '. Quiero pedir un préstamo con garantía:\n\n' : '. Quiero pedir un crédito:\n\n') +
    '• Monto: ' + COP(s.capital) + '\n' +
    (resp
      ? '• Costo (' + pct(s.tasa_mensual) + ' al mes × ' + s.plazo_meses + '): ' + COP(costo) + '\n' +
        '• Cuota, cada mes: ' + COP(s.cuota_tipica) + '\n' +
        '• Total a devolver: ' + COP(s.total_a_pagar) + '\n' +
        '• Última cuota: ' + fmtFecha(fechaFin) + '\n\n' +
        'Mi garantía ganada es ' + COP(s.respaldo_disponible) + '.' +
        (seExcede ? ' Sé que me estoy pasando, cuéntame si se puede.' : '')
      : '• Costo (' + pct(s.tasa) + '): ' + COP(costo) + '\n' +
        '• Total a devolver: ' + COP(s.total_a_pagar) + '\n' +
        '• Fecha de pago: ' + fmtFecha(fechaFin) + '\n\n' +
        'Mi cupo es ' + COP(S.cupo) + '.' +
        (seExcede ? ' Sé que me estoy pasando del cupo, cuéntame si se puede.' : '')) +
    '\n\nGracias.\n\n· · ·\nSOL:' + codigoSolicitud(s, monto);
  porWhatsApp(texto);

  $('cuerpo').innerHTML = '<div class="panel"><div class="card">' +
    '<h3 class="tit" style="text-align:center">Solicitud enviada</h3>' +
    '<p class="sub" style="text-align:center">Se abrió WhatsApp con tu solicitud lista. ' +
    'Si no se abrió, escríbenos directamente.</p>' +
    '<div class="aviso">Pediste <b>' + COP(s.capital) + '</b> para devolver <b>' + COP(s.total_a_pagar) +
    '</b>' + (resp ? ' en ' + s.plazo_meses + ' cuotas, la última el ' : ' el ') + fmtFecha(fechaFin) + '.</div>' +
    '<button class="btn sec" style="margin-top:var(--e3)" onclick="irA(\'inicio\')">Volver al inicio</button>' +
    '</div></div>';
  window.scrollTo(0, 0);
}

/* ========================== MI GARANTÍA ==========================
   La grande es el total. Ganada y prestada NUNCA comparten cifra: van una
   arriba de la otra, con su barra, para que se lean como partes de la misma
   cosa. Y "prestada" se explica en la misma línea, nunca va sola. */
function parteGarantia(etiqueta, explica, valor, clase, ancho) {
  return '<div class="fila"><span class="k">' + esc(etiqueta) +
    '<span style="display:block;font-size:12px;margin-top:var(--e1)">' + esc(explica) + '</span></span>' +
    '<span class="v ' + clase + '">' + esc(valor) + '</span></div>' +
    '<div class="barra"><i class="' + clase + '" style="width:' + ancho + '%"></i></div>';
}

function vistaGarantia() {
  var g = S.g, gd = S.gd;
  var tot = Math.max(1, gd.total);
  var anc = function (v) { return Math.max(2, Math.min(100, Math.round(v / tot * 100))); };

  var h = '<div class="card laca"><div class="etq">Tu garantía</div>' +
    '<div class="cifra oro">' + COP(S.garantia) + '</div>' +
    parteGarantia('Ganada', 'pagando tus créditos', COP(gd.ganada), 'oro', anc(gd.ganada)) +
    parteGarantia('Prestada', 'por tus datos, para arrancar', COP(gd.prestada), 'prestada', anc(gd.prestada)) +
    (gd.comprometida > 0
      ? parteGarantia('Comprometida', 'en tu préstamo con garantía', '−' + COP(gd.comprometida),
                      'comprometida', anc(gd.comprometida))
      : '') +
    '<div class="sep"></div>' +
    /* El cupo es lo construido, igual que en Inicio: mismo amarillo, misma laca. */
    '<div class="fila"><span class="k">' +
      (gd.comprometida > 0 ? 'Con eso puedes pedir hoy' : 'Con eso puedes pedir') +
      '</span><span class="v oro">' + esc(COP(S.cupo)) + '</span></div>' +
    '<div class="fila"><span class="k">' +
      (gd.comprometida > 0 ? 'Te queda de préstamo con garantía' : 'Con la ganada, préstamo hasta') +
      '</span><span class="v azul">' + COP(S.maxRespaldado) + '</span></div>' +
    '</div>';

  if (S.maxRespaldado > 0) {
    h += '<div class="card respaldo"><div class="etq r">Préstamo con garantía</div>' +
      '<p style="margin:var(--e2) 0 0;font-size:14.5px">' + esc(M.reglasResumen().respaldado.texto) + '</p>' +
      '<button class="btn azul sm arriba" onclick="irACalcRespaldado()">Calcular uno</button></div>';
  }

  /* --- Perfil --- */
  var yaTiene = M.garantiaPorDatos(S.perfil);
  var conNuevos = {};
  Object.keys(S.perfil).forEach(function (k) { conNuevos[k] = S.perfil[k]; });
  Object.keys(NUEVOS).forEach(function (k) { conNuevos[k] = NUEVOS[k]; });
  var enCamino = M.garantiaPorDatos(conNuevos).total - yaTiene.total;

  h += '<div class="card"><h3 class="tit">Completa tu perfil</h3>' +
    '<p class="sub">Te prestamos garantía por cada dato que nos des. Con todo completo son ' +
    COP(M.CUPON_KYC_MAXIMO) + ', y eso es cupo desde el primer día.</p>' +
    '<div class="cifra sm">' + COP(yaTiene.total) +
      '<span class="muted" style="font-size:15px;font-weight:400"> de ' + COP(M.CUPON_KYC_MAXIMO) + '</span></div>' +
    '<div class="barra"><i style="width:' + Math.max(3, yaTiene.porcentaje) + '%"></i></div>' +
    '<div class="muted" style="font-size:13px;margin-top:var(--e2)">' + yaTiene.porcentaje + '% completo' +
      (enCamino > 0 ? ' · <b>+' + COP(enCamino) + ' en camino</b>' : '') + '</div>';

  if (yaTiene.completos.length) {
    h += '<div class="muted" style="font-size:13px;margin-top:var(--e3)">✓ ' + yaTiene.completos.length +
      ' dato' + (yaTiene.completos.length !== 1 ? 's' : '') + ' ya cargado' +
      (yaTiene.completos.length !== 1 ? 's' : '') + '</div>';
  }
  if (yaTiene.faltantes.length) {
    h += '<div style="margin-top:var(--e3)">' + yaTiene.faltantes.map(function (d) {
      return '<div class="dato' + (NUEVOS[d.id] ? ' ok' : '') + '">' +
        '<span class="tick">' + (NUEVOS[d.id] ? '✓' : '') + '</span>' +
        '<span class="txt"><span class="nm" style="font-size:14px;font-weight:600">' + esc(d.etiqueta) + '</span>' +
        '<span class="ay">' + esc(NUEVOS[d.id] ? 'Listo para mandarlo' : d.ayuda) + '</span></span>' +
        '<span class="vl">+' + COPc(d.valor) + '</span></div>';
    }).join('') + '</div>' +
    '<button class="btn" style="margin-top:var(--e4)" onclick="abrirPerfil()">Completar y ganar ' +
      COP(M.CUPON_KYC_MAXIMO - yaTiene.total) + '</button>';
  } else {
    h += '<div class="aviso" style="margin-top:var(--e3)">Tienes el perfil completo. Ya te ganaste los ' +
      COP(M.CUPON_KYC_MAXIMO) + ' de garantía prestada.</div>';
  }
  h += '</div>';

  /* --- Referidos --- */
  var r = S.referidos;
  h += '<div class="card"><h3 class="tit">Trae gente, gana cupo</h3>' +
    '<p class="sub">Cada persona que traigas te suma ' + COP(M.GARANTIA_POR_REFERIDO) +
    ', desde que esa persona pague su crédito. Si no paga, no suma.</p>' +
    fila('Gente que has traído', String(r.total || 0)) +
    fila('Ya pagaron', String(r.pagaron || 0)) +
    fila('Garantía que te dieron', COP((r.pagaron || 0) * M.GARANTIA_POR_REFERIDO)) +
    ((r.total || 0) > (r.pagaron || 0)
      ? '<div class="aviso ambar">Te faltan ' + ((r.total || 0) - (r.pagaron || 0)) +
        ' por pagar. Cuando lo hagan se te suman ' + COP(((r.total || 0) - (r.pagaron || 0)) * M.GARANTIA_POR_REFERIDO) + '.</div>'
      : '') +
    '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="invitar()">Invitar a alguien</button>' +
    '</div>';

  /* --- Niveles ---
     5-ago-2026 — ESTA TARJETA SE LLAMABA "Cuánto podrías pedir si subes de
     nivel" Y PINTABA UN CUPO DISTINTO POR NIVEL. Ya no: el cupo es la garantía
     uno a uno, así que proyeccionNiveles devuelve el MISMO cupo en los cuatro
     —a propósito, para que ninguna pantalla pueda insinuar una diferencia que no
     existe— y pintar esa columna sería mostrarle cuatro veces la misma cifra
     como si fuera una escalera. Lo que de verdad cambia por nivel son las
     prórrogas, y eso es lo que ocupa la columna ahora.
     `mueve_el_cupo` se lee de verdad, no se asume: el día que el motor vuelva a
     mover el cupo por nivel, esta tarjeta lo va a decir sola en vez de callarlo. */
  var niveles = M.proyeccionNiveles(gd.base_cupo, S.nivel);
  var nivelMueveElCupo = niveles.some(function (n) { return n.mueve_el_cupo; });
  h += '<div class="card"><h3 class="tit">Tus niveles</h3>' +
    '<p class="sub">' + esc(M.reglasResumen().niveles_texto) + '</p>' +
    '<div style="margin-top:var(--e2)">' + niveles.map(function (n) {
      return '<div class="nivel ' + (n.actual ? 'aqui' : '') + '">' +
        '<span class="txt"><span class="nm">' + n.nivel + (n.actual ? ' · aquí estás' : '') + '</span>' +
        '<span class="rq">' + requisitoTexto(n) + '</span></span>' +
        '<span class="cp">' + (nivelMueveElCupo ? COP(n.cupo) : prorrogasTexto(n.prorrogas)) + '</span></div>';
    }).join('') + '</div>' +
    /* Y acá se dice de dónde sí sale el cupo, en la misma tarjeta donde antes se
       prometía que salía del nivel: el que llegue leyendo la columna no se queda
       con la idea vieja. Sobre base_cupo, la misma base con la que se calculó
       S.cupo arriba, para que las dos cifras no se contradigan a un dedo. */
    '<div class="muted" style="font-size:13px;margin-top:var(--e3)">Tu cupo hoy es <b>' +
      COP(M.calcularCupo(gd.base_cupo, S.nivel)) + '</b>' +
      (gd.comprometida > 0 ? ', con lo que tienes libre' : '') +
      ', y sube un ' + pct(M.reglasResumen().cupo.crecimiento_por_credito) +
      ' con cada crédito que pagues en fecha. La plataforma presta hasta <b>' +
      COP(M.CUPO_MAXIMO) + '</b>.</div>' +
    '</div>';

  return h + pie();
}

/* QUÉ PIDE UN NIVEL. 5-ago-2026: acá terminaba en "· 2× tu garantía", que era el
   factor de cupo. El factor está derogado y ni siquiera viaja —`n.factor` daba
   `undefined`, o sea que la línea se leía "· undefined× tu garantía"—, así que
   esta función se queda con lo único que le corresponde: qué hay que hacer para
   llegar. Lo que el nivel DA se dice al lado, en prorrogasTexto. */
function requisitoTexto(n) {
  if (n.nivel === 'bronce') return 'Desde que entras';
  var r = n.requisitos, p = [];
  if (r.pagos_a_tiempo) p.push(r.pagos_a_tiempo + ' pagos en fecha');
  if (r.racha) p.push('racha de ' + r.racha);
  if (r.meses_sin_mora) p.push(r.meses_sin_mora + ' meses sin atrasarte');
  return p.length ? p.join(' · ') : 'Desde que entras';
}

/* LO QUE DA EL NIVEL, y es lo único que da: cuántas veces puede aplazar un
   corte. Sale de PRORROGAS_POR_NIVEL a través del motor, nunca de una tabla
   escrita acá. */
function prorrogasTexto(n) {
  var k = Math.max(0, Math.round(Number(n) || 0));
  return k === 1 ? '1 prórroga' : k + ' prórrogas';
}
/* Lo mismo dicho como verbo, para las frases: "aplazar hasta 2 prórrogas" no se
   dice; "aplazar hasta dos veces", sí. */
function vecesTexto(n) {
  var k = Math.max(0, Math.round(Number(n) || 0));
  return k === 1 ? 'una vez' : (k === 2 ? 'dos veces' : k + ' veces');
}

/* ========================== HISTORIAL ========================== */
function vistaHistorial() {
  var totalGarantia = S.creditos.reduce(function (t, c) { return t + Number(c.garantia || 0); }, 0);
  /* Lo construido va en amarillo, acá y en Mi garantía: es la misma plata y no
     puede cambiar de significado según la pestaña. */
  var h = '<div class="card laca"><div class="etq">Lo que llevas construido</div>' +
    '<div class="cifra oro">' + COP(totalGarantia) + '</div>' +
    '<div class="muted" style="font-size:13.5px;margin-top:var(--e2)">de garantía ganada en ' +
      S.creditos.length + ' crédito' + (S.creditos.length !== 1 ? 's' : '') + '</div>' +
    (S.resumen.primer_credito ? fila('Eres socio desde', fmtFecha(S.resumen.primer_credito)) : '') +
    fila('Pagos en fecha seguidos', String(S.g.racha || 0)) + '</div>';

  h += '<div class="card"><h3 class="tit">Crédito por crédito</h3>' +
    '<p class="sub">Cuánto cupo te dejó cada uno.</p>';
  if (!S.creditos.length) h += '<p class="muted" style="margin-top:var(--e3)">Todavía no tienes créditos.</p>';
  else S.creditos.forEach(function (c) {
    var puntual = c.fecha_pagado && c.corte && c.fecha_pagado <= c.corte;
    /* La mora también se ve acá. Antes esta píldora era gris para todo, y el
       crédito que en Inicio grita "9 DÍAS DE ATRASO" en ámbar aparecía en
       Historial como un "En curso" tranquilo, igual que los pagados: dos
       pantallas de la misma app contando estados distintos del mismo crédito.
       Mismas palabras y mismo ámbar que en la tarjeta de Inicio.
       Y los días son los MISMOS de la tarjeta de Inicio porque salen del mismo
       lado: los que liquidó el puente, no una segunda cuenta hecha acá. */
    var atraso = c.pagado ? 0
      : (c.dias_mora != null ? Math.max(0, Number(c.dias_mora) || 0) : diasDeAtraso(c.corte));
    var estado = c.pagado
      ? (puntual ? 'Pagado en fecha' : 'Pagado')
      : (atraso > 0 ? atraso + ' día' + (atraso !== 1 ? 's' : '') + ' de atraso' : 'En curso');
    /* Acá manda el crédito ENTERO, no el ciclo: `capital` viaja como el capital
       de la cuota cuando hay plan de pagos, y en un listado de créditos esa
       cifra diría que el socio pidió 200.000 cuando pidió 600.000. */
    var suCapital = c.saldo_capital != null ? c.saldo_capital : c.capital;
    h += '<div class="credito"><div class="top">' +
      '<div><b>' + COP(suCapital) + '</b><div class="cod">' + esc(c.codigo || '') + '</div></div>' +
      '<span class="pill' + (atraso > 0 ? ' ambar' : '') + '">' + esc(estado) + '</span></div>' +
      '<div class="muted" style="font-size:13px;margin-top:var(--e2)">' +
        fmtFecha(c.desembolso) + ' → ' + fmtFecha(c.fecha_pagado || c.corte) +
        (c.prorrogas ? ' · ' + c.prorrogas + ' prórroga' + (c.prorrogas !== 1 ? 's' : '') : '') +
        /* Un crédito en plan de pagos se veía igualito a uno normal, y no lo es:
           lo que se cobra es la cuota, no el capital. Se dice. */
        (Number(c.plan_cuotas || 0) > 0
          ? ' · plan de pagos, ' + Number(c.plan_cuotas_pagadas || 0) + ' de ' +
            Number(c.plan_cuotas) + ' cuotas pagadas' : '') + '</div>' +
      '<div class="gan"><span class="muted">Garantía que te dejó</span>' +
        (c.garantia ? '<b>+' + COP(c.garantia) + '</b>' : '<span class="muted">al pagarlo</span>') + '</div>' +
      '</div>';
  });
  h += '</div>';

  if (S.respaldados.length) {
    h += '<div class="card"><h3 class="tit">Tus préstamos con garantía</h3>' +
      '<p class="sub">Los que pediste contra la garantía que ya te habías ganado.</p>' +
      S.respaldados.map(function (r) {
        var cs = r.cuotas || [];
        var pagas = cs.filter(function (c) { return c.pagado; }).length;
        /* Igual que arriba: una cuota que ya venció y no está paga es un
           atraso, y el atraso se dice en ámbar, no en gris. */
        var hoy = hoyISO();
        var vencidas = r.pagado ? 0 : cs.filter(function (c) {
          return !c.pagado && c.fecha && String(c.fecha).slice(0, 10) < hoy; }).length;
        var estado = r.pagado ? 'Pagado'
          : (vencidas > 0 ? vencidas + ' cuota' + (vencidas !== 1 ? 's' : '') +
                            ' vencida' + (vencidas !== 1 ? 's' : '')
                          : 'En curso');
        return '<div class="credito"><div class="top">' +
          '<div><b>' + COP(r.capital) + '</b><div class="cod">' + esc(r.codigo || '') + '</div></div>' +
          '<span class="pill' + (vencidas > 0 ? ' ambar' : '') + '">' + esc(estado) + '</span></div>' +
          '<div class="muted" style="font-size:13px;margin-top:var(--e2)">' +
            (cs.length || r.plazo_meses) + ' cuotas · ' + pagas + ' pagada' + (pagas !== 1 ? 's' : '') + '</div>' +
          '<div class="gan"><span class="muted">Te falta de capital</span><b>' + COP(r.saldo_capital) + '</b></div>' +
          '</div>';
      }).join('') + '</div>';
  }

  h += '<div class="card"><h3 class="tit">Lo que has logrado</h3>' + insignias() + '</div>';
  return h + pie();
}

function insignias() {
  var puntuales = S.pagados.filter(function (c) { return c.fecha_pagado && c.corte && c.fecha_pagado <= c.corte; });
  var orden = M.NIVELES;
  var lista = [
    { em: '🌱', t: 'Primer crédito', ok: S.creditos.length >= 1 },
    { em: '✅', t: 'Primer pago en fecha', ok: puntuales.length >= 1 },
    { em: '🔥', t: 'Racha de 3', ok: Number(S.g.racha || 0) >= 3 },
    { em: '⚡', t: 'Racha de 10', ok: Number(S.g.racha || 0) >= 10 },
    { em: '🥇', t: 'Llegaste a Oro', ok: orden.indexOf(S.nivel) >= 2 },
    { em: '🤝', t: 'Trajiste a alguien', ok: (S.referidos.pagaron || 0) >= 1 },
    { em: '📋', t: 'Perfil completo', ok: M.garantiaPorDatos(S.perfil).total >= M.CUPON_KYC_MAXIMO },
    { em: '💪', t: '5 créditos pagados', ok: S.pagados.length >= 5 }
  ];
  var ganadas = lista.filter(function (i) { return i.ok; });
  var proxima = lista.filter(function (i) { return !i.ok; })[0];
  if (!ganadas.length) return '<p class="muted" style="margin-top:var(--e3)">Todavía ninguna. La primera llega con tu primer crédito.</p>';
  return '<div class="insignias">' +
    ganadas.map(function (i) { return '<span class="ins"><em>' + i.em + '</em>' + esc(i.t) + '</span>'; }).join('') +
    (proxima ? '<span class="ins proxima"><em>' + proxima.em + '</em>Sigue: ' + esc(proxima.t) + '</span>' : '') +
    '</div>';
}

/* ==================== COMPLETAR EL PERFIL ==================== */
/* ====================== AUTORIZACIÓN DE DATOS (habeas data) ======================
   Ley 1581 de 2012 y Decreto 1377 de 2013. La autorización tiene que ser PREVIA a
   recoger el dato, expresa e informada, y tiene que poder PROBARSE después. Por eso:

   · va antes de abrirPerfil(), que es donde se pide el primer dato — no al entrar a la
     app, porque entrar a mirar el saldo no recoge nada;
   · los datos sensibles (la selfie con la cédula, que es biométrico, y la ubicación)
     llevan su PROPIA casilla, aparte y opcional: la ley prohíbe condicionar el servicio
     a que los entregue, y aquí de verdad no se condiciona — solo suma menos garantía;
   · se guarda la fecha y la VERSIÓN del texto. Si mañana cambia la política, sube
     VERSION_AUTORIZACION y se vuelve a pedir sola;
   · y el texto de la autorización viaja en el WhatsApp que el socio manda con sus datos,
     que es lo que le deja a Joan la constancia por escrito.

   Se guarda por cédula, no global: en un teléfono prestado no queda autorizando el de
   al lado. */
var VERSION_AUTORIZACION = '2026-08-04';

function llaveAutorizacion() { return 'tg_autorizacion_' + (S && S.cedula ? S.cedula : 'anon'); }

function autorizacionDada() {
  try {
    var a = JSON.parse(localStorage.getItem(llaveAutorizacion()) || 'null');
    return a && a.version === VERSION_AUTORIZACION ? a : null;
  } catch (e) { return null; }
}

function pantallaAutorizacion() {
  $('cuerpo').innerHTML = '<div class="panel"><div class="card">' +
    '<h3 class="tit">Antes de pedirte tus datos</h3>' +
    '<p class="sub">La ley nos obliga a pedirte permiso antes de guardar nada tuyo, y nos parece bien: ' +
    'son tuyos. Esto se lee en un minuto.</p>' +

    '<div class="aviso" style="margin-top:var(--e4)">' +
    '<b>Qué vamos a hacer con ellos.</b> Guardarlos para confirmar quién eres, decidir tu crédito, ' +
    'llevar tu historial y escribirte por WhatsApp sobre tus pagos. Nada más. No los vendemos, ' +
    'no los pasamos a nadie con fines comerciales y no te mandamos publicidad de otros.' +
    '</div>' +

    '<div class="aviso" style="margin-top:var(--e3)">' +
    '<b>Tus derechos.</b> Puedes pedirnos en cualquier momento que te digamos qué tenemos tuyo, ' +
    'que lo corrijamos, que lo borremos, o retirar este permiso. Es gratis y no te cuesta el ' +
    'servicio. También puedes quejarte ante la Superintendencia de Industria y Comercio.' +
    '</div>' +

    '<label class="permiso"><input type="checkbox" id="autGeneral" onchange="revisarAutorizacion()">' +
    '<span>Autorizo que guarden y usen mis datos para lo que dice arriba, y confirmo que leí los ' +
    '<a href="../legal/terminos.html" target="_blank" rel="noopener">términos</a> y la ' +
    '<a href="../legal/privacidad.html" target="_blank" rel="noopener">política de datos</a>.' +
    '</span></label>' +

    '<label class="permiso"><input type="checkbox" id="autSensible" onchange="revisarAutorizacion()">' +
    '<span>Autorizo además la <b>selfie con mi cédula</b> y <b>mi ubicación en el mapa</b>. ' +
    '<span class="muted">Esto es opcional de verdad: si dices que no, tu cuenta funciona igual, ' +
    'solo arrancas con menos garantía.</span></span></label>' +

    '<button class="btn" id="btnAut" disabled onclick="aceptarAutorizacion()">Autorizo y continúo</button>' +
    '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="irA(\'garantia\')">Ahora no</button>' +
    '</div></div>';
  window.scrollTo(0, 0);
}

function revisarAutorizacion() {
  $('btnAut').disabled = !$('autGeneral').checked;
}

function aceptarAutorizacion() {
  if (!$('autGeneral').checked) return;
  try {
    localStorage.setItem(llaveAutorizacion(), JSON.stringify({
      version: VERSION_AUTORIZACION,
      fecha: hoyISO(),
      general: true,
      sensibles: $('autSensible').checked
    }));
  } catch (e) { /* sin espacio: seguimos igual, la constancia va en el WhatsApp */ }
  abrirPerfil();
}

function abrirPerfil() {
  var aut = autorizacionDada();
  if (!aut) return pantallaAutorizacion();
  var faltan = M.garantiaPorDatos(S.perfil).faltantes;
  /* Si no autorizó los sensibles, no se los pedimos ni de adorno: pedir un dato que
     la persona acaba de negar es exactamente la presión que la ley prohíbe. */
  if (!aut.sensibles) {
    faltan = faltan.filter(function (d) { return d.id !== 'foto_selfie' && d.id !== 'ubicacion'; });
  }
  var h = '<div class="card"><h3 class="tit">Completa lo que te falta</h3>' +
    '<p class="sub">Escribe lo que puedas. Al final lo mandas por WhatsApp y lo cargamos; ' +
    'ahí tu cupo sube de verdad.</p>' +
    faltan.map(function (d) {
      if (d.tipo === 'foto' || d.tipo === 'mapa') {
        return '<div class="dato"><span class="tick">·</span><span class="txt">' +
          '<span class="nm" style="font-size:14px;font-weight:600">' + esc(d.etiqueta) + '</span>' +
          '<span class="ay">Esto se lo mandas por WhatsApp como foto</span></span>' +
          '<span class="vl">+' + COPc(d.valor) + '</span></div>';
      }
      if (d.tipo === 'si') {
        return '<label>' + esc(d.etiqueta) + ' <span class="muted">+' + COP(d.valor) + '</span></label>' +
          '<select data-kyc="' + d.id + '" onchange="tocarDato(this)">' +
          '<option value="">Elige…</option><option value="si">Sí</option></select>';
      }
      return '<label>' + esc(d.etiqueta) + ' <span class="muted">+' + COP(d.valor) + '</span></label>' +
        '<input type="text" data-kyc="' + d.id + '" placeholder="' + esc(d.ayuda) + '" ' +
        'inputmode="' + (d.tipo === 'numero' ? 'numeric' : 'text') + '" oninput="tocarDato(this)">';
    }).join('') +
    '<div class="aviso" id="perfilSuma" style="margin-top:var(--e4)">Todavía no has escrito nada.</div>' +
    '<button class="btn" onclick="mandarPerfil()">Mandar mis datos</button>' +
    '<button class="btn sec sm" style="margin-top:var(--e3)" onclick="irA(\'garantia\')">Volver</button>' +
    '</div>';
  $('cuerpo').innerHTML = '<div class="panel">' + h + '</div>';
  window.scrollTo(0, 0);
}

function tocarDato(el) {
  var id = el.dataset.kyc, v = (el.value || '').trim();
  if (v) NUEVOS[id] = v; else delete NUEVOS[id];
  var suma = 0;
  M.DATOS_KYC.forEach(function (d) { if (NUEVOS[d.id]) suma += d.valor; });
  $('perfilSuma').innerHTML = suma
    ? 'Con lo que llevas escrito, tu garantía sube <b>' + COP(suma) + '</b> en cuanto lo carguemos.'
    : 'Todavía no has escrito nada.';
}

function mandarPerfil() {
  var ids = Object.keys(NUEVOS);
  if (!ids.length) return alert('Escribe al menos un dato para poder mandárselo.');
  var etq = {};
  M.DATOS_KYC.forEach(function (d) { etq[d.id] = d.etiqueta; });
  var suma = ids.reduce(function (t, id) {
    var d = M.DATOS_KYC.filter(function (x) { return x.id === id; })[0];
    return t + (d ? d.valor : 0);
  }, 0);
  /* La constancia de la autorización viaja en el mismo mensaje. Es lo que le deja a
     Joan la prueba por escrito, con fecha y versión, que es justo lo que la ley pide
     poder mostrar si alguien reclama. */
  var aut = autorizacionDada();
  var constancia = aut
    ? '\n\n— Autoricé el tratamiento de mis datos el ' + fmtFecha(aut.fecha) +
      ' (política del ' + aut.version + ')' +
      (aut.sensibles ? ', incluidos la selfie con cédula y la ubicación.' : '. No autoricé la selfie con cédula ni la ubicación.')
    : '';
  porWhatsApp('Hola, soy ' + S.nombre + '. Te mando mis datos para completar mi perfil:\n\n' +
    ids.map(function (id) { return '• ' + (etq[id] || id) + ': ' + NUEVOS[id]; }).join('\n') +
    '\n\nCon esto mi garantía sube ' + COP(suma) + '.' + constancia);
}

function invitar() {
  window.open('https://wa.me/?text=' + encodeURIComponent(
    'Te recomiendo ' + nombreJoan() + '. Yo ya soy socio: uno va pagando y le van subiendo el cupo, ' +
    'y si te atrasas no te cierran la puerta. Dile que vas de mi parte, que a los dos nos sirve.'
  ), '_blank', 'noopener');
}

/* ============================ PIE ============================ */
/* Los dos enlaces legales van en TODAS las pantallas, no escondidos en un rincón:
   quien firmó una autorización tiene derecho a volver a leer qué firmó cuando quiera,
   sin tener que pedírselo a nadie. */
function enlacesLegales() {
  return '<br><a href="../legal/terminos.html" target="_blank" rel="noopener" ' +
    'style="color:inherit">Términos</a> · ' +
    '<a href="../legal/privacidad.html" target="_blank" rel="noopener" ' +
    'style="color:inherit">Tus datos</a>';
}

function pie() {
  if (S.deEnlace) {
    return '<div class="pie">Estos son tus números al ' + fmtFecha(S.actualizado || hoyISO()) + '.<br>' +
      'Cuando pagues o pidas otro crédito, pídenos el enlace de nuevo.' +
      enlacesLegales() + '</div>';
  }
  return '<div class="pie">' + (S.actualizado ? 'Datos al ' + fmtFecha(S.actualizado) + '.<br>' : '') +
    (S.origen === 'panel' ? 'Datos del Panel de este equipo.<br>' : '') +
    'Si ves algo raro en tus números, escríbenos.' +
    enlacesLegales() +
    (S.esDemo ? '' : '<br><a href="#" onclick="salir();return false" style="color:inherit">Salir</a>') +
    '</div>';
}

function salir() {
  S = null; NUEVOS = {};
  MODO = 'quincenal'; PLAZO = 3;
  if (location.hash) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  pintarEntrar();
  mostrar('pEntrar');
}

/* ======================= CONFIGURACIÓN ======================= */
function pantallaConfig() {
  document.body.innerHTML =
    '<div class="cab laca"><div class="wrap"><div class="marca"><span class="pin">G</span> Tu Garantía</div>' +
    '<h1>Conectar la base</h1></div></div>' +
    '<div class="wrap"><div class="card">' +
    '<p class="sub" style="margin:0">Pega los dos datos de Supabase (Settings → API). ' +
    'Quedan guardados solo en este teléfono.</p>' +
    '<label>Project URL</label><input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co" value="' + esc(CFG.url) + '">' +
    '<label>Llave anon public</label><input type="text" id="cfgAnon" placeholder="eyJ..." value="' + esc(CFG.anon) + '">' +
    '<button class="btn" style="margin-top:var(--e4)" id="cfgGuardar">Guardar</button>' +
    '<button class="btn sec sm" style="margin-top:var(--e3)" id="cfgBorrar">Volver al modo de prueba</button>' +
    '<div id="cfgMsg" class="aviso oculto"></div></div></div>';
  $('cfgGuardar').onclick = function () {
    var u = $('cfgUrl').value.trim(), a = $('cfgAnon').value.trim();
    if (!u || !a) return alert('Faltan datos.');
    localStorage.setItem('socio_cfg', JSON.stringify({ url: u, anon: a }));
    $('cfgMsg').textContent = 'Guardado. Abre la página sin ?cfg para probarla.';
    $('cfgMsg').classList.remove('oculto');
  };
  $('cfgBorrar').onclick = function () {
    localStorage.removeItem('socio_cfg');
    $('cfgMsg').textContent = 'Listo, vuelve al modo de prueba.';
    $('cfgMsg').classList.remove('oculto');
  };
}

/* ========================== ARRANQUE ========================== */
(function () {
  if (location.search.indexOf('cfg') >= 0) return pantallaConfig();
  if (!M) {
    document.body.innerHTML = '<div class="wrap"><div class="aviso ambar" style="margin-top:calc(var(--e4) * 2)">' +
      'No pude cargar el motor de reglas (motor.js). Tiene que estar en la misma carpeta que esta página.</div></div>';
    return;
  }
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b && S) irA(b.dataset.t);
  });
  window.addEventListener('hashchange', function () {
    var nuevo = desdeEnlace(); if (nuevo) return abrir(nuevo, false);
    var p = desdePanel(); if (p) abrir(p, false);
  });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register("../sw.js").catch(function () {});
    });
  }

  pintarEntrar();

  /* Se quita la bienvenida cuando la app ya tiene algo que mostrar. Se le deja un
     mínimo de 700 ms desde que cargó la página: si se va antes, la animación del
     sello se corta a medias y el efecto es un parpadeo, que se ve peor que no
     tener nada. En un celular lento el tiempo ya se cumplió solo. */
  (function () {
    var h = document.getElementById('hola');
    if (!h) return;
    var falta = Math.max(0, 700 - (performance.now ? performance.now() : 700));
    setTimeout(function () { h.classList.add('fuera'); }, falta);
  })();

  var delEnlace = desdeEnlace();
  if (delEnlace) return abrir(delEnlace, false);

  /* "Ver la app como la ve él": Joan abre desde su Panel #p=cedula-4dígitos.
     El hash no viaja al servidor, y sin esos dos datos no abre nada. */
  var delPanel = desdePanel();
  if (delPanel) return abrir(delPanel, false);
})();
</script>
